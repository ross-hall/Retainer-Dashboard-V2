function initColumnResize(){
  let dragging = null;
  document.addEventListener('mousedown', e=>{
    const handle = e.target.closest('[data-resizecol]');
    if(!handle) return;
    e.preventDefault();
    const key = handle.dataset.resizecol;
    const isTasksAhead = handle.dataset.widthstore === 'tasksahead';
    const store = isTasksAhead ? state.tasksAheadColWidths : state.taskColWidths;
    const defaults = isTasksAhead ? TASKSAHEAD_COL_DEFAULTS : TASK_COL_DEFAULTS;
    dragging = { key, store, isTasksAhead, startX: e.clientX, startWidth: store[key] || defaults[key] };
    handle.classList.add('resizing');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const newWidth = Math.max(60, dragging.startWidth + (e.clientX - dragging.startX));
    dragging.store[dragging.key] = newWidth;
    const colsStr = dragging.isTasksAhead ? tasksAheadColumns() : taskGridColumns();
    document.querySelectorAll('.task-grid-row').forEach(row=> row.style.gridTemplateColumns = colsStr);
  });
  document.addEventListener('mouseup', ()=>{
    if(!dragging) return;
    document.querySelectorAll('.col-resize-handle.resizing').forEach(h=>h.classList.remove('resizing'));
    dragging = null;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}
initColumnResize();

/* ================= Animation (Beta) — shot pipeline grid ================= */
/* Animation is tracked per-SHOT, not per-stage. Every shot walks the same
   pipeline steps independently, so the grid below (shots down, steps across)
   makes a single stalled shot immediately visible instead of hiding it
   inside a stage-level "in progress". */

const ANIM_DEFAULT_STEPS = ['Storyboard','Animatic','Blocking','Animation','Render','Comp','Approved'];
const ANIM_CELL_STATUSES = {
  'Not started':      { color:'#e7e7ee', text:'#7b7d92', short:'–'  },
  'In progress':      { color:'#4C6EF5', text:'#fff',    short:'WIP'},
  'Internal review':  { color:'#F0B429', text:'#3a2c00', short:'IR' },
  'Client review':    { color:'#15AABF', text:'#fff',    short:'CR' },
  'Retakes':          { color:'#E8623D', text:'#fff',    short:'RT' },
  'Approved':         { color:'#2FB380', text:'#fff',    short:'✓'  },
  'Omitted':          { color:'#cfcfd8', text:'#7b7d92', short:'om' }
};

function animProjects(){
  const cfgNames = state.projectTypes.filter(t=>/anim/i.test(t.name)).map(t=>t.name);
  return state.projects.filter(p=>p.active && (cfgNames.includes(p.project_type) || /anim/i.test(p.project_type)));
}
function animShotsFor(projectId){ return state.animShots.filter(s=>s.project_id===projectId).sort((a,b)=>a.position-b.position); }
function animStepsFor(projectId){ return state.animSteps.filter(s=>s.project_id===projectId).sort((a,b)=>a.position-b.position); }
function animCell(shotId, stepId){ return state.animCells.find(c=>c.shot_id===shotId && c.step_id===stepId) || null; }
function animCellStatus(shotId, stepId){ const c = animCell(shotId, stepId); return c ? c.status : 'Not started'; }

/* A shot's overall position = the last step it has fully approved. */
function animShotProgress(shot, steps){
  let done = 0;
  for(const st of steps){ if(animCellStatus(shot.id, st.id)==='Approved') done++; else break; }
  return { done, total: steps.length, pct: steps.length? Math.round(done/steps.length*100):0 };
}

function renderAnimation(){
  if(!state.animProjectId || !animProjects().some(p=>p.id===state.animProjectId)){
    state.animProjectId = animProjects()[0]?.id || null;
  }
  const projects = animProjects();
  const p = projects.find(x=>x.id===state.animProjectId) || null;

  let html = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div><h2>Animation <span style="font-size:13px;font-weight:500;color:var(--muted);vertical-align:middle;background:var(--track);padding:3px 9px;border-radius:99px;margin-left:6px">Beta</span></h2></div>
    </div><div style="margin-bottom:18px"></div>`;

  if(!projects.length){
    html += `<div class="empty">No active animation projects. Create a project with an animation type under All Projects and it'll appear here.</div>`;
    main.innerHTML = html;
    return;
  }

  html += `<div class="pd-tabs" style="padding:0;margin-bottom:20px">${projects.map(pr=>{
    const c = state.clients.find(cl=>cl.id===pr.client_id);
    return `<button type="button" class="pd-tab ${pr.id===state.animProjectId?'active':''}" data-animproj="${pr.id}" style="${pr.id===state.animProjectId?`color:var(--accent);border-color:var(--accent)`:''}">${esc(c?c.name:'?')}${pr.label?` · ${esc(pr.label)}`:''}</button>`;
  }).join('')}</div>`;

  const shots = animShotsFor(p.id);
  const steps = animStepsFor(p.id);

  if(!steps.length){
    html += `<div class="banner"><div>🎬</div><div>This project has no pipeline steps yet.
      <button class="btn small" id="animSeed" style="margin-left:8px">Set up default pipeline</button>
      <div style="margin-top:6px;font-size:12px;color:var(--muted)">Creates: ${ANIM_DEFAULT_STEPS.join(' → ')}</div>
    </div></div>`;
    main.innerHTML = html;
    wireAnimTabs();
    $('#animSeed').onclick = async ()=>{
      await Promise.all(ANIM_DEFAULT_STEPS.map((n,i)=> db.from('rs_anim_steps').insert({ project_id:p.id, name:n, position:i })));
      toast('Pipeline created'); await loadAll();
    };
    return;
  }

  /* ---- Health summary: the bit that stops things getting dropped ---- */
  const todayIso = iso(new Date());
  const budget = p.anim_total_seconds!=null ? +p.anim_total_seconds : null;
  const allocated = shots.reduce((n,s)=> n + (s.duration_seconds? +s.duration_seconds : 0), 0);
  const approvedSecs = shots.reduce((n,s)=>{
    const pr = animShotProgress(s, steps);
    return n + (pr.done===steps.length && steps.length ? (s.duration_seconds? +s.duration_seconds:0) : 0);
  }, 0);

  const flags = { retakes:[], overdue:[], clientWait:[], unassigned:[], stalled:[] };
  shots.forEach(s=>{
    steps.forEach(st=>{
      const c = animCell(s.id, st.id);
      if(!c) return;
      if(c.status==='Retakes') flags.retakes.push({s,st,c});
      if(c.status==='Client review') flags.clientWait.push({s,st,c});
      if(c.due_date && c.due_date < todayIso && c.status!=='Approved' && c.status!=='Omitted') flags.overdue.push({s,st,c});
      if(c.status==='In progress' && !c.assignee_id) flags.unassigned.push({s,st,c});
    });
    const pr = animShotProgress(s, steps);
    const anyTouched = steps.some(st=>animCell(s.id,st.id));
    if(!anyTouched && shots.length) flags.stalled.push({s});
  });

  const chip = (label, n, color)=> n? `<span class="status" style="background:${color}22;color:${color};font-weight:600">${n} ${label}</span>` : '';
  html += `<div class="card" style="margin-bottom:18px">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${chip('need retakes', flags.retakes.length, '#E8623D')}
        ${chip('overdue', flags.overdue.length, '#c9372c')}
        ${chip('awaiting client', flags.clientWait.length, '#15AABF')}
        ${chip('unassigned', flags.unassigned.length, '#e08c00')}
        ${chip('not started', flags.stalled.length, '#7b7d92')}
        ${(!flags.retakes.length && !flags.overdue.length && !flags.clientWait.length && !flags.unassigned.length && !flags.stalled.length)? '<span style="font-size:13px;color:var(--green);font-weight:600">✓ Nothing needs attention</span>':''}
      </div>
      <div style="font-size:12.5px;color:var(--muted);text-align:right">
        <div><b style="color:var(--ink)">${allocated}s</b> across ${shots.length} shot${shots.length===1?'':'s'}${budget!=null? ` of ${budget}s contracted`:''}</div>
        <div>${approvedSecs}s fully approved${budget? ` · ${Math.round(approvedSecs/budget*100)}% delivered`:''}</div>
        ${budget!=null && allocated!==budget? `<div style="color:var(--amber);font-weight:600">⚠ shot durations ${allocated>budget?'exceed':'fall short of'} the contracted ${budget}s</div>`:''}
      </div>
    </div>
  </div>`;

  /* ---- The grid ---- */
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <button class="btn small" id="animAddShot">+ Shot</button>
    <button class="btn small ghost" id="animAddStep">+ Pipeline step</button>
    <button class="btn small ghost" id="animSetBudget">${budget!=null?'Edit':'Set'} total seconds</button>
  </div>`;

  if(!shots.length){
    html += `<div class="empty">No shots yet — add your first shot to start building the pipeline grid.</div>`;
  } else {
    html += `<div class="card" style="padding:0;overflow-x:auto">
      <table class="anim-grid" style="min-width:${260 + steps.length*104}px">
        <thead><tr>
          <th style="min-width:210px">Shot</th>
          ${steps.map(st=>`<th style="text-align:center;min-width:96px">${esc(st.name)}<button class="anim-step-del" data-animstepdel="${st.id}" title="Remove step">×</button></th>`).join('')}
          <th style="min-width:64px;text-align:right">Progress</th>
        </tr></thead>
        <tbody>
          ${shots.map(s=>{
            const pr = animShotProgress(s, steps);
            return `<tr>
              <td>
                <div style="display:flex;align-items:center;gap:8px">
                  <b style="font-size:13px">${esc(s.code)}</b>
                  ${s.duration_seconds!=null? `<span style="font-size:11.5px;color:var(--muted)">${s.duration_seconds}s</span>`:''}
                  <button class="btn small ghost" data-animshotedit="${s.id}" style="margin-left:auto">Edit</button>
                </div>
                ${s.description? `<div style="font-size:11.5px;color:var(--muted);margin-top:2px">${esc(s.description)}</div>`:''}
              </td>
              ${steps.map(st=>{
                const c = animCell(s.id, st.id);
                const status = c? c.status : 'Not started';
                const cfg = ANIM_CELL_STATUSES[status] || ANIM_CELL_STATUSES['Not started'];
                const m = c && c.assignee_id ? state.members.find(mm=>mm.id===c.assignee_id) : null;
                const overdue = c && c.due_date && c.due_date < todayIso && status!=='Approved' && status!=='Omitted';
                return `<td style="text-align:center;padding:5px">
                  <button class="anim-cell" data-animcell="${s.id}:${st.id}" title="${esc(status)}${m?' · '+esc(m.name):''}${c&&c.due_date?' · due '+c.due_date:''}"
                    style="background:${cfg.color};color:${cfg.text};${overdue?'box-shadow:inset 0 0 0 2px var(--red)':''}">
                    <span style="font-size:11px;font-weight:700">${cfg.short}</span>
                    ${c && c.version? `<span class="anim-cell-v">v${String(c.version).padStart(3,'0')}</span>`:''}
                    ${c && c.retakes? `<span class="anim-cell-rt">${c.retakes}↻</span>`:''}
                    ${m? `<span class="anim-cell-who">${esc(initials(m.name))}</span>`:''}
                  </button>
                </td>`;
              }).join('')}
              <td style="text-align:right;font-size:12px;color:${pr.pct===100?'var(--green)':'var(--muted)'};font-weight:600">${pr.pct}%</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)">
      ${Object.entries(ANIM_CELL_STATUSES).map(([k,v])=>`<span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;border-radius:3px;background:${v.color};display:inline-block"></span>${esc(k)}</span>`).join('')}
    </div>`;
  }

  main.innerHTML = html;
  wireAnimTabs();
  $('#animAddShot').onclick = ()=> openAnimShotModal(p.id, null);
  $('#animAddStep').onclick = ()=> openAnimStepModal(p.id);
  $('#animSetBudget').onclick = ()=> openAnimBudgetModal(p);
  main.querySelectorAll('[data-animshotedit]').forEach(el=>el.addEventListener('click', ()=> openAnimShotModal(p.id, el.dataset.animshotedit)));
  main.querySelectorAll('[data-animcell]').forEach(el=>el.addEventListener('click', ()=>{
    const [shotId, stepId] = el.dataset.animcell.split(':');
    openAnimCellModal(shotId, stepId);
  }));
  main.querySelectorAll('[data-animstepdel]').forEach(el=>el.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const st = state.animSteps.find(x=>x.id===el.dataset.animstepdel);
    if(!confirm(`Remove the "${st.name}" step from this project? Any statuses recorded against it will be deleted.`)) return;
    const { error } = await db.from('rs_anim_steps').delete().eq('id', st.id);
    if(error){ toast('Could not remove step'); return; }
    toast('Step removed'); await loadAll();
  }));
}

function wireAnimTabs(){
  main.querySelectorAll('[data-animproj]').forEach(el=>el.addEventListener('click', ()=>{ state.animProjectId = el.dataset.animproj; render(); }));
}

function openAnimShotModal(projectId, shotId){
  const s = shotId ? state.animShots.find(x=>x.id===shotId) : { code:'', description:'', duration_seconds:null };
  const isNew = !shotId;
  const existing = animShotsFor(projectId);
  const suggested = `SH${String((existing.length+1)*10).padStart(3,'0')}`;
  showModal(`
    <h3>${isNew?'New shot':'Edit shot'}</h3>
    <form class="log" style="max-width:none">
      <div><label>Shot code</label><input type="text" id="as_code" value="${esc(s.code)}" placeholder="${suggested}"></div>
      <div><label>Duration (seconds)</label><input type="number" step="0.5" min="0" id="as_dur" value="${s.duration_seconds!=null?s.duration_seconds:''}" placeholder="e.g. 4.5"></div>
      <div class="full"><label>Description <span style="color:var(--muted);font-weight:400">(optional)</span></label><input type="text" id="as_desc" value="${esc(s.description||'')}" placeholder="e.g. Hero cell divides, camera pushes in"></div>
    </form>
    <div class="modal-actions">
      ${!isNew? `<button class="btn danger" id="as_delete">Delete shot</button>`:'<span></span>'}
      <div class="right">
        <button class="btn ghost" id="as_cancel">Cancel</button>
        <button class="btn" id="as_save">${isNew?'Add shot':'Save changes'}</button>
      </div>
    </div>
  `);
  $('#as_cancel').onclick = closeModal;
  if(!isNew) $('#as_delete').onclick = async ()=>{
    if(!confirm(`Delete shot ${s.code}? All its pipeline statuses go too. This cannot be undone.`)) return;
    const { error } = await db.from('rs_anim_shots').delete().eq('id', shotId);
    if(error){ toast('Delete failed'); return; }
    closeModal(); toast('Shot deleted'); await loadAll();
  };
  $('#as_save').onclick = async ()=>{
    const code = $('#as_code').value.trim() || suggested;
    const duration_seconds = $('#as_dur').value!=='' ? +$('#as_dur').value : null;
    const description = $('#as_desc').value.trim() || null;
    if(isNew){
      const { error } = await db.from('rs_anim_shots').insert({ project_id:projectId, code, description, duration_seconds, position:existing.length });
      if(error){ toast('Could not add shot'); console.error(error); return; }
      closeModal(); toast('Shot added'); await loadAll();
    } else {
      const { error } = await db.from('rs_anim_shots').update({ code, description, duration_seconds }).eq('id', shotId);
      if(error){ toast('Could not save'); return; }
      closeModal(); toast('Shot updated'); await loadAll();
    }
  };
}

function openAnimStepModal(projectId){
  const existing = animStepsFor(projectId);
  showModal(`
    <h3>New pipeline step</h3>
    <div class="sub">Added to the end of the pipeline for this project only.</div>
    <form class="log" style="max-width:none">

    </form>
    <div class="modal-actions">
      <div class="right">
        <button class="btn ghost" id="ast_cancel">Cancel</button>

/* ================= Public client dashboard (?client=slug) ================= */
async function bootPublicDashboard(slug, isAdmin){
  const { data: client, error } = await db.from('rs_clients').select('*').eq('slug', slug).eq('active', true).maybeSingle();
  if(error || !client){
    document.body.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;background:var(--paper);text-align:center">
      <div><div style="font-size:16px;color:var(--ink);margin-bottom:8px;font-weight:600">Dashboard not found</div>
      <div style="font-size:13px;color:var(--muted)">This link may have changed or been removed.</div></div>
    </div>`;
    return;
  }
  const { data: projects } = await db.from('rs_projects').select('*').eq('client_id', client.id).eq('active', true).order('name');
  const projectIds = (projects||[]).map(p=>p.id);
  const stagesRes = projectIds.length ? await db.from('rs_project_stages').select('*').in('project_id', projectIds).order('position') : { data: [] };
  const stages = stagesRes.data||[];
  const stageIds = stages.map(s=>s.id);
  const catsRes = (stageIds.length || projectIds.length)
    ? await db.from('rs_stage_categories').select('*').or(`stage_id.in.(${stageIds.join(',')||'00000000-0000-0000-0000-000000000000'}),project_id.in.(${projectIds.join(',')||'00000000-0000-0000-0000-000000000000'})`).order('position')
    : { data: [] };
  const categories = catsRes.data||[];
  const catIds = categories.map(c=>c.id);
  const linksRes = catIds.length ? await db.from('rs_stage_links').select('*').in('category_id', catIds).order('position') : { data: [] };
  const links = linksRes.data||[];
  // stageStatus()/isCompleteStatus() (shared with the internal app) read from
  // state — populate just enough of it here since the public path skips loadAll().
  // openStageCategoryModal/openStageLinkModal (used in admin mode) also read
  // state.stageCategories/stageLinks to work out new-item positions.
  const [tasksRes, statusesRes] = await Promise.all([
    stageIds.length ? db.from('rs_proj_tasks').select('*').in('stage_id', stageIds) : { data: [] },
    db.from('rs_task_statuses').select('*').order('position')
  ]);
  state.projTasks = tasksRes.data||[];
  state.taskStatuses = (statusesRes.data && statusesRes.data.length) ? statusesRes.data : DEFAULT_TASK_STATUSES;
  state.stageCategories = categories;
  state.stageLinks = links;
  renderPublicDashboard(client, projects||[], stages, categories, links, !!isAdmin);
}

function renderPublicDashboard(client, projects, allStages, allCategories, allLinks, isAdmin){
  const pub = { projectId: projects[0]?.id || null, viewedStageId: null };
  const accent = client.dash_accent_color || '#2383e2';
  const initials = (client.name||'?').charAt(0).toUpperCase();
  async function reload(){ await bootPublicDashboard(client.slug, true); }

  function stagesFor(projectId){ return allStages.filter(s=>s.project_id===projectId).sort((a,b)=>a.position-b.position); }
  function catsFor(stageId){ return allCategories.filter(c=>c.stage_id===stageId).sort((a,b)=>a.position-b.position); }
  function projectCatsFor(projectId){ return allCategories.filter(c=>c.project_id===projectId && !c.stage_id).sort((a,b)=>a.position-b.position); }
  function linksFor(categoryId){ return allLinks.filter(l=>l.category_id===categoryId).sort((a,b)=>a.position-b.position); }

  function categoryBlockHtml(cat){
    const catLinks = linksFor(cat.id);
    if(!isAdmin && !catLinks.length) return '';
    return `<div style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="pd-cat-label" style="margin-bottom:0">${esc(cat.name)}</div>
        ${isAdmin? `<div style="display:flex;gap:6px"><button class="btn small ghost" data-addlink="${cat.id}">+ Link</button><button class="btn small ghost" data-delcat="${cat.id}">Delete category</button></div>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${catLinks.map(l=> isAdmin ? `
          <div class="pd-link-card">
            <span style="color:${accent}">${LINK_ICONS[l.icon]||LINK_ICONS.link}</span>
            <span style="flex:1;min-width:0">
              <a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" style="display:block;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none">${esc(l.label)}</a>
              ${l.description? `<span style="display:block;font-size:12px;color:var(--muted);margin-top:2px">${esc(l.description)}</span>`:''}
            </span>
            <button class="btn small ghost" data-editlink="${l.id}">Edit</button>
          </div>` : `<a class="pd-link-card" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
            <span style="color:${accent}">${LINK_ICONS[l.icon]||LINK_ICONS.link}</span>
            <span style="flex:1;min-width:0">
              <span style="display:block;font-size:13.5px;font-weight:600;color:var(--ink)">${esc(l.label)}</span>
              ${l.description? `<span style="display:block;font-size:12px;color:var(--muted);margin-top:2px">${esc(l.description)}</span>`:''}
            </span>
          </a>`
        ).join('') || (isAdmin? '<div class="empty" style="padding:6px 0">No links yet</div>' : '')}
      </div>
    </div>`;
  }

  function paint(){
    const proj = projects.find(p=>p.id===pub.projectId) || projects[0] || null;
    const stages = proj ? stagesFor(proj.id) : [];
    if(!pub.viewedStageId || !stages.some(s=>s.id===pub.viewedStageId)){
      const firstIncomplete = stages.find(s=>stageStatus(s.id)!=='Complete');
      pub.viewedStageId = (firstIncomplete||stages[stages.length-1]||{}).id || null;
    }
    const viewedStage = stages.find(s=>s.id===pub.viewedStageId) || null;
    const doneCount = stages.filter(s=>stageStatus(s.id)==='Complete').length;
    const pct = stages.length ? Math.round(doneCount/stages.length*100) : 0;

    const tabsHtml = projects.length>1 ? `<div class="pd-tabs">${projects.map(p=>`
      <button type="button" class="pd-tab ${p.id===pub.projectId?'active':''}" data-pdtab="${p.id}" style="${p.id===pub.projectId?`color:${accent};border-color:${accent}`:''}">${esc(p.project_type)}</button>
    `).join('')}</div>` : '';

    const stagesHtml = stages.length ? stages.map((s,i)=>{
      const done = stageStatus(s.id)==='Complete';
      const viewed = s.id===pub.viewedStageId;
      return `<div class="pd-stage-row ${viewed?'viewed':''}" data-pdstage="${s.id}" style="${viewed?`background:${accent}14`:''}">
        <div class="pd-stage-dot" style="${done||viewed?`background:${accent};color:#fff`:''}">${done?'✓':i+1}</div>
        <div class="pd-stage-label" style="${viewed?`color:${accent};font-weight:600`:''}">${esc(s.name)}</div>
        ${s.due_date? `<div class="pd-stage-date">${fmtDate(new Date(s.due_date+'T00:00'))}</div>`:''}
      </div>`;
    }).join('') : `<div class="empty" style="padding:20px 0">No stages yet.</div>`;

    const stageCatsList = viewedStage ? catsFor(viewedStage.id) : [];
    const assetsBody = stageCatsList.map(categoryBlockHtml).join('');
    const assetsHtml = viewedStage
      ? (assetsBody || (isAdmin? '' : `<div class="empty" style="padding:20px 0">Nothing shared for this stage yet.</div>`))
        + (isAdmin? `<button class="btn small ghost" data-addcat="${viewedStage.id}">+ Category</button>` : '')
      : '';

    const generalCats = proj ? projectCatsFor(proj.id) : [];
    const generalBody = generalCats.map(categoryBlockHtml).join('');
    const generalAssetsHtml = (generalBody || isAdmin) ? `<div class="card" style="max-width:1000px;margin:0 auto 20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">General assets</div>
        ${isAdmin && proj ? `<button class="btn small ghost" data-addprojcat="${proj.id}">+ Category</button>` : ''}
      </div>
      ${generalBody || (isAdmin? '<div class="empty">No general assets yet.</div>' : '')}
    </div>` : '';

    document.body.innerHTML = `
      <div style="min-height:100vh;background:var(--paper);font-family:'Inter',sans-serif;color:var(--ink)">
        ${isAdmin? `<div style="background:${accent};color:#fff;text-align:center;padding:8px;font-size:12.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:12px">
          <span>🔒 Admin view — add links and manage assets here. The client only ever sees the read-only version.</span>
          <button class="btn small" style="background:#fff;color:${accent}" id="pdCopyClient">Copy client link</button>
        </div>` : ''}
        <div style="max-width:1000px;margin:0 auto;padding:40px 24px 20px">
          <div style="display:flex;align-items:center;gap:18px;margin-bottom:8px">
            <div style="width:60px;height:60px;border-radius:14px;flex-shrink:0;background:${client.dash_logo_url?'var(--track)':accent};display:flex;align-items:center;justify-content:center;overflow:hidden">
              ${client.dash_logo_url? `<img src="${esc(client.dash_logo_url)}" style="width:100%;height:100%;object-fit:contain">` : `<span style="color:#fff;font-size:24px;font-weight:700">${initials}</span>`}
            </div>
            <div style="flex:1;min-width:0">
              <h1 style="font-size:32px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px">${esc(client.name)}</h1>
              ${client.dash_logo_text? `<div style="font-size:14px;color:var(--muted)">${esc(client.dash_logo_text)}</div>`:''}
            </div>
            <div style="display:flex;gap:8px">
              ${client.dash_contact_email? `<a class="btn small ghost" href="mailto:${esc(client.dash_contact_email)}">Contact us</a>`:''}
              <a class="btn small ghost" href="${esc(client.dash_website_url||'https://reciprocal.space')}" target="_blank" rel="noopener">Reciprocal Space</a>
            </div>
          </div>
          ${client.dash_greeting? `<p style="font-size:14px;color:var(--muted);line-height:1.6;max-width:640px;margin-bottom:8px">${esc(client.dash_greeting)}</p>`:''}
        </div>
        ${tabsHtml}
        <div style="max-width:1000px;margin:0 auto;padding:24px 24px 0">${generalAssetsHtml}</div>
        <div style="max-width:1000px;margin:0 auto;padding:0 24px 24px;display:grid;grid-template-columns:300px 1fr;gap:20px" id="pdGrid">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px">
              <div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Stage progress</div>
              <div style="font-size:13px;font-weight:700;color:${accent}">${pct}%</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:2px">${stagesHtml}</div>
          </div>
          <div class="card">
            <div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px">${viewedStage? esc(viewedStage.name) : 'Files & links'}</div>
            ${assetsHtml}
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;padding:20px;opacity:.5;font-size:12px;color:var(--muted)">Reciprocal Space</div>
      </div>
      <div id="modalRoot"></div>
      <div class="toast" id="toast"></div>`;

    document.querySelectorAll('[data-pdtab]').forEach(el=>el.addEventListener('click', ()=>{ pub.projectId = el.dataset.pdtab; pub.viewedStageId = null; paint(); }));
    document.querySelectorAll('[data-pdstage]').forEach(el=>el.addEventListener('click', ()=>{ pub.viewedStageId = el.dataset.pdstage; paint(); }));

    if(isAdmin){
      const copyBtn = document.getElementById('pdCopyClient');
      if(copyBtn) copyBtn.addEventListener('click', ()=>{
        const url = `${window.location.origin}${window.location.pathname}?client=${client.slug}`;
        navigator.clipboard?.writeText(url).then(()=> toast('Client link copied')).catch(()=> toast(url));
      });
      document.querySelectorAll('[data-addcat]').forEach(el=>el.addEventListener('click', ()=> openStageCategoryModal({ stageId: el.dataset.addcat }, reload)));
      document.querySelectorAll('[data-addprojcat]').forEach(el=>el.addEventListener('click', ()=> openStageCategoryModal({ projectId: el.dataset.addprojcat }, reload)));
      document.querySelectorAll('[data-delcat]').forEach(el=>el.addEventListener('click', async ()=>{
        if(!confirm('Delete this category and all its links? This cannot be undone.')) return;
        const { error } = await db.from('rs_stage_categories').delete().eq('id', el.dataset.delcat);
        if(error){ toast('Delete failed'); return; }
        toast('Category deleted'); await reload();
      }));
      document.querySelectorAll('[data-addlink]').forEach(el=>el.addEventListener('click', ()=> openStageLinkModal(el.dataset.addlink, null, reload)));
      document.querySelectorAll('[data-editlink]').forEach(el=>{
        const link = allLinks.find(l=>l.id===el.dataset.editlink);
        el.addEventListener('click', ()=> openStageLinkModal(link.category_id, link.id, reload));
      });
    }
  }
  paint();
}

  const key = SUPABASE_ANON_KEY || store.get('rs_rt_key');

  db = supabase.createClient(url, key);

  const qs = new URLSearchParams(window.location.search);
  const clientSlug = qs.get('client');
  if(clientSlug){ await bootPublicDashboard(clientSlug, qs.get('admin')==='1'); return; }

  $('#sidebar').style.display = 'flex';
  $('#themeToggleBtn').addEventListener('click', toggleTheme);
  if(store.get('rs_sidebar_collapsed')==='1') $('#sidebar').classList.add('collapsed');
  $('#sidebarCollapseBtn').addEventListener('click', ()=>{

    store.set('rs_sidebar_collapsed', collapsed?'1':'0');
    $('#sidebarCollapseBtn').title = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
  });
  if($('#sidebar').classList.contains('collapsed')) $('#sidebarCollapseBtn').title = 'Expand sidebar';
  $('#brandBtn').addEventListener('click', ()=>{ state.view='home'; render(); });
  document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click', ()=>{
    state.view = b.dataset.view;
    if(state.view==='projects'){ state.projView='clients'; state.projClientId=null; state.projProjectId=null; }
    if(state.view==='dashboard'){ state.retainerView='dashboard'; }

    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCommandPalette(); }
  });
  await loadAll();
}
boot();
/* ── 1. Feedback log helpers ──────────────────────────────────────────── */
function animFeedbackFor(shotId, stepId){
  return (state.animFeedback||[])
    .filter(f=>f.shot_id===shotId && f.step_id===stepId)
    .sort((a,b)=>a.created_at.localeCompare(b.created_at));
}
function animFeedbackCount(shotId, stepId){ return animFeedbackFor(shotId, stepId).length; }
function animAllFeedback(projectId){
  const shotIds = new Set(state.animShots.filter(s=>s.project_id===projectId).map(s=>s.id));
  return (state.animFeedback||[]).filter(f=>shotIds.has(f.shot_id))
    .sort((a,b)=>b.created_at.localeCompare(a.created_at));
}

/* ── 2. Dependency helpers ────────────────────────────────────────────── */
function animDepsFor(projectId){ return (state.animDeps||[]).filter(d=>d.project_id===projectId); }
function animIsBlocked(shotId, projectId){
  const deps = animDepsFor(projectId);
  return deps.filter(d=>d.blocked_shot_id===shotId).some(d=>{
    const blocker = state.animShots.find(s=>s.id===d.blocking_shot_id);
    if(!blocker) return false;
    const steps = animStepsFor(projectId);
    return steps.length && steps.some(st=>animCellStatus(blocker.id, st.id)!=='Approved');
  });
}
function animBlockedBy(shotId, projectId){
  return animDepsFor(projectId)
    .filter(d=>d.blocked_shot_id===shotId)
    .map(d=>state.animShots.find(s=>s.id===d.blocking_shot_id))
    .filter(Boolean);
}
function animBlocks(shotId, projectId){
  return animDepsFor(projectId)
    .filter(d=>d.blocking_shot_id===shotId)
    .map(d=>state.animShots.find(s=>s.id===d.blocked_shot_id))
    .filter(Boolean);
}

/* ── 3. Daily snapshot helpers ───────────────────────────────────────── */
function animChangedSince(projectId, hoursAgo){
  const since = new Date(Date.now() - hoursAgo*3600000).toISOString();
  const shotIds = new Set(state.animShots.filter(s=>s.project_id===projectId).map(s=>s.id));
  return (state.animCells||[]).filter(c=> shotIds.has(c.shot_id) && c.updated_at >= since);
}

/* ── Snapshot view ─────────────────────────────────────────────────────── */
function renderAnimSnapshot(){
  const p = animProjects().find(x=>x.id===state.animProjectId);
  if(!p){ state.animTab='grid'; renderAnimation(); return; }
  const steps = animStepsFor(p.id);
  const shots = animShotsFor(p.id);
  const todayIso = iso(new Date());

  // Group changed cells by "since when" bucket
  const buckets = [
    { label:'Since yesterday',   hours:24 },
    { label:'Past 3 days',       hours:72 },
    { label:'Past week',         hours:168 }
  ];

  const renderBucket = (hours)=>{
    const cells = animChangedSince(p.id, hours);
    if(!cells.length) return `<div class="empty" style="padding:16px 0">No changes in this period.</div>`;
    return cells.map(c=>{
      const shot = shots.find(s=>s.id===c.shot_id);
      const step = steps.find(s=>s.id===c.step_id);
      const m = c.assignee_id ? state.members.find(mm=>mm.id===c.assignee_id) : null;
      const cfg = ANIM_CELL_STATUSES[c.status] || ANIM_CELL_STATUSES['Not started'];
      const fb = animFeedbackFor(c.shot_id, c.step_id);
      const latest = fb[fb.length-1];
      return `<div style="display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">
        <span style="background:${cfg.color};color:${cfg.text};font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0">${esc(cfg.short)}</span>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:13.5px">${shot?esc(shot.code):'?'} · ${step?esc(step.name):'?'}</div>
          <div style="font-size:12px;color:var(--muted)">${esc(c.status)}${m?` · ${esc(m.name)}`:''}${c.retakes?` · ${c.retakes} retake${c.retakes===1?'':'s'}`:''}</div>
          ${latest?`<div style="font-size:12px;color:var(--muted);margin-top:4px;font-style:italic">"${esc(latest.body.slice(0,120))}${latest.body.length>120?'…':''}"</div>`:''}
        </div>
        <div style="font-size:11px;color:var(--muted);white-space:nowrap">${fmtDate(new Date(c.updated_at))}</div>
      </div>`;
    }).join('');
  };

  // Overdue and needing attention today
  const attn = [];
  shots.forEach(s=> steps.forEach(st=>{
    const c = animCell(s.id, st.id);
    if(!c) return;
    if(c.due_date && c.due_date < todayIso && c.status!=='Approved' && c.status!=='Omitted')
      attn.push({ shot:s, step:st, c, type:'overdue' });
    if(c.status==='Retakes') attn.push({ shot:s, step:st, c, type:'retakes' });
    if(c.status==='Client review') attn.push({ shot:s, step:st, c, type:'waiting' });
  }));

  const attnHtml = attn.length ? attn.map(a=>{
    const cfg = ANIM_CELL_STATUSES[a.c.status]||ANIM_CELL_STATUSES['Not started'];
    const label = a.type==='overdue'?'⚠ Overdue': a.type==='retakes'?'↻ Retakes':'⏳ Client';
    const color = a.type==='overdue'?'#c9372c': a.type==='retakes'?'#E8623D':'#15AABF';
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
      <span style="color:${color};font-weight:600;font-size:12px;width:76px;flex-shrink:0">${label}</span>
      <b>${esc(a.shot.code)}</b>
      <span style="color:var(--muted)">${esc(a.step.name)}</span>
      ${a.c.due_date?`<span style="font-size:12px;color:var(--muted);margin-left:auto">${fmtDateNatural(a.c.due_date)}</span>`:''}
    </div>`;
  }).join('') : `<div style="padding:10px 0;color:var(--green);font-weight:600">✓ Nothing needs attention today</div>`;

  let html = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
    <div><h2>Animation <span style="font-size:13px;font-weight:500;color:var(--muted);vertical-align:middle;background:var(--track);padding:3px 9px;border-radius:99px;margin-left:6px">Beta</span></h2></div>
  </div><div style="margin-bottom:18px"></div>`;
  html += `<div class="pd-tabs" style="padding:0;margin-bottom:20px">${animProjects().map(pr=>{
    const cl = state.clients.find(cl=>cl.id===pr.client_id);
    return `<button type="button" class="pd-tab ${pr.id===state.animProjectId?'active':''}" data-animproj="${pr.id}"
      style="${pr.id===state.animProjectId?`color:var(--accent);border-color:var(--accent)`:''}">${esc(cl?cl.name:'?')}</button>`;
  }).join('')}</div>
  <div class="view-toggle" style="margin-bottom:20px">
    <button class="btn small ghost" data-animtab="grid">Grid</button>
    <button class="btn small" data-animtab="snapshot">Today's snapshot</button>
    <button class="btn small ghost" data-animtab="deps">Dependencies</button>
  </div>`;

  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <div class="card">
      <div style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:12px">Needs attention today</div>
      ${attnHtml}
    </div>
    <div class="card">
      <div style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:12px">Changed ${buckets[0].label.toLowerCase()}</div>
      ${renderBucket(buckets[0].hours)}
    </div>
  </div>
  <div class="card" style="margin-top:20px">
    <div style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:12px">Changed ${buckets[1].label.toLowerCase()}</div>
    ${renderBucket(buckets[1].hours)}
  </div>`;

  main.innerHTML = html;
  wireAnimTabsAll();
}

  html += `<div class="sub" style="margin-bottom:18px">A dependency means one shot must be fully Approved before another can start. Blocked shots are flagged in the grid.</div>`;

  const depRows = deps.map(d=>{
    const blocker = shots.find(s=>s.id===d.blocking_shot_id);
    const blocked  = shots.find(s=>s.id===d.blocked_shot_id);
    if(!blocker||!blocked) return '';
    const pr = animShotProgress(blocker, steps);
    const resolved = pr.done===steps.length && steps.length>0;
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">
      <b>${esc(blocker.code)}</b>
      <span style="color:var(--muted)">blocks</span>
      <b>${esc(blocked.code)}</b>
      <span class="status ${resolved?'ok':'warn'}" style="margin-left:auto">${resolved?'✓ Resolved – blocker approved':'⊠ Active'}</span>
      <button class="btn small ghost" data-animdeldep="${d.id}">Remove</button>
    </div>`;
  }).join('') || `<div class="empty" style="padding:16px 0">No dependencies set. Add one below.</div>`;

  html += `<div class="card" style="margin-bottom:20px">${depRows}</div>`;
  html += `<div class="card">
    <div style="font-size:13.5px;font-weight:600;margin-bottom:12px">Add dependency</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <select id="dep_blocker" style="flex:1;min-width:120px"><option value="">Blocking shot…</option>
        ${shots.map(s=>`<option value="${s.id}">${esc(s.code)}${s.description?` — ${esc(s.description.slice(0,40))}`:''}</option>`).join('')}
      </select>
      <span style="color:var(--muted)">must complete before</span>
      <select id="dep_blocked" style="flex:1;min-width:120px"><option value="">Blocked shot…</option>
        ${shots.map(s=>`<option value="${s.id}">${esc(s.code)}${s.description?` — ${esc(s.description.slice(0,40))}`:''}</option>`).join('')}
      </select>
      <button class="btn small" id="dep_add">Add</button>
    </div>
  </div>`;

  main.innerHTML = html;
  wireAnimTabsAll();
  main.querySelectorAll('[data-animdeldep]').forEach(el=>el.addEventListener('click', async ()=>{
    await db.from('rs_anim_deps').delete().eq('id', el.dataset.animdeldep);
    toast('Dependency removed'); await loadAll();
  }));
  $('#dep_add').onclick = async ()=>{
    const blockingId = $('#dep_blocker').value;
    const blockedId  = $('#dep_blocked').value;
    if(!blockingId||!blockedId){ toast('Select both shots'); return; }
    if(blockingId===blockedId){ toast('A shot can\'t depend on itself'); return; }
    if(deps.some(d=>d.blocking_shot_id===blockingId && d.blocked_shot_id===blockedId)){ toast('Already exists'); return; }
    const { error } = await db.from('rs_anim_deps').insert({ project_id:p.id, blocking_shot_id:blockingId, blocked_shot_id:blockedId });
    if(error){ toast('Could not add dependency'); console.error(error); return; }
    toast('Dependency added'); await loadAll();
  };
}

/* ── Shared tab wiring ─────────────────────────────────────────────────── */
function wireAnimTabsAll(){
  main.querySelectorAll('[data-animproj]').forEach(el=>el.addEventListener('click', ()=>{ state.animProjectId = el.dataset.animproj; render(); }));
  main.querySelectorAll('[data-animtab]').forEach(el=>el.addEventListener('click', ()=>{ state.animTab = el.dataset.animtab; render(); }));
}

/* ── Patched cell modal — adds feedback log below status controls ──────── */
const _origOpenAnimCellModal = openAnimCellModal;
function openAnimCellModal(shotId, stepId){
  const shot = state.animShots.find(s=>s.id===shotId);
  const step = state.animSteps.find(s=>s.id===stepId);
  const c = animCell(shotId, stepId) || { status:'Not started', assignee_id:null, version:0, retakes:0, due_date:null };
  const feedback = animFeedbackFor(shotId, stepId);
  const designers = state.members.filter(m=>m.active!==false);
  const me = currentUser();

  const fbHtml = feedback.length ? feedback.map(f=>{
    const author = f.author_id ? state.members.find(m=>m.id===f.author_id) : null;
    return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px">
        <span style="font-weight:600;font-size:12.5px">${author?esc(author.name):'Team'}</span>
        <span style="font-size:11px;color:var(--muted)">${fmtDate(new Date(f.created_at))}${f.version_at?` · v${String(f.version_at).padStart(3,'0')}`:''}</span>
      </div>
      <div style="font-size:13px;color:var(--ink);white-space:pre-wrap">${esc(f.body)}</div>
    </div>`;
  }).join('') : `<div style="color:var(--muted);font-size:12.5px;padding:8px 0">No feedback yet.</div>`;

  showModal(`
    <h3>${esc(shot.code)} · ${esc(step.name)}</h3>
    <form class="log" style="max-width:none">
      <div><label>Status</label><select id="ac_status">${Object.keys(ANIM_CELL_STATUSES).map(k=>`<option value="${k}" ${c.status===k?'selected':''}>${k}</option>`).join('')}</select></div>
      <div><label>Assigned to</label><select id="ac_who"><option value="">— nobody —</option>${designers.map(m=>`<option value="${m.id}" ${c.assignee_id===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
      <div><label>Version</label><input type="number" min="0" id="ac_version" value="${c.version||0}"></div>
      <div><label>Retake rounds</label><input type="number" min="0" id="ac_retakes" value="${c.retakes||0}"></div>
      <div><label>Due date</label>${dateFieldHtml('ac_due', c.due_date, 'Set due date')}</div>
    </form>
    <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px">
      <div style="font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px">Feedback log</div>
      <div style="max-height:200px;overflow-y:auto;margin-bottom:12px">${fbHtml}</div>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea id="ac_fbtext" placeholder="Add a note (what was sent, what came back, decisions made)…" style="flex:1;min-height:52px;resize:vertical"></textarea>
        <button class="btn small" type="button" id="ac_fbpost">Add note</button>
      </div>
    </div>
    <div class="modal-actions">
      <div class="right">
        <button class="btn ghost" id="ac_cancel">Cancel</button>
        <button class="btn" id="ac_save">Save status</button>
      </div>
    </div>
  `);
  wireDateField('ac_due', 'Set due date');
  $('#ac_cancel').onclick = closeModal;

  $('#ac_fbpost').onclick = async ()=>{
    const body = $('#ac_fbtext').value.trim();
    if(!body){ toast('Write something first'); return; }
    const { error } = await db.from('rs_anim_feedback').insert({
      shot_id:shotId, step_id:stepId, body,
      author_id: me?.id || null,
      version_at: c.version || null
    });
    if(error){ toast('Could not save note'); return; }
    toast('Note added'); await loadAll();
    openAnimCellModal(shotId, stepId);
  };

  $('#ac_save').onclick = async ()=>{
    const fields = {
      shot_id:shotId, step_id:stepId,
      status:$('#ac_status').value,
      assignee_id:$('#ac_who').value||null,
      version:+$('#ac_version').value||0,
      retakes:+$('#ac_retakes').value||0,
      due_date:$('#ac_due').value||null,
      updated_at:new Date().toISOString()
    };
    const { error } = await db.from('rs_anim_cells').upsert(fields, { onConflict:'shot_id,step_id' });
    if(error){ toast('Could not save'); console.error(error); return; }
    closeModal(); toast('Updated'); await loadAll();
  };
}

</script>
</body>
