<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS Retainer Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#040e6b;
    --navy-soft:#2a37a8;
    --ink:#16183a;
    --paper:#f6f6f3;
    --card:#ffffff;
    --line:#e4e4de;
    --muted:#7b7d92;
    --amber:#e08c00;
    --amber-bg:#fdf3e0;
    --red:#c9372c;
    --red-bg:#fbeceb;
    --green:#1d7a4d;
    --track:#ecedf5;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Rubik',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:15px}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}

  header{background:var(--navy);color:#fff;padding:0 24px}
  .head-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .brand{padding:16px 0;font-weight:700;font-size:17px;letter-spacing:.2px;display:flex;align-items:baseline;gap:10px}
  .brand span{font-weight:400;opacity:.65;font-size:13px}
  nav{display:flex;gap:4px;margin-left:auto}
  nav button{background:transparent;border:none;color:#fff;opacity:.65;padding:18px 14px;font-size:14px;font-weight:500;border-bottom:3px solid transparent}
  nav button.active{opacity:1;border-bottom-color:#fff}
  nav button:hover{opacity:1}
  nav .flag-count{background:var(--amber);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px;font-weight:600}

  main{max-width:1100px;margin:0 auto;padding:28px 24px 80px}
  h2{font-size:20px;font-weight:600;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}

  .banner{display:flex;gap:10px;align-items:flex-start;background:var(--amber-bg);border:1px solid #f0d9ae;border-radius:var(--radius);padding:14px 16px;margin-bottom:22px;font-size:14px}
  .banner.over{background:var(--red-bg);border-color:#efc7c3}
  .banner strong{font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .client-card h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .cycle{color:var(--muted);font-size:12.5px;margin:3px 0 16px}

  .meter{position:relative;height:26px;background:var(--track);border-radius:8px;overflow:visible;margin-bottom:10px}
  .meter .fill{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--navy-soft);transition:width .4s ease;max-width:100%}
  .meter .fill.warn{background:var(--amber)}
  .meter .fill.over{background:var(--red)}
  .meter .tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.45;left:75%}
  .meter .tick::after{content:'75%';position:absolute;top:-15px;left:-11px;font-size:10px;color:var(--muted)}
  .meter-stats{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
  .meter-stats .pct{font-weight:600}
  .status{margin-top:12px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px}
  .status.ok{background:#e8f2ec;color:var(--green)}
  .status.warn{background:var(--amber-bg);color:var(--amber)}
  .status.over{background:var(--red-bg);color:var(--red)}
  .status .pulse{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .breakdown{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
  .breakdown div{display:flex;justify-content:space-between;padding:2px 0;font-variant-numeric:tabular-nums}

  form.log{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:640px}
  form.log .full{grid-column:1/-1}
  label{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px;color:var(--ink)}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-soft);outline-offset:-1px;border-color:transparent}
  .weighted-note{grid-column:1/-1;font-size:13px;color:var(--muted);background:var(--track);border-radius:9px;padding:10px 12px}
  .weighted-note b{color:var(--navy);font-weight:600}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:11px 20px;font-size:14px;font-weight:500}
  .btn:hover{background:var(--navy-soft)}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
  .btn.small{padding:6px 12px;font-size:12.5px}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  td .chip{display:inline-flex;align-items:center;gap:6px}

  /* calendar */
  .cal-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .cal-head h3{font-size:17px;font-weight:600;min-width:170px;text-align:center}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:center;padding:4px 0}
  .cal .day{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:92px;padding:6px;font-size:12px;cursor:pointer}
  .cal .day:hover{border-color:var(--navy-soft)}
  .cal .day.blank{background:transparent;border:none;cursor:default}
  .cal .day .num{font-weight:600;color:var(--muted);margin-bottom:4px}
  .cal .day.today .num{color:var(--navy);background:var(--track);border-radius:6px;display:inline-block;padding:0 5px}
  .task-chip{border-radius:6px;padding:2px 6px;color:#fff;margin-bottom:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .settings-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  @media(max-width:800px){.settings-cols{grid-template-columns:1fr}form.log{grid-template-columns:1fr}}
  .row-form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .row-form input,.row-form select{width:auto;flex:1;min-width:80px}

  .setup{max-width:460px;margin:70px auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
  .setup h2{margin-bottom:6px}
  .setup p{font-size:13.5px;color:var(--muted);margin-bottom:18px}
  .setup label{margin-top:12px}
  .setup .btn{margin-top:18px;width:100%}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:11px 18px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .empty{color:var(--muted);font-size:13.5px;padding:20px 0}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">Retainer Tracker <span>Reciprocal Space</span></div>
    <nav id="nav" style="display:none">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="log">Log time</button>
      <button data-view="calendar">Calendar</button>
      <button data-view="settings">Settings</button>
    </nav>
  </div>
</header>

<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============
   Option A: paste your Supabase project URL + anon key here and redeploy.
   Option B: leave blank — the app shows a one-time setup screen and
   stores the values in this browser. */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";
/* ================================ */

let db = null;
let state = { view:'dashboard', clients:[], members:[], tasks:[], calMonth:null, logDate:null };
const $ = s => document.querySelector(s);
const main = $('#main');

/* ---------- helpers ---------- */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtH(n){ const v=Math.round(n*100)/100; return (v%1===0? v.toFixed(0):v.toFixed(2).replace(/0$/,''))+'h'; }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(d){ return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function clampDay(y,m,day){ const last=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(day,last)); }

/* Current billing cycle for a client, based on its renewal day */
function cycleFor(renewalDay, ref){
  ref = ref || new Date(); ref = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  let start = clampDay(ref.getFullYear(), ref.getMonth(), renewalDay);
  if (ref < start) start = clampDay(ref.getFullYear(), ref.getMonth()-1, renewalDay);
  const next = clampDay(start.getFullYear(), start.getMonth()+1, renewalDay);
  const end = new Date(next); end.setDate(end.getDate()-1);
  return { start, end, next };
}

/* Deterministic colour per client */
const PALETTE = ['#2a37a8','#0e7c86','#8a3ffc','#b2560d','#1d7a4d','#a02a6e','#4a5568','#946200'];
function clientColor(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }

function clientUsage(client){
  const cyc = cycleFor(client.renewal_day);
  const s = iso(cyc.start), e = iso(cyc.end);
  const tasks = state.tasks.filter(t => t.client_id===client.id && t.task_date>=s && t.task_date<=e);
  const used = tasks.reduce((a,t)=>a + t.hours*t.weight_applied, 0);
  const perMember = {};
  tasks.forEach(t=>{
    const m = state.members.find(m=>m.id===t.member_id);
    const key = m ? m.name : 'Unassigned';
    perMember[key] = (perMember[key]||0) + t.hours*t.weight_applied;
  });
  return { cyc, tasks, used, perMember, pct: client.retainer_hours>0 ? used/client.retainer_hours*100 : 0 };
}

/* ---------- data ---------- */
async function loadAll(){
  const since = iso(new Date(Date.now() - 1000*60*60*24*70)); // ~2 cycles of history
  const [c,m,t] = await Promise.all([
    db.from('rs_clients').select('*').order('name'),
    db.from('rs_members').select('*').order('name'),
    db.from('rs_tasks').select('*').gte('task_date', since).order('task_date',{ascending:false})
  ]);
  if (c.error||m.error||t.error){ toast('Load failed — check Supabase setup'); console.error(c.error||m.error||t.error); return; }
  state.clients = c.data; state.members = m.data; state.tasks = t.data;
  render();
}

/* ---------- views ---------- */
function render(){
  const activeClients = state.clients.filter(c=>c.active);
  const flagged = activeClients.map(c=>({c,u:clientUsage(c)})).filter(x=>x.u.pct>=75);
  document.querySelectorAll('#nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===state.view);
    if(b.dataset.view==='dashboard') b.innerHTML = 'Dashboard' + (flagged.length? ` <span class="flag-count">${flagged.length}</span>`:'');
  });
  ({dashboard:renderDashboard, log:renderLog, calendar:renderCalendar, settings:renderSettings}[state.view])();
}

function renderDashboard(){
  const clients = state.clients.filter(c=>c.active);
  const flagged = clients.map(c=>({c,u:clientUsage(c)})).filter(x=>x.u.pct>=75);
  let html = `<h2>Retainers this cycle</h2><div class="sub">Weighted hours against each client's own renewal month</div>`;

  if (flagged.length){
    const over = flagged.filter(x=>x.u.pct>=100);
    html += `<div class="banner ${over.length?'over':''}">
      <div>⚑</div>
      <div><strong>${flagged.map(x=>esc(x.c.name)).join(', ')}</strong>
      ${flagged.length===1?'has':'have'} passed 75% of retainer — worth flagging to the client${flagged.length>1?'s':''}.
      ${over.length? `<br><strong>${over.map(x=>esc(x.c.name)).join(', ')}</strong> ${over.length===1?'is':'are'} over the retainer.`:''}</div>
    </div>`;
  }

  if (!clients.length){
    html += `<div class="empty">No clients yet — add them under <b>Settings</b>.</div>`;
  } else {
    html += `<div class="grid">` + clients.map(c=>{
      const u = clientUsage(c);
      const cls = u.pct>=100?'over':u.pct>=75?'warn':'';
      const status = u.pct>=100
        ? `<span class="status over"><span class="pulse"></span>Over retainer by ${fmtH(u.used-c.retainer_hours)}</span>`
        : u.pct>=75
        ? `<span class="status warn"><span class="pulse"></span>Reaching limit — tell the client</span>`
        : `<span class="status ok">${fmtH(c.retainer_hours-u.used)} remaining</span>`;
      const bd = Object.entries(u.perMember).sort((a,b)=>b[1]-a[1])
        .map(([n,h])=>`<div><span>${esc(n)}</span><span>${fmtH(h)}</span></div>`).join('');
      return `<div class="card client-card">
        <h3><span class="dot" style="background:${clientColor(c.id)}"></span>${esc(c.name)}</h3>
        <div class="cycle">${fmtDate(u.cyc.start)} – ${fmtDate(u.cyc.end)} · renews ${fmtDate(u.cyc.next)} · ${c.retainer_hours/8} day${c.retainer_hours===8?'':'s'}/mo</div>
        <div class="meter">
          <div class="fill ${cls}" style="width:${Math.min(u.pct,100)}%"></div>
          <div class="tick"></div>
        </div>
        <div class="meter-stats">
          <span>${fmtH(u.used)} of ${fmtH(c.retainer_hours)}</span>
          <span class="pct">${Math.round(u.pct)}%</span>
        </div>
        ${status}
        ${bd? `<div class="breakdown">${bd}</div>`:''}
      </div>`;
    }).join('') + `</div>`;
  }
  main.innerHTML = html;
}

function renderLog(){
  const clients = state.clients.filter(c=>c.active);
  const members = state.members.filter(m=>m.active);
  const today = state.logDate || iso(new Date());
  state.logDate = null;
  const lastMember = store.get('rs_last_member') || '';

  main.innerHTML = `
    <h2>Log time</h2><div class="sub">Raw hours are multiplied by the team member's factor</div>
    <div class="card" style="max-width:680px">
      <form class="log" id="logForm">
        <div><label>Client</label><select id="f_client" required>
          ${clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
        <div><label>Team member</label><select id="f_member" required>
          ${members.map(m=>`<option value="${m.id}" ${m.id===lastMember?'selected':''}>${esc(m.name)} (×${m.weight})</option>`).join('')}</select></div>
        <div><label>Date</label><input type="date" id="f_date" value="${today}" required></div>
        <div><label>Hours worked</label><input type="number" id="f_hours" min="0.25" step="0.25" placeholder="e.g. 4" required></div>
        <div class="full"><label>Task</label><input type="text" id="f_desc" placeholder="What was the work?"></div>
        <div class="weighted-note" id="f_note">Counts as <b>—</b> against the retainer</div>
        <div class="full"><button type="button" class="btn" id="f_submit">Log task</button></div>
      </form>
    </div>

    <div style="margin-top:34px">
      <h2 style="font-size:17px">Recent tasks</h2>
      <div class="card" style="margin-top:12px;padding:8px 12px">
        <table><thead><tr><th>Date</th><th>Client</th><th>Member</th><th>Task</th><th style="text-align:right">Hours</th><th style="text-align:right">Weighted</th><th></th></tr></thead>
        <tbody>${state.tasks.slice(0,25).map(t=>{
          const c=state.clients.find(c=>c.id===t.client_id), m=state.members.find(m=>m.id===t.member_id);
          return `<tr>
            <td>${fmtDate(new Date(t.task_date+'T00:00'))}</td>
            <td><span class="chip"><span class="dot" style="background:${c?clientColor(c.id):'#999'}"></span>${esc(c?c.name:'—')}</span></td>
            <td>${esc(m?m.name:'—')}</td>
            <td>${esc(t.description||'')}</td>
            <td style="text-align:right">${fmtH(t.hours)}</td>
            <td style="text-align:right"><b>${fmtH(t.hours*t.weight_applied)}</b></td>
            <td style="text-align:right"><button class="btn small danger" data-del="${t.id}">Delete</button></td>
          </tr>`;}).join('') || '<tr><td colspan="7" class="empty">Nothing logged yet.</td></tr>'}
        </tbody></table>
      </div>
    </div>`;

  const note = $('#f_note');
  function updateNote(){
    const m = members.find(m=>m.id===$('#f_member').value);
    const h = parseFloat($('#f_hours').value);
    note.innerHTML = (m && h>0)
      ? `${fmtH(h)} × ${m.weight} — counts as <b>${fmtH(h*m.weight)}</b> against the retainer`
      : `Counts as <b>—</b> against the retainer`;
  }
  $('#f_member').addEventListener('change', updateNote);
  $('#f_hours').addEventListener('input', updateNote);
  updateNote();

  $('#f_submit').addEventListener('click', async ()=>{
    const member = members.find(m=>m.id===$('#f_member').value);
    const hours = parseFloat($('#f_hours').value);
    if (!$('#f_client').value || !member || !(hours>0) || !$('#f_date').value){ toast('Fill in client, member, date and hours'); return; }
    const { error } = await db.from('rs_tasks').insert({
      client_id: $('#f_client').value, member_id: member.id,
      task_date: $('#f_date').value, hours,
      description: $('#f_desc').value.trim() || null,
      weight_applied: member.weight
    });
    if (error){ toast('Could not save'); console.error(error); return; }
    store.set('rs_last_member', member.id);
    toast(`Logged — ${fmtH(hours*member.weight)} weighted`);
    await loadAll();
  });

  main.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Delete this task?')) return;
    const { error } = await db.from('rs_tasks').delete().eq('id', b.dataset.del);
    if (error){ toast('Delete failed'); return; }
    await loadAll();
  }));
}

function renderCalendar(){
  if (!state.calMonth) state.calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const m0 = state.calMonth;
  const y = m0.getFullYear(), mo = m0.getMonth();
  const first = new Date(y, mo, 1);
  const startPad = (first.getDay()+6)%7;                 // Monday first
  const daysIn = new Date(y, mo+1, 0).getDate();
  const todayIso = iso(new Date());
  const byDay = {};
  state.tasks.forEach(t=>{ (byDay[t.task_date]=byDay[t.task_date]||[]).push(t); });

  let cells = '';
  for(let i=0;i<startPad;i++) cells += `<div class="day blank"></div>`;
  for(let d=1;d<=daysIn;d++){
    const dIso = iso(new Date(y,mo,d));
    const list = (byDay[dIso]||[]);
    const chips = list.slice(0,3).map(t=>{
      const c = state.clients.find(c=>c.id===t.client_id);
      return `<div class="task-chip" style="background:${c?clientColor(c.id):'#999'}" title="${esc(t.description||'')}">${esc(c?c.name:'?')} · ${fmtH(t.hours*t.weight_applied)}</div>`;
    }).join('') + (list.length>3? `<div style="color:var(--muted)">+${list.length-3} more</div>`:'');
    cells += `<div class="day ${dIso===todayIso?'today':''}" data-date="${dIso}"><div class="num">${d}</div>${chips}</div>`;
  }

  main.innerHTML = `
    <h2>Calendar</h2><div class="sub">Weighted hours per task · click a day to log time for that date</div>
    <div class="cal-head">
      <button class="btn ghost small" id="calPrev">←</button>
      <h3>${m0.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3>
      <button class="btn ghost small" id="calNext">→</button>
      <button class="btn ghost small" id="calToday">Today</button>
    </div>
    <div class="cal">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>`;

  $('#calPrev').onclick = ()=>{ state.calMonth = new Date(y, mo-1, 1); renderCalendar(); };
  $('#calNext').onclick = ()=>{ state.calMonth = new Date(y, mo+1, 1); renderCalendar(); };
  $('#calToday').onclick = ()=>{ state.calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); renderCalendar(); };
  main.querySelectorAll('.day[data-date]').forEach(el=>el.addEventListener('click', ()=>{
    state.logDate = el.dataset.date; state.view='log'; render();
  }));
}

function renderSettings(){
  main.innerHTML = `
    <h2>Settings</h2><div class="sub">Clients, retainers and team weighting</div>
    <div class="settings-cols">
      <div class="card">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:10px">Clients</h3>
        <table><thead><tr><th>Name</th><th>Days/mo</th><th>Renews on</th><th></th></tr></thead><tbody>
        ${state.clients.map(c=>`<tr style="${c.active?'':'opacity:.45'}">
          <td>${esc(c.name)}</td>
          <td>${c.retainer_hours/8} (${fmtH(c.retainer_hours)})</td>
          <td>${c.renewal_day}${['st','nd','rd'][((c.renewal_day+90)%100-10)%10-1]||'th'}</td>
          <td style="text-align:right"><button class="btn small ghost" data-cactive="${c.id}">${c.active?'Archive':'Restore'}</button></td>
        </tr>`).join('') || '<tr><td colspan="4" class="empty">No clients yet.</td></tr>'}
        </tbody></table>
        <div class="row-form">
          <input id="c_name" placeholder="Client name" style="flex:2">
          <select id="c_days"><option value="8">1 day (8h)</option><option value="16">2 days (16h)</option><option value="24">3 days (24h)</option><option value="32">4 days (32h)</option></select>
          <select id="c_renew">${Array.from({length:28},(_,i)=>`<option value="${i+1}">Renews ${i+1}</option>`).join('')}</select>
          <button class="btn small" id="c_add">Add</button>
        </div>
      </div>

      <div class="card">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:10px">Team members</h3>
        <table><thead><tr><th>Name</th><th>Factor</th><th></th></tr></thead><tbody>
        ${state.members.map(m=>`<tr style="${m.active?'':'opacity:.45'}">
          <td>${esc(m.name)}</td>
          <td>×${m.weight}</td>
          <td style="text-align:right">
            <button class="btn small ghost" data-mweight="${m.id}">Change factor</button>
            <button class="btn small ghost" data-mactive="${m.id}">${m.active?'Archive':'Restore'}</button>
          </td>
        </tr>`).join('') || '<tr><td colspan="3" class="empty">No team members yet.</td></tr>'}
        </tbody></table>
        <div class="row-form">
          <input id="m_name" placeholder="Name" style="flex:2">
          <input id="m_weight" type="number" step="0.25" min="0.25" value="1" title="Weighting factor">
          <button class="btn small" id="m_add">Add</button>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:10px">Factor multiplies logged hours, e.g. ×2 turns 4 real hours into 8 retainer hours. Changing a factor only affects tasks logged from then on.</div>
      </div>
    </div>`;

  $('#c_add').onclick = async ()=>{
    const name = $('#c_name').value.trim(); if(!name){ toast('Client needs a name'); return; }
    const { error } = await db.from('rs_clients').insert({ name, retainer_hours:+$('#c_days').value, renewal_day:+$('#c_renew').value });
    if(error){ toast('Could not add client'); return; } await loadAll();
  };
  $('#m_add').onclick = async ()=>{
    const name = $('#m_name').value.trim(); const w = parseFloat($('#m_weight').value);
    if(!name || !(w>0)){ toast('Name and a positive factor needed'); return; }
    const { error } = await db.from('rs_members').insert({ name, weight:w });
    if(error){ toast('Could not add member'); return; } await loadAll();
  };
  main.querySelectorAll('[data-cactive]').forEach(b=>b.onclick = async ()=>{
    const c = state.clients.find(c=>c.id===b.dataset.cactive);
    await db.from('rs_clients').update({active:!c.active}).eq('id',c.id); await loadAll();
  });
  main.querySelectorAll('[data-mactive]').forEach(b=>b.onclick = async ()=>{
    const m = state.members.find(m=>m.id===b.dataset.mactive);
    await db.from('rs_members').update({active:!m.active}).eq('id',m.id); await loadAll();
  });
  main.querySelectorAll('[data-mweight]').forEach(b=>b.onclick = async ()=>{
    const m = state.members.find(m=>m.id===b.dataset.mweight);
    const v = prompt(`New weighting factor for ${m.name}`, m.weight);
    const w = parseFloat(v); if(!(w>0)) return;
    await db.from('rs_members').update({weight:w}).eq('id',m.id); await loadAll();
  });
}

/* ---------- setup / boot ---------- */
function showSetup(){
  main.innerHTML = `
    <div class="setup">
      <h2>Connect to Supabase</h2>
      <p>Paste your project URL and anon key (Project settings → API). They'll be remembered in this browser. Run <b>retainer-tracker-setup.sql</b> in the SQL editor first if you haven't.</p>
      <label>Project URL</label><input id="s_url" placeholder="https://xxxx.supabase.co">
      <label>Anon key</label><input id="s_key" placeholder="eyJ…">
      <button class="btn" id="s_go">Connect</button>
    </div>`;
  $('#s_go').onclick = ()=>{
    const url = $('#s_url').value.trim(), key = $('#s_key').value.trim();
    if(!url.startsWith('http') || !key){ toast('Both fields needed'); return; }
    store.set('rs_rt_url', url); store.set('rs_rt_key', key);
    boot();
  };
}

async function boot(){
  const url = SUPABASE_URL || store.get('rs_rt_url');
  const key = SUPABASE_ANON_KEY || store.get('rs_rt_key');
  if(!url || !key){ showSetup(); return; }
  db = supabase.createClient(url, key);
  $('#nav').style.display = 'flex';
  document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click', ()=>{ state.view=b.dataset.view; render(); }));
  await loadAll();
}
boot();
</script>
</body>
</html>
