/* Which zone of the client dashboard a category renders in. Must stay in sync
   with the rs_stage_categories_zone_check constraint in outputs/v27_dashboard_
   zones.sql + outputs/v28_meeting_notes_zone.sql. general/proofing/brief/vault
   are all flattened into one "Stage Materials" grid as of v0.37.0 (no more
   per-category grouping shown to admins), 'notes' feeds "Meeting Notes". */
const CATEGORY_ZONES = [
  ['general',  'Materials', 'Shown in the Stage Materials grid, as today'],
  ['proofing', 'Materials (proofing)', 'Shown in the Stage Materials grid'],
  ['brief',    'Materials (brief)', 'Shown in the Stage Materials grid'],
  ['vault',    'Materials (vault)', 'Shown in the Stage Materials grid'],
  ['notes',    'Meeting notes', 'Shown in the separate Meeting Notes grid'],
];

/* NOT currently called from the public dashboard — as of v0.37.0, "Stage
   Materials"/"Meeting Notes" auto-create-or-reuse a category via
   ensureMaterialsCategory() (in renderPublicDashboard) instead of exposing
   category management directly, since admins no longer see categories as a
   grouping concept. Left in place (still correct, still exercises the same
   schema) in case fine-grained per-category control is wanted again later. */
function openStageCategoryModal(ctx, onDone){
  onDone = onDone || refreshProjectView;
  const existing = ctx.categoryId ? state.stageCategories.find(c=>c.id===ctx.categoryId) : null;
  const isNew = !existing;
  // On create the scope comes from ctx; on edit it's already on the row and
  // must be preserved untouched (we only ever change name + zone).
  const stageId = isNew ? (ctx.stageId || null) : existing.stage_id;
  const projectId = isNew ? (ctx.projectId || null) : existing.project_id;
  const clientId = isNew ? (ctx.clientId || null) : existing.client_id;
  const zone = (existing && existing.zone) || ctx.zone || 'general';
  showModal(`
    <h3>${isNew?'New category':'Edit category'}</h3>
    <div class="sub">e.g. "Design files", "Brand assets" — links you add underneath will show grouped under this name on the client's dashboard.</div>
    <form class="log" style="max-width:none">
      <div class="full"><label>Category name</label><input type="text" id="cat_name" placeholder="e.g. Design files" value="${esc(existing?existing.name:'')}"></div>
      <div class="full"><label>Show in</label><select id="cat_zone">${CATEGORY_ZONES.map(([v,label,hint])=>`<option value="${v}" ${zone===v?'selected':''}>${esc(label)} — ${esc(hint)}</option>`).join('')}</select></div>
    </form>
    <div class="modal-actions">
      ${isNew?'<span></span>':`<button class="btn danger" id="cat_delete">Delete category</button>`}
      <div class="right">
        <button class="btn ghost" id="cat_cancel">Cancel</button>
        <button class="btn" id="cat_save">${isNew?'Add category':'Save changes'}</button>
      </div>
    </div>
  `);
  $('#cat_cancel').onclick = closeModal;
  if(!isNew) $('#cat_delete').onclick = async ()=>{
    if(!confirm('Delete this category and all its links? This cannot be undone.')) return;
    const { error } = await db.from('rs_stage_categories').delete().eq('id', existing.id);
    if(error){ toast('Delete failed'); return; }
    closeModal(); toast('Category deleted'); await onDone();
  };
  $('#cat_save').onclick = async ()=>{
    const name = $('#cat_name').value.trim();
    if(!name){ toast('Give the category a name'); return; }
    const newZone = $('#cat_zone').value;
    if(isNew){
      // Position is per zone AND per scope, so re-tagging a category doesn't
      // collide with whatever is already sitting in the destination zone.
      const position = state.stageCategories.filter(c=> c.zone===newZone && (stageId ? c.stage_id===stageId : projectId ? c.project_id===projectId : c.client_id===clientId && !c.stage_id && !c.project_id)).length;
      const { error } = await db.from('rs_stage_categories').insert({ stage_id:stageId, project_id:projectId, client_id:clientId, zone:newZone, name, position });
      if(error){ toast(error.code==='PGRST204'?'Run migration v27 to enable dashboard zones':'Could not add category'); console.error(error); return; }
      closeModal(); toast('Category added'); await onDone();
    } else {
      const { error } = await db.from('rs_stage_categories').update({ name, zone:newZone }).eq('id', existing.id);
      if(error){ toast(error.code==='PGRST204'?'Run migration v27 to enable dashboard zones':'Could not save'); console.error(error); return; }
      closeModal(); toast('Category updated'); await onDone();
    }
  };
}

    <div class="sub">${esc(cl?cl.name:'')} · ${esc(proj.name)} ${tc?'· '+projectTypeIconHtml(proj.project_type,12)+' '+esc(proj.project_type):''}${s.due_date?' · due '+fmtDateY(new Date(s.due_date+'T00:00'))+(s.due_time?' at '+formatTime12(s.due_time):''):''}</div>
    ${tasks.length? `<table><thead><tr><th>Task</th><th>Status</th><th>Assigned</th></tr></thead><tbody>
      ${tasks.map(t=>`<tr><td><span class="status-dot" style="background:${statusColor(t.status)}"></span>${esc(t.title)}</td><td><span class="status-pill" style="background:${mutedBg(statusColor(t.status))};color:${statusColor(t.status)}">${statusIcon(t.status)} ${esc(t.status||'To do')}</span></td><td>${avatarGroupHtml(t.assigned_designer_ids)}</td></tr>`).join('')}
    </tbody></table>` : `<div class="empty">No tasks in this stage yet.</div>`}
    <div class="modal-actions">
      <div class="right">
        <button class="btn ghost" id="sp_close">Close</button>
        <button class="btn" id="sp_goto">Open project</button>
      </div>
    </div>
  `);
  $('#sp_close').onclick = closeModal;
  $('#sp_goto').onclick = ()=>{
    closeModal();
    state.view='projects'; state.projView='project'; state.projClientId=proj.client_id; state.projProjectId=proj.id;
    render();
  };
}

function attachMilestoneInteractions(){
  main.querySelectorAll('[data-mview]').forEach(el=>el.addEventListener('click', ()=>{ state.milestoneViewMode = el.dataset.mview; renderMilestones(); }));
  if($('#mShowBtn')) $('#mShowBtn').onclick = (e)=>{
    e.stopPropagation();
    openCheckboxDropdown(e.currentTarget, [
      {key:'projects', label:'Projects'},
      {key:'retainer', label:'Retainer'}
    ], key=> key==='projects' ? state.milestoneShowProjects : state.milestoneShowRetainer,
    (key,checked)=>{
      if(key==='projects') state.milestoneShowProjects = checked; else state.milestoneShowRetainer = checked;
      renderMilestones();
    });
  };
  if($('#mTypeBtn')) $('#mTypeBtn').onclick = (e)=>{
    e.stopPropagation();
    const types = state.projectTypes.filter(t=>t.active);
    openCheckboxDropdown(e.currentTarget, types.map(t=>({key:t.name, label:`${t.icon} ${t.name}`})),
      key=>!state.milestoneTypeHidden.has(key),
      (key,checked)=>{ checked ? state.milestoneTypeHidden.delete(key) : state.milestoneTypeHidden.add(key); renderMilestones(); });
  };
  if($('#mClientsBtn')) $('#mClientsBtn').onclick = (e)=>{
    e.stopPropagation();
    const clients = state.clients.filter(c=>c.active && (
      state.projects.some(p=>p.client_id===c.id) ||
      state.projTasks.some(t=>t.client_id===c.id && !t.project_id && t.due_date)
    ));
    openCheckboxDropdown(e.currentTarget, clients.map(c=>({key:c.id, label:c.name, dot:colorFor(c)})),
      key=>!state.milestoneHidden.has(key),
      (key,checked)=>{ checked ? state.milestoneHidden.delete(key) : state.milestoneHidden.add(key); renderMilestones(); });
  };
  main.querySelectorAll('[data-msitem]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [type,id] = el.dataset.msitem.split(':');
      if(type==='stage') openStagePreviewModal(id);
      else jumpToProjTask(id);
    });
    el.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', el.dataset.msitem); e.dataTransfer.effectAllowed='move'; });
  });
  main.querySelectorAll('.day[data-date]').forEach(dayEl=>{
    dayEl.addEventListener('dragover', e=>{ e.preventDefault(); dayEl.classList.add('drop-target'); });
    dayEl.addEventListener('dragleave', ()=> dayEl.classList.remove('drop-target'));
    dayEl.addEventListener('drop', async e=>{
      e.preventDefault(); dayEl.classList.remove('drop-target');
      const raw = e.dataTransfer.getData('text/plain');
      const [type,id] = (raw||'').split(':');
      const newDate = dayEl.dataset.date;
      if(!type || !id || !newDate) return;
      const { error } = type==='stage'
        ? await db.from('rs_project_stages').update({ due_date:newDate }).eq('id', id)
        : await db.from('rs_proj_tasks').update({ due_date:newDate }).eq('id', id);
      if(error){ toast('Could not move'); return; }
      toast(`Moved to ${fmtDate(new Date(newDate+'T00:00'))}`);
      await refreshProjectView();
    });
  });
}

function collectMilestoneItems(){
  const byDay = {};
  if(state.milestoneShowProjects){
    state.stages.filter(s=>s.due_date).forEach(s=>{
      const proj = state.projects.find(p=>p.id===s.project_id);
      if(!proj || state.milestoneHidden.has(proj.client_id)) return;
      if(state.milestoneTypeHidden.has(proj.project_type)) return;
      (byDay[s.due_date]=byDay[s.due_date]||[]).push({ type:'stage', s, proj, time:s.due_time||'99:99' });
    });
  }
  if(state.milestoneShowRetainer){
    state.projTasks.filter(t=>t.due_date && t.client_id && !t.project_id).forEach(t=>{
      if(state.milestoneHidden.has(t.client_id)) return;
      (byDay[t.due_date]=byDay[t.due_date]||[]).push({ type:'task', t, time:'99:99' });
    });
  }
  return byDay;
}
function milestoneItemChip(item, weekStyle){
  if(item.type==='stage'){
    const cl = state.clients.find(c=>c.id===item.proj.client_id);
    return milestoneChipHtml(item.s, item.proj, cl, weekStyle);
  }
  const cl = state.clients.find(c=>c.id===item.t.client_id);
  return retainerMilestoneChipHtml(item.t, cl, weekStyle);
}

function renderGanttBody(){
  const projects = state.projects.filter(p=>p.active && !state.milestoneHidden.has(p.client_id) && !state.milestoneTypeHidden.has(p.project_type));
  const rows = [];
  let minDate = null, maxDate = null;
  projects.forEach(p=>{
    const client = state.clients.find(c=>c.id===p.client_id);
    if(!client) return;
    const stages = state.stages.filter(s=>s.project_id===p.id).sort((a,b)=>a.position-b.position);
    const dated = stages.filter(s=>s.due_date);
    if(!dated.length) return;
    dated.forEach(s=>{
      const d = new Date(s.due_date+'T00:00');
      if(!minDate || d<minDate) minDate = d;
      if(!maxDate || d>maxDate) maxDate = d;
    });
    rows.push({ p, client, stages });
  });
  if(!rows.length) return `<div class="empty">No projects with stage due dates yet — set due dates on stages to see them here.</div>`;

  minDate = new Date(minDate); minDate.setDate(minDate.getDate()-3);
  maxDate = new Date(maxDate); maxDate.setDate(maxDate.getDate()+3);
  const totalMs = maxDate - minDate;
  const totalDays = Math.max(1, Math.round(totalMs/86400000));
  const pct = d => Math.max(0, Math.min(100, (d-minDate)/totalMs*100));
  const LABEL_COL = 180;
  const trackLeft = p => `calc(${LABEL_COL}px + (100% - ${LABEL_COL}px) * ${(p/100).toFixed(4)})`;

  const monthMarkers = [];
  let cursor = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
  while(cursor<=maxDate){
    monthMarkers.push({ label:cursor.toLocaleDateString('en-GB',{month:'short',year:'numeric'}), left:pct(cursor) });
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }

  // Day-level ticks on the X axis, spaced out depending on the total span so
  // labels stay readable — the wrap scrolls horizontally (and widens via the
  // min-width below) rather than cramming every date into a fixed width.
  const stepDays = totalDays<=21 ? 1 : totalDays<=60 ? 3 : totalDays<=120 ? 7 : 14;
  const today = new Date(iso(new Date())+'T00:00');
  const showToday = today>=minDate && today<=maxDate;
  const todayLeft = showToday ? trackLeft(pct(today)) : null;
  const dayMarkers = [];
  let dcursor = new Date(minDate);
  while(dcursor<=maxDate){
    // Skip a tick that would sit right under the "Today" pill — avoids the
    // two labels overlapping when today happens to fall near a tick.
    if(!showToday || Math.abs(dcursor-today)/86400000 > 1.5){
      dayMarkers.push({ label:dcursor.toLocaleDateString('en-GB',{day:'numeric',month:'short'}), left:pct(dcursor) });
    }
    dcursor.setDate(dcursor.getDate()+stepDays);
  }
  const minWidthPx = Math.max(640, LABEL_COL + dayMarkers.length*64);

  const byClient = {};
  rows.forEach(r=>{ (byClient[r.client.id] = byClient[r.client.id] || { client:r.client, items:[] }).items.push(r); });

  let html = `<div class="gantt-wrap">
    <div class="gantt-header" style="min-width:${minWidthPx}px">
      <div class="gantt-label-col"></div>
      <div class="gantt-track-col" style="background:none">${monthMarkers.map(m=>`<div class="gantt-month-marker" style="left:${m.left}%">${esc(m.label)}</div>`).join('')}</div>
      <div class="gantt-track-col" style="background:none;position:absolute;top:16px;left:${LABEL_COL}px;right:0;height:16px">${dayMarkers.map(m=>`<div class="gantt-day-marker" style="left:${m.left}%">${esc(m.label)}</div>`).join('')}</div>
    </div>`;

  Object.values(byClient).forEach(group=>{
    const barColor = colorFor(group.client);
    html += `<div class="gantt-client-row"><span class="dot" style="background:${barColor}"></span>${esc(group.client.name)}</div>`;
    group.items.forEach(({p,stages})=>{
      let segs = '';
      let prevDate = null;
      stages.forEach(s=>{
        if(!s.due_date) return;
        const d = new Date(s.due_date+'T00:00');
        if(prevDate){
          const left = pct(prevDate);
          const width = Math.max(pct(d)-left, 0.6);
          segs += `<div class="gantt-bar" draggable="true" data-msitem="stage:${s.id}" style="left:${left}%;width:${width}%;background:${barColor}" title="${esc(s.name)} — due ${fmtDate(d)}">${esc(s.name)}</div>`;
        } else {
          segs += `<div class="gantt-kickoff" data-msitem="stage:${s.id}" style="left:${pct(d)}%;background:${barColor}" title="Kickoff — ${fmtDate(d)}"></div>`;
        }
        prevDate = d;
      });
      html += `<div class="gantt-row" style="min-width:${minWidthPx}px"><div class="gantt-label-col">${esc(p.name)}</div><div class="gantt-track-col">${segs}</div></div>`;
    });
  });

  if(showToday){
    html += `<div class="gantt-today-line" style="left:${todayLeft}"></div>
      <div class="gantt-today-label" style="left:${todayLeft}">Today</div>`;
  }

  html += `</div>`;
  return html;
}

function renderMilestones(){
  if(!state.milestoneAnchor) state.milestoneAnchor = new Date();
  const anchor = state.milestoneAnchor;
  const todayIso = iso(new Date());
  const byDay = collectMilestoneItems();

  const controlsRow = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px">
    <div class="view-toggle" style="margin-bottom:0">
      <button class="btn small ${state.milestoneViewMode==='week'?'':'ghost'}" data-mview="week">Week</button>
      <button class="btn small ${state.milestoneViewMode==='month'?'':'ghost'}" data-mview="month">Month</button>
      <button class="btn small ${state.milestoneViewMode==='year'?'':'ghost'}" data-mview="year">Year</button>
      <button class="btn small ${state.milestoneViewMode==='gantt'?'':'ghost'}" data-mview="gantt">Gantt</button>
    </div>
    <div class="cal-filters" style="margin-bottom:0">
      <button class="btn small ghost" id="mShowBtn">Show ▾</button>
      <button class="btn small ghost" id="mTypeBtn">Project type ▾</button>
      <button class="btn small ghost" id="mClientsBtn">Clients ▾</button>
    </div>
  </div>`;

  let body = '';
  if(state.milestoneViewMode==='week'){
    const start = startOfWeek(anchor);
    const days = Array.from({length:5},(_,i)=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d; });
    const end = days[4];
    let cells = days.map(d=>{
      const dIso = iso(d);
      const list = (byDay[dIso]||[]).slice().sort((a,b)=> a.time.localeCompare(b.time));
      const chips = list.map(item=>milestoneItemChip(item, true)).join('');
      return `<div class="day ${dIso===todayIso?'today':''}" data-date="${dIso}"><div class="num">${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'})}</div>${chips}</div>`;
    }).join('');
    body = `<div class="cal-head"><button class="btn ghost small" id="mPrev">←</button><h3>${fmtDateY(start)} – ${fmtDateY(end)}</h3><button class="btn ghost small" id="mNext">→</button><button class="btn ghost small" id="mToday">Today</button></div>
      <div class="week-grid" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px">${cells}</div>`;
  } else if(state.milestoneViewMode==='year'){
    const y = anchor.getFullYear();
    let months = '';
    for(let m=0;m<12;m++){
      const daysIn = new Date(y,m+1,0).getDate();
      const rows = [];
      for(let d=1; d<=daysIn; d++){
        const dIso = iso(new Date(y,m,d));
        (byDay[dIso]||[]).forEach(item=>{
          if(item.type==='stage'){
            const cl = state.clients.find(c=>c.id===item.proj.client_id);
            rows.push(`<div class="year-row"><span class="dot" style="background:${cl?colorFor(cl):'#999'}"></span><span style="min-width:64px;color:var(--muted)">${fmtDate(new Date(dIso+'T00:00'))}</span><span style="cursor:pointer" data-msitem="stage:${item.s.id}">${esc(cl?cl.name:'')} — ${esc(item.proj.name)} · ${esc(item.s.name)}</span></div>`);
          } else {
            const cl = state.clients.find(c=>c.id===item.t.client_id);
            rows.push(`<div class="year-row"><span class="dot" style="background:${cl?colorFor(cl):'#999'}"></span><span style="min-width:64px;color:var(--muted)">${fmtDate(new Date(dIso+'T00:00'))}</span><span style="cursor:pointer" data-msitem="task:${item.t.id}">${esc(cl?cl.name:'')} — ${esc(item.t.title)} <span style="color:var(--muted)">(retainer)</span></span></div>`);
          }
        });
      }
      if(rows.length) months += `<div class="year-month"><h4>${new Date(y,m,1).toLocaleDateString('en-GB',{month:'long'})}</h4>${rows.join('')}</div>`;
    }
    body = `<div class="cal-head"><button class="btn ghost small" id="mPrev">←</button><h3>${y}</h3><button class="btn ghost small" id="mNext">→</button><button class="btn ghost small" id="mToday">Today</button></div>
      ${months || '<div class="empty">No milestones this year.</div>'}`;
  } else if(state.milestoneViewMode==='gantt'){
    body = renderGanttBody();
  } else {
    const y = anchor.getFullYear(), mo = anchor.getMonth();
    const first = new Date(y, mo, 1);
    const cells = monthWeekdayCells(y, mo, todayIso, (d,dIso,isToday)=>{
      const list = byDay[dIso]||[];
      const chips = list.map(item=>milestoneItemChip(item, false)).join('');
      return `<div class="day ${isToday?'today':''}" data-date="${dIso}"><div class="num">${d}</div>${chips}</div>`;
    });
    body = `<div class="cal-head"><button class="btn ghost small" id="mPrev">←</button><h3>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3><button class="btn ghost small" id="mNext">→</button><button class="btn ghost small" id="mToday">Today</button></div>
      <div class="cal milestones">${['Mon','Tue','Wed','Thu','Fri'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
  }

  main.innerHTML = `<h2>Milestones</h2>
    ${controlsRow}${body}`;

  if($('#mPrev')) $('#mPrev').onclick = ()=>{
    if(state.milestoneViewMode==='week'){ const d=new Date(anchor); d.setDate(d.getDate()-7); state.milestoneAnchor=d; }
    else if(state.milestoneViewMode==='year'){ state.milestoneAnchor = new Date(anchor.getFullYear()-1, anchor.getMonth(), 1); }
    else { state.milestoneAnchor = new Date(anchor.getFullYear(), anchor.getMonth()-1, 1); }
    renderMilestones();
  };
  if($('#mNext')) $('#mNext').onclick = ()=>{
    if(state.milestoneViewMode==='week'){ const d=new Date(anchor); d.setDate(d.getDate()+7); state.milestoneAnchor=d; }
    else if(state.milestoneViewMode==='year'){ state.milestoneAnchor = new Date(anchor.getFullYear()+1, anchor.getMonth(), 1); }
    else { state.milestoneAnchor = new Date(anchor.getFullYear(), anchor.getMonth()+1, 1); }
    renderMilestones();
  };
  if($('#mToday')) $('#mToday').onclick = ()=>{ state.milestoneAnchor = new Date(); renderMilestones(); };
  attachMilestoneInteractions();
}

/* One "row" per project (with a scope summary via projectDetailsSummary),
   plus one synthetic row per retainer client (they don't have discrete
   typed projects under the flat retainer model). */
function clientListRows(){
  const rows = [];
  state.clients.filter(c=>c.active).forEach(c=>{
    if(c.is_retainer){
      rows.push({ client:c, project:null, badgeType:'retainer', scope:null, startDate:c.created_at||null });
    }
    state.projects.filter(p=>p.client_id===c.id && p.active).forEach(p=>{
      const kickoff = state.stages.filter(s=>s.project_id===p.id).sort((a,b)=>a.position-b.position)[0];
      rows.push({ client:c, project:p, badgeType:'project', scope:projectDetailsSummary(p), startDate:(kickoff&&kickoff.due_date)||p.created_at||null });
    });
  });
  return rows;
}

function renderClientListTable(){
  if(!state.clientListGroup) state.clientListGroup = 'client';
  if(!state.clientListSort) state.clientListSort = 'alpha';
  const rows = clientListRows();
  const sortRows = (arr)=> arr.sort((a,b)=>{
    if(state.clientListSort==='started'){
      const da = a.startDate||'', db = b.startDate||'';
      return da.localeCompare(db);
    }
    return a.client.name.localeCompare(b.client.name) || (a.project? a.project.name.localeCompare(b.project?.name||''):0);
  });

  const rowHtml = (r)=> `<tr class="task-row" data-clientrow="${r.client.id}">
    <td><span class="dot" style="background:${colorFor(r.client)};display:inline-block;margin-right:8px;vertical-align:middle"></span>${esc(r.client.name)}</td>
    <td>${r.badgeType==='retainer'? '<span class="retainer-badge" style="margin-left:0">Retainer</span>' : '<span class="project-badge" style="margin-left:0">Project</span>'}</td>

      <tr><td colspan="7" style="background:var(--track);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">${esc(name)} <span style="font-weight:400;text-transform:none;letter-spacing:0">(${groups[name].length})</span></td></tr>
      ${sortRows(groups[name]).map(rowHtml).join('')}
    `).join('');
  } else {
    const byClient = {};
    rows.forEach(r=>{ (byClient[r.client.id]=byClient[r.client.id]||{client:r.client, items:[]}).items.push(r); });
    const clientGroups = Object.values(byClient).sort((a,b)=>{
      if(state.clientListSort==='started'){
        const da = a.items.map(r=>r.startDate||'9999').sort()[0], db = b.items.map(r=>r.startDate||'9999').sort()[0];
        return da.localeCompare(db);
      }
      return a.client.name.localeCompare(b.client.name);
    });
    bodyHtml = clientGroups.map(g=>`
      <tr><td colspan="7" style="background:var(--track);font-weight:600;font-size:12px;color:var(--ink)"><span class="dot" style="background:${colorFor(g.client)};display:inline-block;margin-right:8px;vertical-align:middle"></span>${esc(g.client.name)} <span style="font-weight:400;color:var(--muted)">(${g.items.length})</span></td></tr>
      ${sortRows(g.items).map(rowHtml).join('')}
    `).join('');
  }

  let html = `<div class="breadcrumb"><button data-bc="clients">All Projects</button><span class="sep">/</span><span class="current">Client list</span></div>
    <h2>Client list</h2>
    <div class="sub">Every client and project at a glance — grouped and sorted however's useful.</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:var(--muted)">Group by</span>
        <div class="view-toggle" style="margin-bottom:0">
          <button class="btn small ${state.clientListGroup==='client'?'':'ghost'}" data-clgroup="client">Client</button>
          <button class="btn small ${state.clientListGroup==='type'?'':'ghost'}" data-clgroup="type">Project type</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:var(--muted)">Sort by</span>
        <div class="view-toggle" style="margin-bottom:0">
          <button class="btn small ${state.clientListSort==='alpha'?'':'ghost'}" data-clsort="alpha">Alphabetical</button>
          <button class="btn small ${state.clientListSort==='started'?'':'ghost'}" data-clsort="started">Time started</button>
        </div>
      </div>
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
    <table style="min-width:920px"><thead><tr>
      <th>Client</th><th>Type</th><th>Project</th><th>Scope</th><th>Started</th><th></th><th></th>
    </tr></thead><tbody>${bodyHtml || `<tr><td colspan="7" class="empty">No clients yet.</td></tr>`}</tbody></table>
    </div>`;
  main.innerHTML = html;
  $('[data-bc="clients"]').onclick = ()=>{ state.projView='clients'; render(); };

function clientCardHtml(c){
  if(c.is_retainer){
    const openTasks = state.projTasks.filter(t=>t.client_id===c.id && !t.project_id && !isCompleteStatus(t.status));
    const u = clientUsage(c);
    return `<div class="card client-card" data-projgoto="${c.id}">
      <h3 style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${colorFor(c)}"></span>${esc(c.name)}<span class="home-count">${openTasks.length}</span>
        <span class="card-actions"><button class="btn small ghost menu-dots" data-clientmenu="${c.id}" title="More options"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="15" height="15"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button></span>
      </h3>
      <div class="cycle">${renewsInDays(u.cyc.next)}</div>
      ${compactMeterHtml(u)}
    </div>`;
  }
  const projects = state.projects.filter(p=>p.client_id===c.id && p.active);
  const projectIds = new Set(projects.map(p=>p.id));
  const openTaskCount = state.projTasks.filter(t=>projectIds.has(t.project_id) && !isCompleteStatus(t.status)).length;
  const nextMilestone = state.stages
    .filter(s=>projectIds.has(s.project_id) && s.due_date && stageStatus(s.id)!=='Complete')
    .sort((a,b)=>a.due_date.localeCompare(b.due_date))[0];
  const milestoneLine = nextMilestone
    ? `<div style="margin:6px 0 10px;font-size:12px"><span style="color:var(--muted)">Next milestone:</span> <span style="color:var(--accent);font-weight:500">${esc(nextMilestone.name)} is ${daysUntilLabel(nextMilestone.due_date+'T00:00')}</span></div>`
    : '';
  const body = projects.length
    ? `<div class="proj-pills">${projects.map(p=>{ const tc=typeConfig(p.project_type); return `<button type="button" class="proj-pill" data-projectgoto="${p.id}" data-projectclientid="${c.id}">${tc?projectTypeIconHtml(p.project_type,12)+' ':''}${esc(p.name)}</button>`; }).join('')}</div>`
    : `<div class="cycle">No projects yet</div>`;
  return `<div class="card client-card" data-projgoto="${c.id}">
    <h3 style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${colorFor(c)}"></span>${esc(c.name)}<span class="home-count">${openTaskCount}</span>
      <span class="card-actions"><button class="btn small ghost menu-dots" data-clientmenu="${c.id}" title="More options"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="15" height="15"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button></span>
    </h3>
    ${milestoneLine}
    ${body}
  </div>`;
}

function taskEntriesFor(taskId){ return (state.projTaskEntries||[]).filter(e=>e.proj_task_id===taskId).sort((a,b)=>a.work_date.localeCompare(b.work_date)); }
function taskHoursTotal(taskId){
  return taskEntriesFor(taskId).reduce((n,e)=>{ const m=state.members.find(mm=>mm.id===e.member_id); return n + e.hours*(m?(m.weight||1):1); }, 0);
}

function openRetainerTaskTimeModal(taskId, onDone){
  const task = state.projTasks.find(t=>t.id===taskId);
  if(!task) return;
  const existingEntries = taskEntriesFor(taskId);
  const assignedIds = task.assigned_designer_ids||[];
  // Build rows: one per already-assigned designer, plus any existing entries for non-assigned members
  const extraMemberIds = [...new Set(existingEntries.map(e=>e.member_id).filter(id=>!assignedIds.includes(id)))];
  const rowMemberIds = [...assignedIds, ...extraMemberIds];
  const allMembers = state.members.filter(m=>m.active!==false);

  function entryRowsHtml(){
    const rows = rowMemberIds.map(mid=>{
      const m = allMembers.find(mm=>mm.id===mid);
      if(!m) return '';
      const existing = existingEntries.find(e=>e.member_id===mid);
      return `<div class="entry-row" data-entryrow="${mid}" style="display:grid;grid-template-columns:1fr 80px auto;gap:8px;align-items:center;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="avatar" style="background:${colorFor({color:PALETTE[allMembers.indexOf(m)%PALETTE.length]})};width:28px;height:28px;font-size:10px;flex:none">${esc(initials(m.name))}</div>
          <div>
            <div style="font-size:13.5px;font-weight:500">${esc(m.name)}</div>
            <div style="font-size:11px;color:var(--muted)">×${m.weight||1} weight</div>
          </div>
        </div>
        <input type="number" min="0" step="0.25" class="entry-hours" data-memberid="${mid}" value="${existing?existing.hours:''}" placeholder="0" style="text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit">
        <span style="font-size:12px;color:var(--muted);white-space:nowrap" id="weight_${mid}">${existing? `= ${fmtH(existing.hours*(m.weight||1))}` : ''}</span>
      </div>`;
    }).join('');
    return rows + `<div style="margin-top:12px">
      <label style="font-size:12px;color:var(--muted)">Work date</label>
      ${dateFieldHtml('ttm_date', iso(new Date()), 'Set date')}
    </div>`;
  }

  showModal(`
    <h3>${esc(task.title)}</h3>
    <div class="sub" style="margin-bottom:16px">Log hours for each team member who worked on this task</div>
    <div id="ttm_rows">${entryRowsHtml()}</div>
    <div class="modal-actions">
      <button class="btn ghost" id="ttm_edittask">Edit task</button>
      <div class="right">
        <button class="btn ghost" id="ttm_cancel">Cancel</button>
        <button class="btn" id="ttm_save">Save hours</button>
      </div>
    </div>
  `);
  wireDateField('ttm_date', 'Set date');
  document.querySelectorAll('.entry-hours').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const mid = inp.dataset.memberid;
      const m = allMembers.find(mm=>mm.id===mid);
      const w = m ? (m.weight||1) : 1;
      const h = parseFloat(inp.value)||0;
      const lbl = document.getElementById('weight_'+mid);
      if(lbl) lbl.textContent = h>0 ? `= ${fmtH(h*w)}` : '';
    });
  });
  $('#ttm_cancel').onclick = closeModal;
  $('#ttm_edittask').onclick = ()=>{ closeModal(); openProjTaskModal(taskId, {}); };
  $('#ttm_save').onclick = async ()=>{
    const work_date = $('#ttm_date').value || iso(new Date());
    const updates = [];
    document.querySelectorAll('.entry-hours').forEach(inp=>{
      const h = parseFloat(inp.value);
      if(h>0) updates.push({ member_id: inp.dataset.memberid, hours: h });
    });
    if(!updates.length){ toast('Enter at least one person\'s hours'); return; }
    for(const u of updates){
      const existing = existingEntries.find(e=>e.member_id===u.member_id);
      if(existing){
        const { error } = await db.from('rs_proj_task_entries').update({ hours:u.hours, work_date }).eq('id', existing.id);
        if(!error){ const rec = state.projTaskEntries.find(x=>x.id===existing.id); if(rec){ rec.hours=u.hours; rec.work_date=work_date; } }
      } else {
        const { data, error } = await db.from('rs_proj_task_entries').insert({ proj_task_id:taskId, member_id:u.member_id, hours:u.hours, work_date }).select().single();
        if(!error && data) state.projTaskEntries.push(data);
      }
    }
    closeModal(); toast('Hours saved');
    if(onDone) onDone(); else await refreshProjectView();
  };
}

function openTaskEntryModal(taskId, entryId, onDone){
  const isNew = !entryId;
  const e = entryId ? (state.projTaskEntries||[]).find(x=>x.id===entryId) : null;
  const task = state.projTasks.find(t=>t.id===taskId);
  const allMembers = state.members.filter(m=>m.active!==false);
  // Pre-select the first assigned designer who doesn't have an entry yet
  const assigned = task ? (task.assigned_designer_ids||[]) : [];
  const taken = taskEntriesFor(taskId).map(x=>x.member_id);
  const suggestedId = isNew ? (assigned.find(id=>!taken.includes(id)) || '') : '';
  showModal(`
    <h3>${isNew?'Log time for a person':'Edit time entry'}</h3>
    <form class="log" style="max-width:none">
      <div><label>Team member</label><select id="te_member"><option value="">— select —</option>${allMembers.map(m=>`<option value="${m.id}" ${(e?e.member_id===m.id:m.id===suggestedId)?'selected':''}>${esc(m.name)} (×${m.weight||1})</option>`).join('')}</select></div>
      <div><label>Hours</label><input type="number" min="0" step="0.25" id="te_hours" value="${e?e.hours:''}" placeholder="e.g. 2.5"></div>
      <div><label>Work date</label>${dateFieldHtml('te_date', e?e.work_date:iso(new Date()), 'Set date')}</div>
      <div class="full"><label>Notes <span style="color:var(--muted);font-weight:400">(optional)</span></label><input type="text" id="te_notes" value="${esc(e?e.notes||'':'')}" placeholder="e.g. Initial concept"></div>
    </form>
    <div class="modal-actions">
      ${!isNew? `<button class="btn danger" id="te_delete">Delete</button>`:'<span></span>'}
      <div class="right">
        <button class="btn ghost" id="te_cancel">Cancel</button>
        <button class="btn" id="te_save">${isNew?'Log hours':'Save'}</button>
      </div>
    </div>
  `);
  wireDateField('te_date', 'Set date');
  $('#te_cancel').onclick = closeModal;
  if(!isNew) $('#te_delete').onclick = async ()=>{
    const { error } = await db.from('rs_proj_task_entries').delete().eq('id', entryId);
    if(error){ toast('Delete failed'); return; }
    closeModal(); toast('Entry removed');
    const idx = (state.projTaskEntries||[]).findIndex(x=>x.id===entryId);
    if(idx>=0) state.projTaskEntries.splice(idx,1);
    if(onDone) onDone();
  };
  $('#te_save').onclick = async ()=>{
    const member_id = $('#te_member').value;
    const hours = parseFloat($('#te_hours').value);
    const work_date = $('#te_date').value || iso(new Date());
    const notes = $('#te_notes').value.trim() || null;
    if(!member_id){ toast('Select a team member'); return; }
    if(!hours || hours<=0){ toast('Enter a valid number of hours'); return; }
    if(isNew){
      const { data, error } = await db.from('rs_proj_task_entries').insert({ proj_task_id:taskId, member_id, hours, work_date, notes }).select().single();
      if(error){ toast('Could not save'); console.error(error); return; }
      (state.projTaskEntries = state.projTaskEntries||[]).push(data);
      closeModal(); toast('Hours logged');
    } else {
      const { error } = await db.from('rs_proj_task_entries').update({ member_id, hours, work_date, notes }).eq('id', entryId);
      if(error){ toast('Could not save'); return; }
      const entry = (state.projTaskEntries||[]).find(x=>x.id===entryId);
      if(entry){ entry.member_id=member_id; entry.hours=hours; entry.work_date=work_date; entry.notes=notes; }
      closeModal(); toast('Entry updated');
    }
    if(onDone) onDone();
  };
}

function blankProjTask(ctx){
  ctx = ctx || {};
  let clientId = ctx.clientId || null;
  if(!clientId && ctx.projectId){
    const proj = state.projects.find(p=>p.id===ctx.projectId);
    if(proj) clientId = proj.client_id;
  }
  const client = clientId ? state.clients.find(c=>c.id===clientId) : null;
  return { id:null, project_id:ctx.projectId||null, stage_id:ctx.stageId||null, client_id:ctx.clientId||null,
    title:'', priority:'Medium', status:'To do',
    assigned_designer_ids:[], assigned_reviewer_ids:[], assigned_animator_ids:[], recorded_hours:null, due_date:null, work_date:iso(new Date()),
    counts_toward_retainer: !!(client && client.is_retainer), retainer_task_ids:[] };
}

function stageStatus(stageId){
  const tasks = state.projTasks.filter(t=>t.stage_id===stageId);
  if(!tasks.length) return 'Pending';
  return tasks.every(t=>isCompleteStatus(t.status)) ? 'Complete' : 'Active';
}
/* First stage (by position) that isn't complete — i.e. the one currently in
   play. Takes `stages` as an argument rather than reading state, because the
   public dashboard path skips loadAll() and only hand-populates a few state
   keys; a global-reading helper would silently see an empty array there.
   Note two OTHER "next stage" rules still exist inline in the internal app
   (clientCardHtml's cross-project next-by-due-date, and the client project
   grid's next-by-position) — those are deliberately left alone for now. */
function nextIncompleteStage(stages){
  return (stages||[]).slice().sort((a,b)=>(a.position||0)-(b.position||0)).find(s=>stageStatus(s.id)!=='Complete') || null;
}

const TASK_COL_DEFAULTS = { status:205, priority:104, designer:88, reviewer:88, animator:88, hours:64, due:104, retainer:80 };
const TASKSAHEAD_COL_DEFAULTS = { due:96, project:150, status:205, priority:96, assigned:88 };
function colWidth(store, key, defaults){ return (store[key] || defaults[key]) + 'px'; }

function taskClient(t){
  if(t.client_id) return state.clients.find(c=>c.id===t.client_id) || null;
  if(t.project_id){ const p=state.projects.find(p=>p.id===t.project_id); return p ? state.clients.find(c=>c.id===p.client_id)||null : null; }
  return null;
}

/* Cell/header renderers for each toggleable task column, keyed the same as
   TASK_COLUMNS. Iterated in state.taskColOrder so the user's drag-reordering
   in the Columns popover is reflected directly in the grid. */
const TASK_COLUMN_DEFS = {
  status:   { label:'Status',   cell:(t)=>`<div>${statusPillBtnHtml(t)}</div>` },
  priority: { label:'Priority', cell:(t)=>`<div>${priorityPillBtnHtml(t)}</div>` },
  designer: { label:'Designer', cell:(t)=>`<div class="inline-editable" data-assigninline="${t.id}:designer" title="Click to edit designers">${avatarGroupHtml(t.assigned_designer_ids)}</div>` },
  reviewer: { label:'Reviewer', cell:(t)=>`<div class="inline-editable" data-assigninline="${t.id}:reviewer" title="Click to edit reviewers">${avatarGroupHtml(t.assigned_reviewer_ids)}</div>` },
  hours:    { label:'Hours',    cell:(t)=>`<div class="inline-editable" data-taskhours="${t.id}" title="Click to edit hours">${taskEntriesFor(t.id).length? fmtH(taskHoursTotal(t.id)) : (t.recorded_hours!=null?fmtH(t.recorded_hours):'—')}</div>` },
  due:      { label:'Due',      cell:(t)=>`<div>${dueDateBtnHtml(t)}</div>` },
  retainer: { label:'Retainer', headerAlign:'center', cell:(t)=>{
    const client = taskClient(t);
    const retainerClickable = !!client?.is_retainer;
    let retainerCell = '—';
    if(t.counts_toward_retainer){
      retainerCell = taskEntriesFor(t.id).length
        ? '<span class="retainer-tick">✓</span>'
        : '<span style="color:var(--amber);font-weight:700" title="Ticked, but no time entries logged yet">⚠</span>';
    }
    return `<div style="text-align:center" class="${retainerClickable?'inline-editable':''}" ${retainerClickable?`data-retainerinline="${t.id}" title="Click to toggle counting toward the retainer"`:''}>${retainerCell}</div>`;
  }}
};
function taskColumnOrder(){
  const known = TASK_COLUMNS.map(([k])=>k);
  const saved = (state.taskColOrder||[]).filter(k=>known.includes(k));
  known.forEach(k=>{ if(!saved.includes(k)) saved.push(k); });
  return saved;
}
function visibleTaskCols(showRetainer){
  return taskColumnOrder().filter(k=> state.taskCols.has(k) && (k!=='retainer' || showRetainer!==false));
}

function taskGridColumns(showAnimator, showRetainer){
  const cols = ['minmax(160px,1fr)'];
  visibleTaskCols(showRetainer).forEach(k=>{
    cols.push(colWidth(state.taskColWidths,k,TASK_COL_DEFAULTS));
    if(k==='reviewer' && showAnimator) cols.push(colWidth(state.taskColWidths,'animator',TASK_COL_DEFAULTS));
  });
  cols.push('34px');
  return cols.join(' ');
}

function taskRowHtml(t, showAnimator, showRetainer){
  const cellsHtml = visibleTaskCols(showRetainer).map(k=>{
    let html = TASK_COLUMN_DEFS[k].cell(t);
    if(k==='reviewer' && showAnimator){
      html += `<div class="inline-editable" data-assigninline="${t.id}:animator" title="Click to edit animators">${avatarGroupHtml(t.assigned_animator_ids)}</div>`;
    }

    ${cellsHtml}
    <div class="tg-actions">
      <button type="button" class="btn small ghost row-edit-btn" data-taskeditbtn="${t.id}">Edit</button>
      <button type="button" class="btn small ghost menu-dots" data-taskmenu="${t.id}" title="More options"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="15" height="15"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button>

function resizeHandle(key, storeName){
  return `<span class="col-resize-handle" data-resizecol="${key}" data-widthstore="${storeName}"></span>`;
}

function taskTableHtml(tasks, visibleCount, emptyText, showAnimator, showRetainer){
  if(!tasks.length) return `<div class="task-grid">${emptyStateHtml({ icon:'tray', title: emptyText||'Nothing here yet.' })}</div>`;
  const gridCols = taskGridColumns(showAnimator, showRetainer);
  const headerCells = visibleTaskCols(showRetainer).map(k=>{
    const def = TASK_COLUMN_DEFS[k];
    let html = `<div style="position:relative${def.headerAlign?`;text-align:${def.headerAlign}`:''}">${def.label}${resizeHandle(k,'task')}</div>`;
    if(k==='reviewer' && showAnimator) html += `<div style="position:relative">Animator${resizeHandle('animator','task')}</div>`;
    return html;
  }).join('');
  const header = `<div class="task-grid-row task-grid-header" style="grid-template-columns:${gridCols}">
      <div style="position:relative">Task</div>
      ${headerCells}
      <div></div>
    </div>`;
  const rows = tasks.map(t=>taskRowHtml(t, showAnimator, showRetainer)).join('');
  return `<div class="task-grid">${header}${rows}</div>`;
}

async function duplicateProjTask(taskId){
  const t = state.projTasks.find(t=>t.id===taskId);
  if(!t) return;
  const client = taskClient(t);
  const fields = {
    project_id: t.project_id, stage_id: t.stage_id, client_id: t.client_id,
    title: t.title + ' (copy)', status: 'To do', priority: t.priority,
    assigned_designer_ids: t.assigned_designer_ids||[], assigned_reviewer_ids: t.assigned_reviewer_ids||[], assigned_animator_ids: t.assigned_animator_ids||[],
    recorded_hours: null, due_date: t.due_date, work_date: iso(new Date()),
    counts_toward_retainer: !!(client && client.is_retainer), retainer_task_ids: []
  };
  let { error } = await db.from('rs_proj_tasks').insert(fields);
  if(error && error.code==='42703'){
    const { assigned_animator_ids, ...rest } = fields;
    ({ error } = await db.from('rs_proj_tasks').insert(rest));
  }
  if(error){ toast('Could not duplicate task'); console.error(error); return; }
  toast('Task duplicated'); await refreshProjectView();
}

async function deleteProjTaskQuick(taskId){
  const t = state.projTasks.find(t=>t.id===taskId);
  if(!t) return;
  if(!confirm(`Delete "${t.title}"? This cannot be undone.`)) return;
  if(t.retainer_task_ids && t.retainer_task_ids.length) await Promise.all(t.retainer_task_ids.map(id=>db.from('rs_tasks').delete().eq('id',id)));
  const { error } = await db.from('rs_proj_tasks').delete().eq('id', taskId);
  if(error){ toast('Delete failed'); return; }
  toast('Task deleted'); await refreshProjectView();
}

const ASSIGN_ROLE_FIELD = { designer:'assigned_designer_ids', reviewer:'assigned_reviewer_ids', animator:'assigned_animator_ids' };
const ASSIGN_ROLE_CAN = { designer:'can_design', reviewer:'can_review', animator:'can_animate' };

function openInlineHoursEdit(el, taskId){
  const task = state.projTasks.find(t=>t.id===taskId);
  const original = task && task.recorded_hours!=null ? String(task.recorded_hours) : '';
  const input = document.createElement('input');
  input.type = 'number'; input.step = '0.25'; input.min = '0'; input.value = original;
  input.className = 'inline-rename-input'; input.style.width = '64px'; input.style.textAlign = 'right';
  el.replaceWith(input); input.focus(); input.select();
  input.addEventListener('click', ev=> ev.stopPropagation());
  input.addEventListener('keydown', ev=>{
    if(ev.key==='Enter') input.blur();
    if(ev.key==='Escape'){ input.dataset.cancel='1'; input.blur(); }
  });
  input.addEventListener('blur', async ()=>{
    if(input.dataset.cancel){ input.replaceWith(el); return; }
    const val = input.value.trim();
    const hours = val==='' ? null : Math.max(0, +val);
    if(hours===null && original===''){ input.replaceWith(el); return; }
    const { error } = await db.from('rs_proj_tasks').update({ recorded_hours: hours }).eq('id', taskId);
    if(error){ toast('Could not update hours'); input.replaceWith(el); return; }
    await refreshProjectView();
  }, { once:true });
}

function wireTaskRows(root){
  root.querySelectorAll('[data-clientlink]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const cl = state.clients.find(c=>c.id===el.dataset.clientlink);
    if(!cl) return;
    state.view='projects'; state.projClientId=cl.id; state.projProjectId=null;
    state.projView = cl.is_retainer ? 'retainerTasks' : 'clientProjects'; state.retainerTab='tasks';
    render();
  }));
  root.querySelectorAll('[data-taskeditbtn]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    openProjTaskModal(el.dataset.taskeditbtn, {});
  }));
  root.querySelectorAll('[data-taskhours]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const taskId = el.dataset.taskhours;
    const task = state.projTasks.find(t=>t.id===taskId);
    const client = taskClient(task);
    if(task && !task.project_id && client?.is_retainer) openRetainerTaskTimeModal(taskId);
    else openInlineHoursEdit(el, taskId);
  }));
  root.querySelectorAll('[data-taskdue]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const taskId = el.dataset.taskdue;
    const task = state.projTasks.find(t=>t.id===taskId);
    if(!task) return;
    openMiniDatePicker(el, task.due_date, async (newDate)=>{
      const { error } = await db.from('rs_proj_tasks').update({ due_date:newDate }).eq('id', taskId);
      if(error){ toast('Could not save date'); return; }
      await refreshProjectView();
    });
  }));
  root.querySelectorAll('[data-statusinline]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    openStatusPopover(el, el.dataset.statusinline);
  }));
  root.querySelectorAll('[data-priorityinline]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    openPriorityPopover(el, el.dataset.priorityinline);
  }));
  root.querySelectorAll('[data-assigninline]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const [taskId, role] = el.dataset.assigninline.split(':');
    const task = state.projTasks.find(t=>t.id===taskId);
    if(!task) return;
    const field = ASSIGN_ROLE_FIELD[role];
    const pool = state.members.filter(m=>m.active && m[ASSIGN_ROLE_CAN[role]]!==false);
    const current = new Set(task[field]||[]);
    const options = pool.map(m=>({ value:m.id, html:`<span style="display:inline-flex;align-items:center;gap:8px">${avatarHtml(m)}${esc(m.name)}</span>` }));
    openMultiPillPopover(el, options, val=>current.has(val), async (val, checked)=>{
      checked ? current.add(val) : current.delete(val);
      const { error } = await db.from('rs_proj_tasks').update({ [field]: Array.from(current) }).eq('id', taskId);
      if(error){ toast(error.code==='42703' ? 'Run migration v19 to enable animator assignments' : 'Could not update'); return; }
      await refreshProjectView();
    });
  }));
  root.querySelectorAll('[data-retainerinline]').forEach(el=>el.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const taskId = el.dataset.retainerinline;
    const task = state.projTasks.find(t=>t.id===taskId);
    const client = taskClient(task);
    if(!task || !client?.is_retainer) return;
    const { error } = await db.from('rs_proj_tasks').update({ counts_toward_retainer: !task.counts_toward_retainer }).eq('id', taskId);
    if(error){ toast('Could not update'); return; }
    await refreshProjectView();
  }));
  root.querySelectorAll('[data-taskname]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const taskId = el.dataset.taskname;
    const original = el.textContent;
    const input = document.createElement('input');
    input.type = 'text'; input.value = original; input.className = 'inline-rename-input';
    el.replaceWith(input); input.focus(); input.select();
    input.addEventListener('click', ev=> ev.stopPropagation());
    input.addEventListener('keydown', ev=>{
      if(ev.key==='Enter') input.blur();
      if(ev.key==='Escape'){ input.dataset.cancel='1'; input.blur(); }
    });
    input.addEventListener('blur', async ()=>{
      const val = input.value.trim();
      if(input.dataset.cancel || !val || val===original){ input.replaceWith(el); return; }
      const { error } = await db.from('rs_proj_tasks').update({ title: val }).eq('id', taskId);
      if(error){ toast('Could not rename task'); input.replaceWith(el); return; }
      toast('Task renamed');
      await refreshProjectView();
    }, { once:true });
  }));
  root.querySelectorAll('[data-taskmenu]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const taskId = el.dataset.taskmenu;
    const items = [
      { label:'Edit task', onClick:()=> openProjTaskModal(taskId, {}) },
      { label:'Duplicate task', onClick:()=> duplicateProjTask(taskId) },
      { label:'Delete task', danger:true, onClick:()=> deleteProjTaskQuick(taskId) }
    ];
    openMenuPopover(e.currentTarget, items);
  }));
}

function renderTasksAhead(){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayIso = iso(today);
  const endDate = new Date(today); endDate.setDate(endDate.getDate()+6);
  const endIso = iso(endDate);

  const byClient = {};
  state.projTasks.forEach(t=>{
    if(!t.due_date || t.due_date<todayIso || t.due_date>endIso || isCompleteStatus(t.status)) return;
    let clientId = t.client_id, projectName = null;
    if(t.project_id){
      const proj = state.projects.find(p=>p.id===t.project_id);
      if(!proj) return;
      clientId = proj.client_id; projectName = proj.name;
    }
    if(!clientId) return;
    const client = state.clients.find(c=>c.id===clientId);
    if(!client || !client.active) return;
    (byClient[clientId] = byClient[clientId] || { client, items:[] }).items.push({ t, projectName });
  });
  const groups = Object.values(byClient).sort((a,b)=>a.client.name.localeCompare(b.client.name));
  const totalTasks = groups.reduce((a,g)=>a+g.items.length,0);

  let html = `<h2>Week Tasks</h2><div class="sub">Everything due ${fmtDateY(today)} – ${fmtDateY(endDate)}, across every client · rolls forward each day</div>`;
  if(!groups.length){
    html += `<div class="card">${emptyStateHtml({ icon:'calendar', title:'Nothing due in the next 7 days', subtitle:'Tasks with a due date this week will show up here as soon as one is set.' })}</div>`;
  } else {
    groups.forEach(g=>{
      const items = g.items.sort((a,b)=> (a.t.due_date||'').localeCompare(b.t.due_date||''));
      html += `<div class="stage-section">
        <div class="gantt-client-row"><span class="dot" style="background:${colorFor(g.client)}"></span>${esc(g.client.name)}<span class="home-count" style="margin-left:8px">${items.length}</span></div>
        <div class="card" style="padding:8px 12px">${tasksAheadTableHtml(items)}</div>
      </div>`;
    });
  }
  main.innerHTML = html;
  wireTaskRows(main);
}

  if(modalRoot) modalRoot.addEventListener('click', (ev)=>{
    const btn = ev.target.closest('[data-editentry]');
    if(!btn) return;
    ev.stopPropagation();
    const entryId = btn.dataset.editentry;
    openTaskEntryModal(t.id, entryId, ()=>{
      const list = document.getElementById('pt_entries_list');
      if(list) list.innerHTML = taskEntriesHtml(t.id);
    });
  }, { once: true });
  wireDateField('pt_work', 'Set work date');
  if($('#pt_add_entry')) $('#pt_add_entry').onclick = ()=> openTaskEntryModal(t.id, null, ()=>{
    const list = document.getElementById('pt_entries_list');
    if(list) list.innerHTML = taskEntriesHtml(t.id);
    if($('#pt_add_entry')) $('#pt_add_entry').onclick = ()=> openTaskEntryModal(t.id, null, ()=>{
      const l2 = document.getElementById('pt_entries_list');
      if(l2) l2.innerHTML = taskEntriesHtml(t.id);
    });
  });
  $('#pt_cancel').onclick = closeModal;
  if(!isNew) $('#pt_delete').onclick = async ()=>{
    if(!confirm('Delete this task? This cannot be undone.')) return;
    if(t.retainer_task_ids && t.retainer_task_ids.length) await Promise.all(t.retainer_task_ids.map(id=>db.from('rs_tasks').delete().eq('id',id)));
    const { error } = await db.from('rs_proj_tasks').delete().eq('id', t.id);
    if(error){ toast('Delete failed'); return; }
    closeModal(); toast('Task deleted'); await refreshProjectView();
  };
  $('#pt_save').onclick = async ()=>{
    const title = $('#pt_title').value.trim();
    if(!title){ toast('Give the task a title'); return; }
    const fields = {
      project_id: project ? project.id : null,
      stage_id: stages.length ? $('#pt_stage').value : null,
      client_id: project ? null : client.id,
      title,
      status: $('#pt_status').value,
      priority: $('#pt_priority').value,
      assigned_designer_ids: Array.from(document.querySelectorAll('#pt_designers .member-pill.selected')).map(b=>b.dataset.pillmember),
      assigned_reviewer_ids: Array.from(document.querySelectorAll('#pt_reviewers .member-pill.selected')).map(b=>b.dataset.pillmember),
      recorded_hours: $('#pt_hours') ? ($('#pt_hours').value ? +$('#pt_hours').value : null) : null,
      due_date: $('#pt_due').value || null,
      work_date: document.getElementById('pt_work') ? ($('#pt_work').value || null) : (t.work_date||null),
      counts_toward_retainer: document.getElementById('pt_retainer') ? $('#pt_retainer').checked : false
    };
    if(showAnimators) fields.assigned_animator_ids = Array.from(document.querySelectorAll('#pt_animators .member-pill.selected')).map(b=>b.dataset.pillmember);
    let saved, animatorColMissing = false;
    if(isNew){
      const siblingCount = stages.length
        ? state.projTasks.filter(x=>x.stage_id===fields.stage_id).length
        : state.projTasks.filter(x=>x.client_id===fields.client_id && !x.project_id).length;
      let { data, error } = await db.from('rs_proj_tasks').insert({ ...fields, position: siblingCount }).select().single();
      if(error && error.code==='42703' && 'assigned_animator_ids' in fields){
        const { assigned_animator_ids, ...rest } = fields;
        ({ data, error } = await db.from('rs_proj_tasks').insert({ ...rest, position: siblingCount }).select().single());
        animatorColMissing = !error;
      }
      if(error){ toast('Could not save task'); console.error(error); return; }
      saved = data;
    } else {
      let { error } = await db.from('rs_proj_tasks').update(fields).eq('id', t.id);
      if(error && error.code==='42703' && 'assigned_animator_ids' in fields){
        const { assigned_animator_ids, ...rest } = fields;
        ({ error } = await db.from('rs_proj_tasks').update(rest).eq('id', t.id));
        animatorColMissing = !error;
      }
      if(error){ toast('Could not save task'); console.error(error); return; }
      saved = { ...t, ...fields };
    }
    closeModal();
    toast(animatorColMissing ? 'Saved — run migration v19 to enable animator assignments' : (isNew?'Task added':'Task updated'));
    await refreshProjectView();
  };
}

/* Checklists — a project can have any number of independently named
   checklists (each its own page), created on demand via "+ New checklist".
   Optionally seeded from a starter template at creation time (editable
   templates, see the Checklist templates section further down and Settings
   > "Checklist templates"); after that each checklist is fully independent
   — editing one never touches a template or any other project's checklists. */
const TRASH_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="15" height="15"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* "Blank" plus every user-editable row in rs_checklist_templates (seeded
   with Website/Branding/Animation/Deck starters by outputs/v25_checklist_
   templates.sql). Read fresh each time a checklist is created so edits made
   in Settings show up immediately. */
function checklistTemplateOptions(){
  const dbTemplates = state.checklistTemplates.slice().sort((a,b)=>(a.position||0)-(b.position||0)).map(t=>{
    const items = state.checklistTemplateItems.filter(i=>i.template_id===t.id).sort((a,b)=>(a.position||0)-(b.position||0));
    return { key:t.id, label:`${t.name} (${items.length} item${items.length===1?'':'s'})`, items };
  });
  return [{ key:'blank', label:'Blank', items:[] }, ...dbTemplates];
}

function openNewChecklistModal(projectId){
  const options = checklistTemplateOptions();
  showModal(`
    <h3>New checklist</h3>
    <form class="log" style="max-width:none">
      <div class="full"><label>Name</label><input type="text" id="ncl_name" placeholder="e.g. Website QA" value="Website Checklist"></div>
      <div class="full"><label>Start from</label><select id="ncl_template">${options.map(o=>`<option value="${o.key}">${esc(o.label)}</option>`).join('')}</select></div>
    </form>
    <div class="modal-actions">
      <div class="right">
        <button class="btn ghost" id="ncl_cancel">Cancel</button>
        <button class="btn" id="ncl_create">Create</button>
      </div>
    </div>
  `);
  $('#ncl_cancel').onclick = closeModal;
  $('#ncl_create').onclick = async ()=>{
    const name = $('#ncl_name').value.trim();
    if(!name){ toast('Give the checklist a name'); return; }
    const template = options.find(o=>o.key===$('#ncl_template').value) || options[0];
    const siblings = state.checklists.filter(c=>c.project_id===projectId);
    const nextPos = siblings.length ? Math.max(...siblings.map(c=>c.position||0))+1 : 0;
    const { data, error } = await db.from('rs_checklists').insert({ project_id:projectId, name, position:nextPos }).select().single();
    if(error){ toast(error.code==='PGRST205'?'Run migration v23 to enable checklists':'Could not create checklist'); console.error(error); return; }
    if(template.items.length){
      const { error: itemsErr } = await db.from('rs_checklist_items').insert(template.items.map((it,i)=>({ checklist_id:data.id, category:it.category||null, label:it.label, detail:it.detail||null, position:i })));
      if(itemsErr) console.warn('Could not seed checklist items', itemsErr);
    }
    await loadAll();
    openChecklistModal(data.id);
  };
}

/* Checklists dropdown — replaces the old full-page per-project checklist
   list. Anchored off the project header's "Checklists" button; lists each
   checklist with a progress bar, click to open it in the overlay below, or
   "+ New checklist" to create one. Reuses the shared menu-popover chrome. */
function openChecklistsPopover(anchorEl, projectId){
  closeMenuPopover();
  const pop = document.createElement('div');
  pop.className = 'menu-popover checklist-popover';
  document.body.appendChild(pop);
  _activeMenuPopover = pop;
  const checklists = state.checklists.filter(cl=>cl.project_id===projectId).sort((a,b)=>(a.position||0)-(b.position||0));
  const rows = checklists.map(cl=>{
    const items = state.checklistItems.filter(i=>i.checklist_id===cl.id);
    const done = items.filter(i=>i.is_done).length;
    const pct = items.length ? Math.round(done/items.length*100) : 0;
    return `<button type="button" class="checklist-row" data-clpopopen="${cl.id}">
      <div class="chr-top"><span class="chr-name">${esc(cl.name)}</span><span class="chr-count">${items.length? `${done}/${items.length}`:'—'}</span></div>
      ${items.length? `<div class="mini-progress"><div class="fill" style="width:${pct}%"></div></div>`:''}
    </button>`;
  }).join('');
  pop.innerHTML = `${rows || '<div class="clpop-empty">No checklists yet</div>'}<button type="button" class="clpop-add" data-clpopnew>+ New checklist</button>`;
  pop.querySelectorAll('[data-clpopopen]').forEach(b=>b.onclick=()=>{ closeMenuPopover(); openChecklistModal(b.dataset.clpopopen); });
  pop.querySelector('[data-clpopnew]').onclick = ()=>{ closeMenuPopover(); openNewChecklistModal(projectId); };
  const rect = anchorEl.getBoundingClientRect();
  pop.style.position = 'fixed';
  pop.style.top = Math.min(rect.bottom+6, window.innerHeight-360)+'px';
  pop.style.left = Math.max(8, Math.min(rect.right-280, window.innerWidth-290))+'px';
  pop.style.zIndex = 300;
  _menuOutsideHandler = e=>{ if(_activeMenuPopover && !_activeMenuPopover.contains(e.target) && e.target!==anchorEl) closeMenuPopover(); };
  setTimeout(()=> document.addEventListener('mousedown', _menuOutsideHandler), 0);
}

function checklistItemRowHtml(item){
  return `<div class="task-grid-row task-row" draggable="true" data-clitem="${item.id}" style="grid-template-columns:32px 1fr 32px">
    <div style="text-align:center"><input type="checkbox" data-clidone="${item.id}" ${item.is_done?'checked':''} title="Mark done"></div>
    <div class="tg-title" style="flex-direction:column;align-items:flex-start;gap:1px">
      <span class="inline-editable" data-cliname="${item.id}" style="${item.is_done?'text-decoration:line-through;color:var(--muted)':''}" title="Click to rename">${esc(item.label)}</span>
      ${item.detail? `<span style="font-size:11.5px;color:var(--muted)">${esc(item.detail)}</span>`:''}
    </div>
    <div class="tg-actions"><button type="button" class="btn small ghost menu-dots" data-clidelete="${item.id}" title="Delete item">${TRASH_ICON_SVG}</button></div>
  </div>`;

/* Individual checklist — a popup overlay (showModal) rather than its own
   page, opened from openChecklistsPopover or straight from the global
   Checklists hub. Every mutation reloads data then re-invokes this function
   so the modal redraws with fresh content instead of closing, same pattern
   as openAnimCellModal's feedback log. */
function openChecklistModal(checklistId){
  const cl = state.checklists.find(c=>c.id===checklistId);
  if(!cl){ closeModal(); return; }
  const p = state.projects.find(p=>p.id===cl.project_id);
  const items = state.checklistItems.filter(i=>i.checklist_id===cl.id).sort((a,b)=>(a.position||0)-(b.position||0));
  const doneCount = items.filter(i=>i.is_done).length;
  const pct = items.length ? Math.round(doneCount/items.length*100) : 0;

  const groups = [];
  const byCat = {};
  items.forEach(item=>{
    const key = item.category || '';
    if(!byCat[key]){ byCat[key] = { category:item.category||null, items:[] }; groups.push(byCat[key]); }
    byCat[key].items.push(item);
  });
  const body = items.length
    ? groups.map(g=> `${g.category? `<div style="font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px">${esc(g.category)}</div>`:''}${g.items.map(checklistItemRowHtml).join('')}`).join('')
    : emptyStateHtml({ icon:'check', title:'No items yet', subtitle:'Add items to build out this checklist.' });

  showModal(`
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:2px">
      <h3 style="margin:0">${esc(cl.name)}</h3>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn small ghost" id="renameChecklistBtn">Rename</button>
        <button class="btn small danger" id="deleteChecklistBtn">Delete</button>
      </div>
    </div>
    ${p? `<div class="sub" style="margin-bottom:10px">${esc(p.name)}</div>`:''}
    ${items.length? `<div style="margin-bottom:14px">
      <div class="mini-progress"><div class="fill" style="width:${pct}%"></div></div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:6px">${doneCount} of ${items.length} completed</div>
    </div>`:''}
    <div style="max-height:50vh;overflow-y:auto">${body}</div>
    <div class="modal-actions">
      <button class="btn small ghost" id="clAddBtn">+ Add item</button>
      <div class="right"><button class="btn ghost" id="cl_close">Close</button></div>
    </div>
  `, {wide:true});

  $('#cl_close').onclick = closeModal;
  $('#renameChecklistBtn').onclick = async ()=>{
    const name = prompt('Checklist name', cl.name);
    if(!name || !name.trim() || name.trim()===cl.name) return;
    const { error } = await db.from('rs_checklists').update({ name:name.trim() }).eq('id', checklistId);
    if(error){ toast('Could not rename'); return; }
    await loadAll(); openChecklistModal(checklistId);
  };
  $('#deleteChecklistBtn').onclick = async ()=>{
    if(!confirm('Delete this checklist and all its items?')) return;
    const { error } = await db.from('rs_checklists').delete().eq('id', checklistId);
    if(error){ toast('Delete failed'); return; }
    closeModal(); toast('Checklist deleted'); await loadAll();
  };
  $('#clAddBtn').onclick = async ()=>{
    const nextPos = items.length ? Math.max(...items.map(i=>i.position||0))+1 : 0;
    const { error } = await db.from('rs_checklist_items').insert({ checklist_id:checklistId, label:'New item', position:nextPos });
    if(error){ toast(error.code==='PGRST205'?'Run migration v23 to enable checklists':'Could not add item'); console.error(error); return; }
    await loadAll(); openChecklistModal(checklistId);
  };
  document.querySelectorAll('[data-clidone]').forEach(cb=>cb.addEventListener('change', async ()=>{
    const { error } = await db.from('rs_checklist_items').update({ is_done: cb.checked }).eq('id', cb.dataset.clidone);
    if(error){ toast('Could not update'); return; }
    await loadAll(); openChecklistModal(checklistId);
  }));
  document.querySelectorAll('[data-cliname]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const itemId = el.dataset.cliname;
    const original = el.textContent;
    const input = document.createElement('input');
    input.type = 'text'; input.value = original; input.className = 'inline-rename-input';
    el.replaceWith(input); input.focus(); input.select();
    input.addEventListener('click', ev=> ev.stopPropagation());
    input.addEventListener('keydown', ev=>{
      if(ev.key==='Enter') input.blur();
      if(ev.key==='Escape'){ input.dataset.cancel='1'; input.blur(); }
    });
    input.addEventListener('blur', async ()=>{
      const val = input.value.trim();
      if(input.dataset.cancel || !val || val===original){ input.replaceWith(el); return; }
      const { error } = await db.from('rs_checklist_items').update({ label: val }).eq('id', itemId);
      if(error){ toast('Could not rename item'); input.replaceWith(el); return; }
      await loadAll(); openChecklistModal(checklistId);
    }, { once:true });
  }));
  document.querySelectorAll('[data-clidelete]').forEach(el=>el.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const { error } = await db.from('rs_checklist_items').delete().eq('id', el.dataset.clidelete);
    if(error){ toast('Delete failed'); return; }
    await loadAll(); openChecklistModal(checklistId);
  }));
  document.querySelectorAll('[data-clitem]').forEach(row=>{
    row.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', row.dataset.clitem); e.dataTransfer.effectAllowed='move'; });
    row.addEventListener('dragover', e=>{ e.preventDefault(); row.classList.add('drop-target-row'); });
    row.addEventListener('dragleave', ()=> row.classList.remove('drop-target-row'));
    row.addEventListener('drop', async e=>{
      e.preventDefault(); row.classList.remove('drop-target-row');
      const draggedId = e.dataTransfer.getData('text/plain');
      const targetId = row.dataset.clitem;
      if(!draggedId || draggedId===targetId) return;
      const order = items.slice();
      const fromIdx = order.findIndex(i=>i.id===draggedId);
      const toIdx = order.findIndex(i=>i.id===targetId);
      if(fromIdx<0 || toIdx<0) return;
      const [moved] = order.splice(fromIdx,1);
      order.splice(toIdx,0,moved);
      await Promise.all(order.map((it,idx)=> db.from('rs_checklist_items').update({position:idx}).eq('id',it.id)));
      await loadAll(); openChecklistModal(checklistId);
    });
  });
}

  $('#tpli_save').onclick = async ()=>{
    const label = $('#tpli_label').value.trim();
    if(!label){ toast('Give the task a name'); return; }
    const category = $('#tpli_category').value.trim() || null;
    const detail = $('#tpli_detail').value.trim() || null;
    if(isNew){
      const siblings = state.checklistTemplateItems.filter(i=>i.template_id===templateId);
      const nextPos = siblings.length ? Math.max(...siblings.map(i=>i.position||0))+1 : 0;
      const { error } = await db.from('rs_checklist_template_items').insert({ template_id:templateId, category, label, detail, position:nextPos });
      if(error){ toast(error.code==='PGRST205'?'Run migration v25 to enable checklist templates':'Could not add task'); return; }
    } else {
      const { error } = await db.from('rs_checklist_template_items').update({ category, label, detail }).eq('id', itemId);
      if(error){ toast('Could not save'); return; }
    }
    await loadAll(); openChecklistTemplateModal(templateId);
  };
}

/* Global "Checklists" hub — quick access to every project that has at least
   one checklist, without drilling into All Projects first. Reads straight
   from state.checklists/state.checklistItems (the same data every project
   page uses), so it's always in sync — no separate copy of anything. */
function renderChecklistsHub(){
  const projectsWithChecklists = state.projects.filter(p => state.checklists.some(cl=>cl.project_id===p.id));
  const cardsHtml = projectsWithChecklists.map(p=>{
    const c = state.clients.find(c=>c.id===p.client_id);
    const checklists = state.checklists.filter(cl=>cl.project_id===p.id).sort((a,b)=>(a.position||0)-(b.position||0));
    const rows = checklists.map(cl=>{
      const items = state.checklistItems.filter(i=>i.checklist_id===cl.id);
      const done = items.filter(i=>i.is_done).length;
      const pct = items.length ? Math.round(done/items.length*100) : 0;
      return `<button type="button" class="checklist-row" data-hubchecklist="${cl.id}" title="Open checklist">
        <div class="chr-top"><span class="chr-name">${esc(cl.name)}</span><span class="chr-count">${items.length? `${done}/${items.length} done`:'No items'}</span></div>
        ${items.length? `<div class="mini-progress"><div class="fill" style="width:${pct}%"></div></div>`:''}
      </button>`;
    }).join('');
    return `<div class="card">
      <div style="display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted)">${c?`<span class="dot" style="background:${colorFor(c)}"></span>${esc(c.name)}`:''}</div>
      <div style="margin-top:6px;margin-bottom:10px"><span class="type-badge">${esc(p.project_type||'')}</span></div>

  }).join('');
  main.innerHTML = `
    <h2>Checklists</h2>
    <div class="sub">Every project with a checklist, one click away — synced live with each project's page</div>
    ${projectsWithChecklists.length
      ? `<div class="grid" style="margin-top:20px">${cardsHtml}</div>`
      : emptyStateHtml({ icon:'check', title:'No checklists yet', subtitle:"Create one from any project's page — it'll show up here." })}`;
  main.querySelectorAll('[data-hubchecklist]').forEach(el=>el.addEventListener('click', ()=> openChecklistModal(el.dataset.hubchecklist)));
}

        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${miroButtonsHtml(c)}
          <button class="btn small ghost" id="checklistsBtn">✓ Checklists${state.checklists.filter(cl=>cl.project_id===p.id).length? ` (${state.checklists.filter(cl=>cl.project_id===p.id).length})`:''}</button>

        <div style="margin-top:10px"><button class="btn small ghost" data-addtask="${s.id}">+ Task</button></div>
      </div>`;
    });
    html += `<div style="margin:4px 0 20px"><button class="btn small ghost" id="addStageBtn">+ Add stage</button></div>`;
  }
  main.innerHTML = html;
  $('[data-bc="clients"]').onclick = ()=>{ state.projView='clients'; render(); };
  $('[data-bc="client"]').onclick = ()=>{ state.projView='clientProjects'; render(); };
  $('#editProjectBtn').onclick = ()=> openProjectModal(p.id, p.client_id);
  $('#discordBtn').onclick = ()=> openDiscordModal(p.id);
  $('#checklistsBtn').onclick = (e)=>{ e.stopPropagation(); openChecklistsPopover(e.currentTarget, p.id); };
  wireMiroButtons();
  $('#colDropdownBtn').onclick = (e)=>{ e.stopPropagation(); openColumnDropdown(e.currentTarget); };
  main.querySelectorAll('[data-addtask]').forEach(el=>el.addEventListener('click', ()=> openProjTaskModal(null, { projectId:p.id, stageId:el.dataset.addtask })));
  wireTaskRows(main);
