<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reciprocal Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  :root{
    --navy:#040e6b;
    --navy-soft:#2a37a8;
    --accent:#2383e2;
    --accent-hover:#1a6fc4;
    --accent-soft:#eaf3fd;
    --ink:#37352f;
    --ink-light:#9a988f;
    --paper:#fbfaf8;
    --card:#ffffff;
    --line:#eae7e1;
    --line-soft:#f0eee9;
    --muted:#8a877e;
    --amber:#c98a2b;
    --amber-bg:#faf3e6;
    --red:#c4554d;
    --red-bg:#fbeeee;
    --green:#448361;
    --green-bg:#eaf4ee;
    --track:#f1f0ec;
    --row-hover:#f6f5f1;
    --radius:12px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(20,18,15,.04);
    --shadow-card:0 1px 2px rgba(20,18,15,.03), 0 4px 14px rgba(20,18,15,.05);
    --shadow-pop:0 10px 30px rgba(20,18,15,.12), 0 2px 8px rgba(20,18,15,.06);
    --ease:cubic-bezier(.4,0,.2,1);
    --fast:150ms;
    --dur:200ms;
    --sidebar-bg:#fbfaf7;
  }
  :root[data-theme="dark"]{
    --accent:#4a9eeb;
    --accent-hover:#6cb2f0;
    --accent-soft:#1c3452;
    --ink:#e9e7e2;
    --ink-light:#8f8d84;
    --paper:#1e1d1b;
    --card:#282725;
    --line:#3b3a37;
    --line-soft:#333230;
    --muted:#96948b;
    --amber:#e0ab5c;
    --amber-bg:#3c3020;
    --red:#e0918a;
    --red-bg:#3d2624;
    --green:#7cc79e;
    --green-bg:#1f3329;
    --track:#333230;
    --row-hover:#302f2c;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-card:0 1px 2px rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.3);
    --shadow-pop:0 10px 30px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
    --sidebar-bg:#232220;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{overflow-y:scroll;scrollbar-gutter:stable}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.55}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--accent)}
  ::selection{background:var(--accent-soft);color:var(--ink)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
  main.fade-in{animation:fadeIn var(--dur) var(--ease)}

  .app-shell{display:flex;align-items:stretch;min-height:100vh}
  #sidebar{width:232px;flex:none;background:var(--sidebar-bg);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overflow-x:hidden;display:none;flex-direction:column;gap:14px;transition:width var(--dur) var(--ease)}
  #sidebar .side-top{display:flex;align-items:center;gap:4px}
  #sidebar .brand{display:flex;align-items:center;gap:9px;padding:6px 6px 2px;font-weight:600;font-size:13.5px;letter-spacing:0;color:var(--ink);background:none;border:none;cursor:pointer;text-align:left;flex:1;min-width:0}
  #sidebar .brand-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sidebar .brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:none}
  #sidebar .brand:hover{opacity:.75}
  #sidebar .collapse-btn{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--ink-light);border-radius:6px;transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
  #sidebar .collapse-btn:hover{background:var(--track);color:var(--ink)}
  #sidebar .collapse-btn svg{width:15px;height:15px}
  #themeToggleBtn .icon-moon{display:none}
  :root[data-theme="dark"] #themeToggleBtn .icon-sun{display:none}
  :root[data-theme="dark"] #themeToggleBtn .icon-moon{display:block}
  #sidebar nav{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0}
  #sidebar nav button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;color:var(--muted);opacity:1;padding:7px 8px;font-size:13.5px;font-weight:500;border-radius:7px;border-bottom:none;text-align:left;transition:background var(--fast) var(--ease),color var(--fast) var(--ease);flex:none}
  #sidebar nav button svg{flex:none;width:17px;height:17px;opacity:.8}
  #sidebar nav button:hover{background:var(--track);color:var(--ink)}
  #sidebar nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #sidebar nav button.active svg{opacity:1}
  #sidebar nav button[data-view="settings"]{margin-top:auto}
  #sidebar nav button.nav-group-start{margin-top:18px}
  #sidebar nav .flag-count{background:var(--amber);color:#fff;border-radius:99px;font-size:10.5px;padding:1px 6px;margin-left:auto;font-weight:600}
  #sidebar .sidebar-user{display:flex;align-items:center;gap:9px;padding:8px;border-top:1px solid var(--line);margin-top:8px;flex:none}
  #sidebar .sidebar-user .nav-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500;color:var(--ink)}
  #sidebar.collapsed .sidebar-user{justify-content:center;padding:8px 0}
  #sidebar .sidebar-search-btn{display:flex;align-items:center;gap:9px;width:100%;background:var(--card);border:1px solid var(--line);color:var(--muted);padding:7px 8px;font-size:13px;border-radius:7px;cursor:pointer;margin-bottom:10px;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
  #sidebar .sidebar-search-btn:hover{background:var(--track)}
  #sidebar .sidebar-search-btn svg{width:16px;height:16px;flex:none;opacity:.8}
  #sidebar .sidebar-search-btn .cmd-hint{margin-left:auto}
  #sidebar.collapsed .sidebar-search-btn{justify-content:center}
  #sidebar.collapsed .sidebar-search-btn .nav-label,#sidebar.collapsed .sidebar-search-btn .cmd-hint{display:none}

  .cmd-hint{font-size:10.5px;color:var(--muted);background:var(--track);padding:2px 6px;border-radius:5px;flex:none;font-weight:500}
  .cmd-backdrop{position:fixed;inset:0;background:rgba(20,18,15,.32);z-index:400;display:flex;justify-content:center;padding:12vh 20px 20px;animation:backdropIn var(--fast) var(--ease)}
  .cmd-box{background:var(--card);width:100%;max-width:560px;height:fit-content;max-height:64vh;border-radius:var(--radius);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;overflow:hidden;animation:modalIn var(--dur) var(--ease)}
  .cmd-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
  .cmd-input-wrap svg{width:18px;height:18px;color:var(--muted);flex:none}
  .cmd-input-wrap input{border:none;padding:0;font-size:14.5px;flex:1;background:transparent;width:auto}
  .cmd-input-wrap input:focus{outline:none;box-shadow:none;border-color:transparent}
  .cmd-results{overflow-y:auto;padding:8px}
  .cmd-group-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-light);padding:8px 10px 4px}
  .cmd-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;padding:9px 10px;border-radius:var(--radius-sm);font-size:13.5px;color:var(--ink);cursor:pointer}
  .cmd-item.active,.cmd-item:hover{background:var(--track)}
  .cmd-item .dot{flex:none}
  .cmd-sub{color:var(--muted);font-size:12px;margin-left:auto;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
  .cmd-tag{font-size:10.5px;color:var(--green);background:var(--green-bg);padding:1px 6px;border-radius:99px;margin-left:6px;flex:none}
  .cmd-empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
  #sidebar.collapsed{width:60px}
  #sidebar.collapsed .brand-name,#sidebar.collapsed .nav-label{display:none}
  #sidebar.collapsed .brand{justify-content:center}
  #sidebar.collapsed nav button{justify-content:center;padding:9px}
  #sidebar.collapsed .collapse-btn svg{transform:rotate(180deg)}
  #sidebar.collapsed .side-top{justify-content:center}
  #sidebar.collapsed .side-top .brand,#sidebar.collapsed .side-top #themeToggleBtn{display:none}
  @media(min-width:761px) and (max-width:1080px){
    #sidebar{width:192px}
    main{padding:26px 22px 90px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
    .home-cols{grid-template-columns:1fr}
    .cal .day{min-height:78px;padding:5px;font-size:11px}
    .week-grid .day{min-height:260px;padding:10px}
  }
  .mobile-top-bar{display:none;align-items:center;gap:12px;position:sticky;top:0;z-index:45;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
  .mobile-menu-btn{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--ink);border-radius:8px;transition:background var(--fast) var(--ease)}
  .mobile-menu-btn:hover{background:var(--track)}
  .mobile-menu-btn svg{width:19px;height:19px}
  .mobile-top-bar-title{font-size:14.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mobile-nav-backdrop{display:none;position:fixed;inset:0;background:rgba(20,18,15,.35);z-index:240}
  .mobile-nav-backdrop.show{display:block;animation:backdropIn var(--fast) var(--ease)}

  @media(max-width:760px){
    .mobile-top-bar{display:flex}
    .app-shell{flex-direction:column}
    #sidebar{position:fixed !important;top:0;left:0;width:268px !important;max-width:82vw;height:100vh;z-index:250;flex-direction:column;transform:translateX(-100%);transition:transform var(--dur) var(--ease);box-shadow:var(--shadow-pop)}
    #sidebar.mobile-open{transform:translateX(0)}
    #sidebar .side-top{display:flex}
    #sidebar .sidebar-search-btn{width:100%;padding:7px 8px}
    #sidebar .sidebar-search-btn .nav-label,#sidebar .sidebar-search-btn .cmd-hint{display:inline}
    #sidebar nav{flex-direction:column;gap:1px}
    #sidebar nav button{width:100%}
    #sidebar nav button span{display:inline}
  }

  main{flex:1;min-width:0;max-width:1520px;padding:36px 40px 100px}
  h2{font-size:29px;font-weight:700;margin-bottom:10px;letter-spacing:-.015em;line-height:1.25}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:24px}

  .banner{display:flex;gap:10px;align-items:flex-start;background:var(--amber-bg);border:1px solid #f0d9ae;border-radius:var(--radius);padding:14px 16px;margin-bottom:22px;font-size:14px}
  .banner.over{background:var(--red-bg);border-color:#efc7c3}
  .banner strong{font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-card);transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
  .client-card{cursor:pointer}
  .client-card:hover{border-color:var(--line);box-shadow:0 2px 4px rgba(20,18,15,.04),0 8px 20px rgba(20,18,15,.07);transform:translateY(-1px)}
  .client-card h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card-actions{margin-left:auto;display:flex;gap:6px}
  .card-actions .btn{padding:6px 12px;font-size:12.5px}
  .quick-dates{display:flex;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .cycle{color:var(--muted);font-size:12.5px;margin:3px 0 20px}

  .meter-wrap{margin-top:22px;margin-bottom:8px}
  .meter{position:relative;height:24px;background:var(--track);border-radius:8px}
  .meter .fill{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--accent);transition:width .4s ease;max-width:100%}
  .meter .fill.warn{background:var(--amber)}
  .meter .fill.over{background:var(--red)}
  .meter .tick{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);opacity:.4;left:75%}
  .meter .tick-label{position:absolute;top:-22px;left:75%;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap;font-weight:500}
  .meter-stats{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;margin-top:10px}
  .meter-stats .pct{font-weight:600}
  .meter-compact{position:relative;height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin:8px 0 2px}
  .meter-compact .fill{position:absolute;inset:0 auto 0 0;height:100%;border-radius:99px;background:var(--accent);transition:width .4s ease;max-width:100%}
  .meter-compact .fill.over{background:var(--red)}
  .meter-compact .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35;left:75%}
  .status{margin-top:12px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px}
  .status.ok{background:#e8f2ec;color:var(--green)}
  .status.warn{background:var(--amber-bg);color:var(--amber)}
  .status.over{background:var(--red-bg);color:var(--red)}
  .status .pulse{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .breakdown{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
  .breakdown div{display:flex;justify-content:space-between;padding:2px 0;font-variant-numeric:tabular-nums}

  form.log{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:640px}
  form.log .full{grid-column:1/-1}
  label{display:block;font-size:12.5px;font-weight:500;margin-bottom:6px;color:var(--ink)}
  input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
  textarea{resize:vertical;min-height:70px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .weighted-note{grid-column:1/-1;font-size:13px;color:var(--muted);background:var(--track);border-radius:var(--radius-sm);padding:10px 12px}
  .modal-frame{grid-column:1/-1;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);padding:14px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
  .modal-frame-label{grid-column:1/-1;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-light)}
  .modal-frame .full{grid-column:1/-1}
  .weighted-note b{color:var(--accent);font-weight:600}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:500;transition:background var(--fast) var(--ease),transform var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
  .btn:hover{background:var(--accent-hover)}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
  a.btn{text-decoration:none}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--track);border-color:var(--line)}
  .btn.small{padding:7px 14px;font-size:12.5px}
  .miro-btn:hover{background:#e6ba1f !important;border-color:#e6ba1f !important}
  .miro-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--radius-sm);background:#FFD02F;color:#050038;flex:none;transition:filter var(--fast) var(--ease)}
  .miro-icon-btn:hover{filter:brightness(.94)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
  .btn.danger:hover{background:var(--red-bg);border-color:#efc7c3}
  .btn[disabled]{opacity:.4;cursor:not-allowed}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  .todo-complete-group{margin-bottom:20px}
  .task-grid{display:flex;flex-direction:column;overflow-x:auto;overflow-y:hidden}
  .task-grid-row{display:grid;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line-soft);transition:background var(--fast) var(--ease)}
  .task-grid-row:last-child{border-bottom:none}
  .task-grid-row > div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
  .task-grid-row > div.inline-editable,
  .task-grid-row > div:has(.pill-btn, .stage-date-btn, .inline-editable){overflow:visible}
  .task-grid-header{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-light);font-weight:600;padding:9px 10px;position:sticky;top:0;background:var(--card);z-index:3}
  .col-resize-handle{position:absolute;top:0;right:-6px;width:10px;height:100%;cursor:col-resize;z-index:2}
  .col-resize-handle:hover, .col-resize-handle.resizing{background:linear-gradient(to right, transparent 5px, var(--accent) 5px, var(--accent) 6px, transparent 6px)}
  .tg-title{display:flex;align-items:center;gap:9px;overflow:visible}
  .inline-editable{border-radius:6px;padding:3px 6px;margin:-3px -6px;cursor:pointer;transition:box-shadow var(--fast) var(--ease)}
  .inline-editable:hover{box-shadow:0 0 0 1px var(--ink-light)}
  .tg-title .inline-editable{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .inline-rename-input{font:inherit;color:inherit;padding:2px 6px;border:1px solid var(--accent);border-radius:6px;background:var(--card);flex:1;min-width:60px;box-shadow:0 0 0 3px var(--accent-soft)}
  .tg-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px}
  .row-edit-btn{opacity:0;transition:opacity var(--fast) var(--ease);flex:none}
  .task-row:hover .row-edit-btn{opacity:1}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-light);font-weight:600;padding:10px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
  td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .task-row:hover{background:var(--row-hover)}
  td .chip{display:inline-flex;align-items:center;gap:6px}
  .note-dot{color:var(--amber);margin-left:4px}

  /* calendar */
  .cal-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .cal-head h3{font-size:17px;font-weight:600;min-width:170px;text-align:center}
  .cal-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .filter-pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;opacity:1;transition:opacity var(--fast) var(--ease)}
  .filter-pill.off{opacity:.4}
  .filter-pill .dot{width:8px;height:8px}
  .cal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:center;padding:4px 0}
  .cal .day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);min-height:96px;padding:6px;font-size:12px;cursor:pointer;transition:border-color var(--fast) var(--ease)}
  .cal .day:hover{border-color:var(--accent)}
  .cal .day.blank{background:transparent;border:none;cursor:default}
  .cal .day .num{font-weight:600;color:var(--muted);margin-bottom:4px}
  .cal .day.today{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .cal .day.today .num{color:var(--accent);background:var(--card);border-radius:6px;display:inline-block;padding:0 5px}
  .task-chip{border-radius:6px;padding:4px 7px;color:#fff;margin-bottom:5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .renew-chip{border:1px dashed var(--accent);color:var(--accent);background:var(--card);border-radius:6px;padding:2px 6px;font-size:10.5px;margin-bottom:3px;cursor:pointer;font-weight:500}

  .settings-shell{display:flex;gap:28px;align-items:flex-start}
  .settings-nav{flex:0 0 190px;display:flex;flex-direction:column;gap:2px;position:sticky;top:20px}

  .gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:3;pointer-events:none}
  .gantt-today-label{position:absolute;top:16px;font-size:9.5px;font-weight:700;color:#fff;background:var(--accent);padding:1px 5px;border-radius:4px;white-space:nowrap;transform:translateX(-50%);z-index:4;pointer-events:none}
  .gantt-client-row{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;margin:18px 0 8px;color:var(--ink)}
  .gantt-row{display:grid;grid-template-columns:180px 1fr;align-items:center;min-height:38px;border-bottom:1px solid var(--line);min-width:640px}
  .gantt-label-col{font-size:12.5px;color:var(--muted);padding-right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gantt-track-col{position:relative;height:24px;background:var(--track);border-radius:6px}
  .gantt-bar{position:absolute;top:2px;height:20px;border-radius:5px;color:#fff;font-size:10.5px;font-weight:500;padding:2px 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;line-height:1.6}
  .gantt-kickoff{position:absolute;top:-4px;width:3px;height:32px;border-radius:2px;cursor:pointer}

  .anim-grid th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:relative}
  .anim-grid td{border-bottom:1px solid var(--line)}
  .anim-cell{width:100%;min-height:38px;border:none;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 4px;font-family:inherit;line-height:1.1}
  .anim-cell:hover{filter:brightness(.93)}
  .anim-cell-v{font-size:9px;opacity:.85;font-weight:600}
  .anim-cell-rt{font-size:9px;opacity:.9;font-weight:700}
  .anim-cell-who{font-size:8.5px;opacity:.9;font-weight:700;letter-spacing:.3px}
  .anim-cell-fb{font-size:8.5px;opacity:.9}
  .anim-step-del{position:absolute;top:2px;right:3px;background:none;border:none;color:var(--muted);font-size:13px;line-height:1;opacity:0;cursor:pointer}
  .anim-grid th:hover .anim-step-del{opacity:1}

  .anim-timeline-track{display:flex;height:56px;border-radius:8px;overflow:hidden;background:var(--track)}
  .anim-timeline-shot{flex-basis:0;min-width:2px;border:none;border-right:1px solid rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;padding:0 6px;font-family:inherit;cursor:pointer;transition:filter var(--fast) var(--ease)}
  .anim-timeline-shot:last-child{border-right:none}
  .anim-timeline-shot:hover{filter:brightness(.93)}
  .anim-timeline-shot-code{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .anim-timeline-remainder{background:repeating-linear-gradient(45deg,var(--track),var(--track) 6px,var(--line) 6px,var(--line) 12px);color:var(--muted);font-size:10.5px;cursor:default}
  .pd-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:24px}
  .pd-tab{padding:10px 16px;border:none;border-bottom:2px solid transparent;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
  .pd-stage-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
  .pd-stage-row:hover{background:var(--track)}
  .pd-stage-dot{width:24px;height:24px;border-radius:50%;flex:none;background:var(--track);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .pd-stage-label{flex:1;font-size:13.5px;color:var(--ink)}
  .pd-stage-date{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .pd-cat-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  /* Big, sentence-case section headings (Stages / Stage Materials / Meeting
     Notes / Calendar) — deliberately NOT the small all-caps .pd-cat-label
     style above, which is reserved for minor sub-groupings like Previous/
     Upcoming inside the retainer task list. Always sits outside any card. */
  .pd-section-title{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-bottom:12px}
  .pd-link-card{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;text-decoration:none;transition:border-color .15s}
  .pd-link-card:hover{border-color:var(--accent)}
  .pd-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .pd-cal-navbtn{background:none;border:1px solid var(--line);border-radius:8px;width:26px;height:26px;cursor:pointer;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:inherit}
  .pd-cal-navbtn:hover{background:var(--track)}
  .pd-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .pd-cal-dow{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
  .pd-cal-day{min-height:62px;border-radius:8px;padding:5px;border:1px solid var(--line-soft)}
  .pd-cal-daynum{font-size:11px;font-weight:600;color:var(--ink);margin-bottom:3px}
  .pd-cal-chip{font-size:9.5px;padding:2px 5px;border-radius:5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--track);color:var(--ink)}
  .pd-cal-more{font-size:10px;color:var(--muted)}

  .pd-quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .pd-brief{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pd-brief-item{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--ink)}

  /* Stage Materials, Useful Information, and Active Projects all share one
     grid; every card in it is .pd-project-card (below) now — no separate
     "material card" component any more. Same "white card" (var(--card)) +
     shadow as .card on the All Projects page. Rendered with no outer frame
     around the grid — the cards themselves are the only surface. */
  .pd-materials-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .pd-material-edit{position:absolute;top:8px;right:8px;padding:2px 7px;font-size:10px}

  /* Meeting Notes — rows instead of cards, with a date column (a Loom link is
     usually added after the meeting, so the date is its own field). */
  .pd-meeting-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
  .pd-meeting-row:last-child{border-bottom:none}
  .pd-meeting-icon{width:32px;height:32px;border-radius:9px;background:var(--track);display:flex;align-items:center;justify-content:center;flex:none}
  .pd-meeting-icon svg{width:16px;height:16px}
  .pd-meeting-body{flex:1;min-width:0}
  .pd-meeting-title{font-size:13.5px;font-weight:600;color:var(--ink)}
  .pd-meeting-desc{font-size:11.5px;color:var(--muted)}
  .pd-meeting-date{font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
  .pd-meeting-open{flex:none;padding:6px 12px;font-size:12.5px}
  .pd-meeting-edit{flex:none;padding:6px 10px;font-size:11px}

  /* One card component for everything on this page now — project cards,
     Stage Materials, Useful Information: the whole card is the click target
     (no Open button anywhere), left-aligned, and hover-lifts like
     .client-card on the All Projects page (same shadow/transform values).
     position:relative is for the admin Edit button material cards nest. */
  .pd-project-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:18px;text-align:left;cursor:pointer;transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
  .pd-project-card:hover{box-shadow:0 2px 4px rgba(20,18,15,.04),0 8px 20px rgba(20,18,15,.07);transform:translateY(-1px)}
  .pd-project-card-icon{width:34px;height:34px;border-radius:9px;background:var(--track);display:flex;align-items:center;justify-content:center;flex:none}
  .pd-project-card-icon svg{width:18px;height:18px}
  .pd-project-card-title{font-size:14px;font-weight:600;color:var(--ink)}
  .pd-project-card-desc{font-size:11.5px;color:var(--muted);margin-top:1px}
  /* Stage-count progress, not a percentage — one segment per stage, filled
     left-to-right for however many are done (e.g. 2/5), deliberately coarser
     than a continuous bar. */
  .pd-seg-bar{display:flex;gap:3px;margin-top:14px}
  .pd-seg{flex:1;height:5px;border-radius:3px;background:var(--track)}
  .pd-seg-label{font-size:11.5px;color:var(--muted);margin-top:6px}

  /* Stages column — the middle of three (nav | stages | content). Plain
     buttons, not cards: this column is nav-like (pick a stage), the white
     card treatment stays reserved for the content column's material links.
     No left padding on the column itself (matching .pd-nav-col, which only
     pads on its divider side) — the grid's own column gap already spaces it
     from the nav divider, so adding column-level padding on top of that
     doubled up the inset and made it look uneven next to the nav column.
     Rows never wrap (name is ellipsis-truncated instead) so every row is
     the same height — a wrapped pill was the other source of uneven
     spacing, since the gap between rows is constant but a taller wrapped
     row reads as a bigger gap above/below it. */
  .pd-stages-col{border-right:1px solid var(--line);padding-right:20px;display:flex;flex-direction:column;gap:6px}
  .pd-stage-item{width:100%;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;padding:9px 10px;border:1px solid transparent;border-radius:9px;background:transparent;cursor:pointer;text-align:left;font-family:'Inter',sans-serif}
  .pd-stage-item:hover{background:var(--track)}
  .pd-stage-item.active{background:var(--track)}
  .pd-accordion-num-circle{width:26px;height:26px;border-radius:50%;background:var(--track);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
  .pd-stage-item-name{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pd-stage-status-pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;flex:none;text-transform:uppercase;letter-spacing:.02em}

  /* Combined left-hand nav (projects only — their stages live as tabs in the
     content column now) — Notion-style menu with a vertical rule separating
     it from the content column. border-right (not the grid gap) carries the
     line; it reaches full column height because #pdMainGrid itself is
     flex:1 inside a flex-column page wrapper (see the body template), so its
     single grid row stretches to fill all remaining page height (top of the
     grid to just above the footer) rather than just whichever of nav/content
     is taller — the divider runs edge to edge regardless of content length.
     flex column + the footer link's margin-top:auto pins Reciprocal Space to
     the bottom of that stretched column. */
  .pd-nav-col{border-right:1px solid var(--line);padding-right:20px;display:flex;flex-direction:column}
  .pd-nav-brand{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .pd-nav-avatar{width:22px;height:22px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
  .pd-nav-title{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
  .pd-nav-project{margin-bottom:4px}
  .pd-nav-project:last-child{margin-bottom:0}
  .pd-nav-group{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:none;background:transparent;border-radius:9px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink);text-align:left}
  .pd-nav-group:hover{background:var(--track)}
  .pd-nav-group.active{background:var(--track)}
  .pd-nav-group-icon{flex:none;display:flex;color:var(--muted)}
  .pd-nav-group-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pd-nav-group-pill{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--track);padding:2px 7px;border-radius:99px;flex:none}
  .pd-nav-footer-link{margin-top:auto;padding-top:20px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);text-decoration:none}
  .pd-nav-footer-link:hover{color:var(--ink)}
  .pd-nav-footer-link svg{width:14px;height:14px;flex:none}
  .pd-divider{border-top:1px solid var(--line);margin:26px 0}

  @media(max-width:900px){
    #pdMainGrid{grid-template-columns:1fr !important;flex:0 1 auto !important}
    .pd-nav-col{border-right:none;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:16px;margin-bottom:22px}
    .pd-stages-col{border-right:none;border-bottom:1px solid var(--line);padding:0 0 16px;margin-bottom:22px}
  }
  @media(max-width:760px){ .pd-cal-chip{display:none} }
  .year-row:last-child{border-bottom:none}
</style>
</head>

<script>
/* ============ CONFIG ============ */
const SUPABASE_URL = "https://glbfuurfebepqzvlkjwa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_q6qhoNXd38nRDKhhXxBf7w_DD38UMaj";
/* ================================ */

let db = null;
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
/* Column visibility/order persistence — read once at startup, written back
   any time the user toggles or reorders columns in the Columns popover. */
const DEFAULT_TASK_COL_ORDER = ['status','priority','designer','reviewer','hours','due','retainer'];
function loadStoredSet(key, fallback){
  const raw = store.get(key);
  if(!raw) return new Set(fallback);
  try{ return new Set(JSON.parse(raw)); }catch(e){ return new Set(fallback); }
}
function loadStoredArray(key, fallback){
  const raw = store.get(key);
  if(!raw) return fallback.slice();
  try{ const arr = JSON.parse(raw); return Array.isArray(arr) ? arr : fallback.slice(); }catch(e){ return fallback.slice(); }
}
function saveTaskCols(){ store.set('rs_task_cols', JSON.stringify(Array.from(state.taskCols))); }
function saveTaskColOrder(){ store.set('rs_task_col_order', JSON.stringify(state.taskColOrder)); }
function saveHomeCols(){ store.set('rs_home_cols', JSON.stringify(Array.from(state.homeCols))); }

/* Every URL that reaches an href/src on the client-facing dashboard goes
   through here first. esc() escapes HTML metacharacters but does nothing to a
   `javascript:` scheme, which would execute on click — and ?admin=1 has no
   auth, so anyone with that link could plant one. https only (not http): every
   target is a SaaS tool, and http would trigger mixed-content warnings anyway.
   Returns null for anything unparseable or non-https; callers render inert. */
function safeUrl(u){
  try {
    const parsed = new URL(String(u||'').trim());
    return parsed.protocol === 'https:' ? parsed.href : null;
  } catch { return null; }
}

/* Turns a proofing link into something embeddable, or null if we don't

   URL.hostname (exact / suffix), never a substring of the raw string, so
   "evil.com/?x=figma.com" can't slip through.
   Returns { provider, label, src, aspect, minHeight, sandbox, allow } | null. */
const EMBED_SANDBOX = 'allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox';

   Paste the doc's https:// URL here once it's hosted somewhere; the button
   stays hidden (for admin and client alike) until this resolves through
   safeUrl, so there's no dead link in the meantime. */

function embedInfoFor(rawUrl){

  const seg = u.pathname.split('/').filter(Boolean);

  // carries node-id, page-id, scaling and hide-ui, which are the difference
  // between a usable frame and an unreadable full-canvas view.
  if(host==='figma.com' || host.endsWith('.figma.com')){
    if(['file','design','proto','board','slides'].includes(seg[0])){
      const embed = new URL(`https://embed.figma.com${u.pathname}${u.search}`);
      embed.searchParams.set('embed-host', 'reciprocal-dashboard');
      return { provider:'figma', label:'Figma', src:embed.href, aspect:'16 / 10', sandbox:EMBED_SANDBOX, allow:'fullscreen; clipboard-write' };
    }

  }

  if(host==='loom.com'){

  }

    // don't re-encode it, Miro board ids end in "=" and Miro's own embed URLs
    // keep that literal.
    if(seg[0]==='app' && seg[1]==='board' && seg[2]) return { provider:'miro', label:'Miro', src:`https://miro.com/app/live-embed/${seg[2]}/?embedMode=view_only_without_ui`, aspect:'16 / 10', sandbox:EMBED_SANDBOX, allow:'fullscreen' };

function fmtH(n){ const v=Math.round(n*100)/100; return (v%1===0? v.toFixed(0):v.toFixed(2).replace(/0$/,''))+'h'; }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(d){ return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function fmtDateNatural(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((d-today)/(1000*60*60*24));
  if(diffDays===0) return 'Today';
  if(diffDays===1) return 'Tomorrow';
  if(diffDays===-1) return 'Yesterday';
  if(diffDays>1 && diffDays<7) return d.toLocaleDateString('en-GB',{weekday:'long'});
  if(diffDays<-1 && diffDays>-7) return 'Last '+d.toLocaleDateString('en-GB',{weekday:'long'});
  return fmtDate(d);
}
function fmtDateY(d){ return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }

function clampDay(y,m,day){ const last=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(day,last)); }

function cycleFor(renewalDay, ref){
  ref = ref || new Date(); ref = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  let start = clampDay(ref.getFullYear(), ref.getMonth(), renewalDay);
  if (ref < start) start = clampDay(ref.getFullYear(), ref.getMonth()-1, renewalDay);
  const next = clampDay(start.getFullYear(), start.getMonth()+1, renewalDay);
  const end = new Date(next); end.setDate(end.getDate()-1);
  return { start, end, next };
}
/* ISO-string date range covering just the current retainer cycle */

  const cur = cycleFor(client.renewal_day);

/* ISO-string date range spanning the current retainer cycle plus the one before it */

  const cur = cycleFor(client.renewal_day);
  const prevRef = new Date(cur.start); prevRef.setDate(prevRef.getDate()-1);
  const prev = cycleFor(client.renewal_day, prevRef);
  return { start: iso(prev.start), end: iso(cur.end) };

function isPausedStatus(s){ return s==='Hold' || s==='Pause'; }
function contrastText(hex){
  if(!hex) return '#fff';
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.62 ? '#3a2c00' : '#fff';
}
function mutedBg(hex){
  if(!hex) return 'var(--track)';
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},.14)`;
}

function initials(name){ const p=(name||'').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase() || '?'; }
function avatarHtml(member){ if(!member) return ''; return `<span class="avatar" style="background:${clientColor(member.id)}" title="${esc(member.name)}">${initials(member.name)}</span>`; }
function avatarWithName(member){ return member ? `<span style="display:inline-flex;align-items:center;gap:6px">${avatarHtml(member)}${esc(member.name)}</span>` : '<span style="color:var(--muted)">—</span>'; }
function avatarGroupHtml(ids){
  const ms = (ids||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean);
  if(!ms.length) return '<span style="color:var(--muted)">—</span>';
  return `<span class="avatar-group">${ms.map(m=>avatarHtml(m)).join('')}</span>`;
}

/* Pick the retainer/renewal settings that applied on a given date, from a
   client's effective-dated history (sorted ascending by effective_from). */
function settingsAt(history, dateObj){
  if(!history || !history.length) return null;
  const d = iso(dateObj);
  let applicable = history[0];
  for(const h of history){ if(h.effective_from <= d) applicable = h; else break; }
  return applicable;
}

/* Usage is the sum of two sources: legacy ad-hoc rs_tasks rows (pre-dating per-task time entries)
   plus rs_proj_task_entries for this client's tasks — the latter is the only system still being
   written to, so it must count toward the same total or the allowance meter silently undercounts. */
function clientUsage(client, taskList){
  const cyc = cycleFor(client.renewal_day);
  const s = iso(cyc.start), e = iso(cyc.end);
  const tasks = (taskList||state.tasks).filter(t => t.client_id===client.id && t.task_date>=s && t.task_date<=e);
  const entryRows = (state.projTaskEntries||[]).filter(en=>{
    if(en.work_date<s || en.work_date>e) return false;
    const pt = state.projTasks.find(p=>p.id===en.proj_task_id);
    if(!pt || !pt.counts_toward_retainer) return false;
    const cl = taskClient(pt);
    return !!(cl && cl.id===client.id);
  });
  const perMember = {};
  let used = 0;
  tasks.forEach(t=>{
    const m = state.members.find(m=>m.id===t.member_id);
    const key = m ? m.name : 'Unassigned';
    const val = t.hours*t.weight_applied;
    used += val;
    perMember[key] = (perMember[key]||0) + val;
  });
  entryRows.forEach(en=>{
    const m = state.members.find(m=>m.id===en.member_id);
    const key = m ? m.name : 'Unassigned';
    const val = en.hours*(m?(m.weight||1):1);
    used += val;
    perMember[key] = (perMember[key]||0) + val;
  });
  return { cyc, tasks, entryRows, used, perMember, pct: client.retainer_hours>0 ? used/client.retainer_hours*100 : 0 };
}

let _activePillPopover = null, _pillPopoverOutsideHandler = null;
function closePillPopover(){

  if(_pillPopoverOutsideHandler){ document.removeEventListener('mousedown', _pillPopoverOutsideHandler); _pillPopoverOutsideHandler=null; }
}
function openPillPopover(anchorEl, options, currentValue, onSelect){
  closePillPopover(); closeColDropdown(); closeColorPicker(); closeDatePicker();

/* Small floating calendar popover for picking a single date without a full form */
let _activeDatePicker = null, _dpOutsideHandler = null;
function closeDatePicker(){
  if(_activeDatePicker){ _activeDatePicker.remove(); _activeDatePicker=null; }
  if(_dpOutsideHandler){ document.removeEventListener('mousedown', _dpOutsideHandler); _dpOutsideHandler=null; }
}
function openMiniDatePicker(anchorEl, currentValue, onSelect, opts){
  opts = opts || {};
  closeDatePicker();
  closePillPopover();
  const base = currentValue ? new Date(currentValue+'T00:00') : new Date();
  let viewMonth = new Date(base.getFullYear(), base.getMonth(), 1);
  const pop = document.createElement('div');
  pop.className = 'mini-datepicker';
  document.body.appendChild(pop);
  _activeDatePicker = pop;
  function currentTime(){ const t = pop.querySelector('#mdpTime'); return t ? (t.value||null) : null; }
  function draw(){
    const y=viewMonth.getFullYear(), mo=viewMonth.getMonth();
    const first=new Date(y,mo,1); const startPad=(first.getDay()+6)%7; const daysIn=new Date(y,mo+1,0).getDate();
    let cells='';
    for(let i=0;i<startPad;i++) cells+='<span></span>';
    const todayIso = iso(new Date());
    for(let d=1; d<=daysIn; d++){
      const dIso = iso(new Date(y,mo,d));
      cells += `<button type="button" class="mdp-day ${dIso===currentValue?'sel':''} ${dIso===todayIso?'today':''}" data-d="${dIso}">${d}</button>`;
    }
    const timeRow = opts.withTime ? `<div class="mdp-time">Time <input type="time" id="mdpTime" value="${opts.currentTime||''}"></div>` : '';
    pop.innerHTML = `
      <div class="mdp-head"><button type="button" class="mdp-nav" data-nav="-1">‹</button><span>${viewMonth.toLocaleDateString('en-GB',{month:'short',year:'numeric'})}</span><button type="button" class="mdp-nav" data-nav="1">›</button></div>
      <div class="mdp-dow">${['M','T','W','T','F','S','S'].map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="mdp-grid">${cells}</div>
      ${timeRow}
      <div class="mdp-foot"><button type="button" class="mdp-clear" id="mdpClear">Clear date</button></div>`;
    pop.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ viewMonth=new Date(y, mo+(+b.dataset.nav), 1); draw(); });
    pop.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ onSelect(b.dataset.d, currentTime()); closeDatePicker(); });
    pop.querySelector('#mdpClear').onclick=()=>{ onSelect(null, null); closeDatePicker(); };
  }
  draw();
  const rect = anchorEl.getBoundingClientRect();
  pop.style.position = 'fixed';
  pop.style.top = Math.min(rect.bottom+6, window.innerHeight-320)+'px';
  pop.style.left = Math.min(rect.left, window.innerWidth-250)+'px';
  pop.style.zIndex = 300;
  _dpOutsideHandler = e=>{ if(_activeDatePicker && !_activeDatePicker.contains(e.target) && e.target!==anchorEl) closeDatePicker(); };
  setTimeout(()=> document.addEventListener('mousedown', _dpOutsideHandler), 0);
}

function formatTime12(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ap = h>=12?'PM':'AM';
  const hh = ((h+11)%12)+1;
  return `${hh}:${String(m).padStart(2,'0')} ${ap}`;
}

let _activeColPopover = null, _colOutsideHandler = null;
function closeColDropdown(){
  if(_activeColPopover){ _activeColPopover.remove(); _activeColPopover=null; }
  if(_colOutsideHandler){ document.removeEventListener('mousedown', _colOutsideHandler); _colOutsideHandler=null; }
}
function openColumnDropdown(anchorEl){
  closeColDropdown();
  closePillPopover();
  const pop = document.createElement('div');
  pop.className = 'col-dropdown';
  document.body.appendChild(pop);
  _activeColPopover = pop;
  let dragKey = null;
  function draw(){
    pop.innerHTML = `<div class="col-dropdown-hint">Drag ⠿ to reorder</div>` + taskColumnOrder().map(key=>`
      <div class="col-dropdown-item" draggable="true" data-colorderkey="${key}">
        <span class="col-drag-handle" title="Drag to reorder">⠿</span>
        <label style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;margin:0">
          <input type="checkbox" data-colkey2="${key}" ${state.taskCols.has(key)?'checked':''}>${TASK_COLUMN_DEFS[key].label}
        </label>
      </div>`).join('');
    pop.querySelectorAll('[data-colkey2]').forEach(cb=>cb.addEventListener('change', ()=>{
      const k = cb.dataset.colkey2;
      cb.checked ? state.taskCols.add(k) : state.taskCols.delete(k);
      saveTaskCols();
      render();
    }));
    pop.querySelectorAll('[data-colorderkey]').forEach(row=>{
      row.addEventListener('dragstart', e=>{ dragKey = row.dataset.colorderkey; e.dataTransfer.effectAllowed = 'move'; });
      row.addEventListener('dragover', e=>{ e.preventDefault(); row.classList.add('drop-target-row'); });
      row.addEventListener('dragleave', ()=> row.classList.remove('drop-target-row'));
      row.addEventListener('drop', e=>{
        e.preventDefault(); row.classList.remove('drop-target-row');
        const targetKey = row.dataset.colorderkey;
        if(!dragKey || dragKey===targetKey) return;
        const order = taskColumnOrder();
        const fromIdx = order.indexOf(dragKey), toIdx = order.indexOf(targetKey);
        if(fromIdx<0 || toIdx<0) return;
        order.splice(toIdx, 0, order.splice(fromIdx,1)[0]);
        state.taskColOrder = order;
        saveTaskColOrder();
        draw();
        render();
      });
    });
  }
  draw();
  const rect = anchorEl.getBoundingClientRect();
  pop.style.position = 'fixed';
  pop.style.top = Math.min(rect.bottom+6, window.innerHeight-320)+'px';
  pop.style.left = Math.min(rect.left, window.innerWidth-220)+'px';
  pop.style.zIndex = 300;
  _colOutsideHandler = e=>{ if(_activeColPopover && !_activeColPopover.contains(e.target) && e.target!==anchorEl) closeColDropdown(); };
  setTimeout(()=> document.addEventListener('mousedown', _colOutsideHandler), 0);
}

function openColorPicker(anchorEl, currentValue, onSelect, presets){
  closeColorPicker();
  closePillPopover();
  const pop = document.createElement('div');
  pop.className = 'color-popover';
  document.body.appendChild(pop);
  _activeColorPopover = pop;
  const hasEyeDropper = 'EyeDropper' in window;
  const cur = (currentValue||'').toLowerCase();
  pop.innerHTML = `
    <div class="color-swatch-grid">${(presets||COLOR_PRESETS).map(c=>`<button type="button" class="color-swatch ${c.toLowerCase()===cur?'sel':''}" data-swatch="${c}" style="background:${c}"></button>`).join('')}</div>
    <button type="button" class="color-eyedropper-btn" id="cpEyedrop">${hasEyeDropper?'🎨 Pick with eyedropper':'🎨 Custom colour'}</button>
    ${!hasEyeDropper? `<input type="color" id="cpNative" value="${currentValue||'#2383e2'}" style="width:100%;margin-top:8px;height:34px;padding:2px">` : ''}
  `;
  pop.querySelectorAll('[data-swatch]').forEach(b=>b.onclick=()=>{ onSelect(b.dataset.swatch); closeColorPicker(); });
  if(hasEyeDropper){
    $('#cpEyedrop').onclick = async ()=>{
      try{ const res = await new window.EyeDropper().open(); onSelect(res.sRGBHex); closeColorPicker(); }
      catch(e){ /* cancelled */ }
    };
  } else {
    $('#cpEyedrop').onclick = ()=> $('#cpNative').click();
    $('#cpNative').addEventListener('input', e=> onSelect(e.target.value));
    $('#cpNative').addEventListener('change', ()=> closeColorPicker());
  }
  const rect = anchorEl.getBoundingClientRect();
  pop.style.position = 'fixed';
  pop.style.top = Math.min(rect.bottom+6, window.innerHeight-280)+'px';
  pop.style.left = Math.min(rect.left, window.innerWidth-240)+'px';
  pop.style.zIndex = 300;
  _colorOutsideHandler = e=>{ if(_activeColorPopover && !_activeColorPopover.contains(e.target) && e.target!==anchorEl) closeColorPicker(); };
  setTimeout(()=> document.addEventListener('mousedown', _colorOutsideHandler), 0);
}

function colorCircleHtml(id, color){
  return `<button type="button" class="color-circle" id="${id}_btn" style="background:${color}" title="Choose colour"></button><input type="hidden" id="${id}" value="${color}">`;
}
function wireColorCircle(id, presets){
  $(`#${id}_btn`).onclick = (e)=>{
    e.preventDefault();
    openColorPicker(e.currentTarget, $(`#${id}`).value, (hex)=>{
      $(`#${id}`).value = hex;
      $(`#${id}_btn`).style.background = hex;
    }, presets);
  };
}
function wireColorCircleCustom(id, onSelect, presets){
  $(`#${id}_btn`).onclick = (e)=>{
    e.preventDefault();
    openColorPicker(e.currentTarget, $(`#${id}`).value, onSelect, presets);
  };
}

let _activeMenuPopover = null, _menuOutsideHandler = null;
function closeMenuPopover(){
  if(_activeMenuPopover){ _activeMenuPopover.remove(); _activeMenuPopover=null; }
  if(_menuOutsideHandler){ document.removeEventListener('mousedown', _menuOutsideHandler); _menuOutsideHandler=null; }
}
function openMenuPopover(anchorEl, items){
  closeMenuPopover();
  const pop = document.createElement('div');
  pop.className = 'menu-popover';
  document.body.appendChild(pop);
  _activeMenuPopover = pop;
  pop.innerHTML = items.map((it,i)=>`<button type="button" data-mi="${i}" class="${it.danger?'danger-item':''}">${esc(it.label)}</button>`).join('');
  pop.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{ closeMenuPopover(); items[+b.dataset.mi].onClick(); });
  const rect = anchorEl.getBoundingClientRect();
  pop.style.position = 'fixed';
  pop.style.top = Math.min(rect.bottom+6, window.innerHeight-220)+'px';
  pop.style.left = Math.max(8, Math.min(rect.right-190, window.innerWidth-200))+'px';
  pop.style.zIndex = 300;
  _menuOutsideHandler = e=>{ if(_activeMenuPopover && !_activeMenuPopover.contains(e.target) && e.target!==anchorEl) closeMenuPopover(); };
  setTimeout(()=> document.addEventListener('mousedown', _menuOutsideHandler), 0);
}

async function refreshCurrentView(){
  await loadAll();

    const c = state.clients.find(c=>c.id===state.projClientId);
    if(c) await loadRetainerAllowanceBody(c);

}

    const changed = is_retainer && !turningOn && (retainer_hours !== c.retainer_hours || renewal_day !== c.renewal_day);
    const newSlug = slugify($('#ec_slug').value) || c.slug || uniqueSlug(c.name);
    if(newSlug !== c.slug && state.clients.some(x=>x.id!==c.id && x.slug===newSlug)){ toast('That dashboard link is already taken by another client'); return; }
    const dash_accent_color = color;
    const dash_logo_text = $('#ec_tagline').value.trim() || null;
    const dash_greeting = $('#ec_greeting').value.trim() || null;
    const dash_logo_url = $('#ec_logourl').value.trim() || null;
    const dash_contact_email = $('#ec_contactemail').value.trim() || null;
    const dash_website_url = $('#ec_websiteurl').value.trim() || null;
    const dash_booking_url = $('#ec_bookingurl').value.trim() || null;
    const dash_request_url = $('#ec_requesturl').value.trim() || null;
    const dash_message_url = $('#ec_messageurl').value.trim() || null;
    // These three end up as buttons on a client-facing page, so reject a
    // non-https URL here rather than storing something safeUrl() will drop.
    for(const [val,label] of [[dash_booking_url,'Book a call'],[dash_request_url,'Request form'],[dash_message_url,'Message']]){
      if(val && !safeUrl(val)){ toast(`${label} link must be a full https:// address`); return; }
    }

    const { error: updErr } = await db.from('rs_clients').update({ color, is_retainer, retainer_hours, renewal_day, miro_link_external, miro_link_internal, slug:newSlug, dash_accent_color, dash_logo_text, dash_greeting, dash_logo_url, dash_contact_email, dash_website_url, dash_booking_url, dash_request_url, dash_message_url }).eq('id', c.id);
    if(updErr){ toast(updErr.code==='PGRST204'?'Run migration v27 to enable quick-action links':'Save failed'); console.error(updErr); return; }
    if(turningOn){
      await db.from('rs_client_settings_history').insert({ client_id:c.id, retainer_hours, renewal_day, effective_from:'2000-01-01' });
    } else if(changed){
      const { error: histErr } = await db.from('rs_client_settings_history').insert({ client_id:c.id, retainer_hours, renewal_day, effective_from });
      if(histErr){ toast('Saved, but history log failed — run migration v3?'); console.error(histErr); }
    }
    closeModal();
    toast(!is_retainer ? 'Retainer turned off' : turningOn ? 'Now a retainer client' : changed ? `Updated — new terms apply from ${fmtDate(new Date(effective_from+'T00:00'))}` : 'Saved');
    await refreshCurrentView();
  };
}


/* Client-safe PDF: totals + a plain task list. No notes, no team member
   names, no weighting factors — just what was delivered and hours consumed. */
function generateClientPdf(client, group){
  if(!window.jspdf){ toast('PDF library still loading — try again in a second'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const margin = 48;
  let y = 60;

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(4,14,107);
  doc.text('Reciprocal Space', margin, y); y += 18;
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(123,125,146);
  doc.text('Retainer usage summary', margin, y); y += 34;

  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(22,24,58);
  doc.text(client.name, margin, y); y += 20;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(`${fmtDateY(group.cyc.start)} – ${fmtDateY(group.cyc.end)}`, margin, y); y += 26;

  const used = group.tasks.reduce((a,t)=>a+t.hours*t.weight_applied,0);
  const pct = group.retainer_hours>0 ? used/group.retainer_hours*100 : 0;
  const remaining = Math.max(group.retainer_hours-used,0);
  const statusColor = pct>=100 ? [201,55,44] : pct>=75 ? [224,140,0] : [29,122,77];

  doc.setDrawColor(228,228,222); doc.setFillColor(246,246,243);
  doc.roundedRect(margin, y, pageWidth-margin*2, 64, 6, 6, 'FD');
  doc.setFontSize(9.5); doc.setTextColor(123,125,146);
  doc.text('Hours used', margin+16, y+22);
  doc.text('Retainer', margin+150, y+22);
  doc.text('Remaining', margin+290, y+22);
  doc.text('% used', margin+430, y+22);
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(22,24,58);
  doc.text(fmtH(used), margin+16, y+42);
  doc.text(fmtH(group.retainer_hours), margin+150, y+42);
  doc.text(fmtH(remaining), margin+290, y+42);
  doc.setTextColor(...statusColor);
  doc.text(Math.round(pct)+'%', margin+430, y+42);
  y += 92;

  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(22,24,58);
  doc.text('Work completed this period', margin, y); y += 16;
  doc.setDrawColor(228,228,222); doc.line(margin, y, pageWidth-margin, y); y += 16;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  const sorted = group.tasks.slice().sort((a,b)=>a.task_date.localeCompare(b.task_date));
  if(!sorted.length){
    doc.setTextColor(123,125,146);
    doc.text('No work logged for this period yet.', margin, y); y += 16;
  }
  sorted.forEach(t=>{
    if(y > 760){ doc.addPage(); y = 60; }
    doc.setTextColor(22,24,58);
    doc.text(fmtDate(new Date(t.task_date+'T00:00')), margin, y);
    const lines = doc.splitTextToSize(t.description || 'Work item', 330);
    doc.text(lines, margin+70, y);
    doc.text(fmtH(t.hours*t.weight_applied), pageWidth-margin-40, y);
    y += 14*lines.length + 4;
  });

  doc.setFontSize(8); doc.setTextColor(123,125,146);
  doc.text(`Generated ${fmtDateY(new Date())} · Reciprocal Space`, margin, doc.internal.pageSize.getHeight()-30);

  const safeName = client.name.replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'');
  doc.save(`${safeName}-${iso(group.cyc.start)}.pdf`);
}

/* ---------- data export / backup ---------- */
function csvEscape(v){ const s = String(v ?? ''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

async function exportAllData(){
  toast('Preparing backup…');
  const [c,m,t,h] = await Promise.all([
    db.from('rs_clients').select('*').order('name'),
    db.from('rs_members').select('*').order('name'),
    db.from('rs_tasks').select('*').order('task_date',{ascending:false}),
    db.from('rs_client_settings_history').select('*').order('effective_from',{ascending:true})
  ]);
  if(c.error||m.error||t.error){ toast('Backup failed'); console.error(c.error||m.error||t.error); return; }
  const payload = { exported_at: new Date().toISOString(), clients:c.data, members:m.data, tasks:t.data, settings_history: h.data||[] };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `rs-retainer-backup-${iso(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}

async function exportTasksCsv(){
  toast('Preparing CSV…');
  const { data, error } = await db.from('rs_tasks').select('*').order('task_date',{ascending:false});
  if(error){ toast('Export failed'); console.error(error); return; }
  const header = ['Date','Client','Team member','Task','Notes','Hours','Weight','Weighted hours'];
  const rows = data.map(t=>{
    const c = state.clients.find(c=>c.id===t.client_id);
    const m = state.members.find(m=>m.id===t.member_id);
    return [t.task_date, c?c.name:'', m?m.name:'', t.description||'', t.notes||'', t.hours, t.weight_applied, (t.hours*t.weight_applied).toFixed(2)];
  });
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);

function wireHoursSteppers(root){
  root.querySelectorAll('[data-hourstep]').forEach(el=>el.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const [taskId, delta] = el.dataset.hourstep.split(':');
    const task = state.projTasks.find(t=>t.id===taskId);
    const me = currentUser();
    if(!task || !me) return;
    const existing = (state.projTaskEntries||[]).find(en=>en.proj_task_id===taskId && en.member_id===me.id);
    const next = Math.max(0, Math.round(((existing?existing.hours:0) + parseFloat(delta)) * 100) / 100);
    if(existing){
      const { error } = await db.from('rs_proj_task_entries').update({ hours: next }).eq('id', existing.id);
      if(error){ toast('Could not update hours'); return; }
    } else if(next>0){
      const work_date = task.work_date || iso(new Date());
      const { error } = await db.from('rs_proj_task_entries').insert({ proj_task_id:taskId, member_id:me.id, hours:next, work_date }).select().single();
      if(error){ toast('Could not update hours'); return; }
    }
    await refreshProjectView();
  }));
  root.querySelectorAll('[data-workdateinline]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const taskId = el.dataset.workdateinline;
    const task = state.projTasks.find(t=>t.id===taskId);
    if(!task) return;
    openMiniDatePicker(el, task.work_date, async (newDate)=>{
      const { error } = await db.from('rs_proj_tasks').update({ work_date:newDate }).eq('id', taskId);
      if(error){ toast('Could not save date'); return; }
      await refreshProjectView();
    });
  }));
}

function renderHome(){
  const me = currentUser();
  let html = me
    ? `<h2 style="font-size:34px;margin-bottom:22px">${timeOfDayGreeting()}, ${esc((me.name||'').trim().split(/\s+/)[0]||me.name)}</h2>`
    : `<h2>Home</h2><div class="sub">Add a team member named "${CURRENT_USER_NAME}" in Settings to personalize this page.</div>`;
  if(!me){ main.innerHTML = html; return; }

  const toReview = state.projTasks.filter(t=> (t.assigned_reviewer_ids||[]).includes(me.id) && !isCompleteStatus(t.status))
    .sort((a,b)=> (a.due_date||'9999-99-99').localeCompare(b.due_date||'9999-99-99'));
  const toDo = state.projTasks.filter(t=> (t.assigned_designer_ids||[]).includes(me.id) && !isCompleteStatus(t.status))
    .sort((a,b)=> (a.due_date||'9999-99-99').localeCompare(b.due_date||'9999-99-99'));
  const hoursToFill = state.projTasks.filter(t=>{
    if(!(t.assigned_designer_ids||[]).includes(me.id)) return false;
    if(isPausedStatus(t.status)) return false;
    if(!t.counts_toward_retainer) return false;
    const client = taskClient(t);
    if(!client || !client.is_retainer) return false;
    const range = state.homeHoursExpanded ? lastTwoCyclesRange(client) : currentCycleRange(client);
    // small grace window past the cycle end so a task due just a couple of days
    // after the boundary (e.g. created today, due in 2 days) doesn't vanish —
    // without this, only due_date (falling back to created_at when unset) is used,
    // so old backlog tasks stay correctly excluded regardless of import date
    const graceEnd = iso(new Date(new Date(range.end+'T00:00').getTime() + 7*86400000));
    const taskDate = t.due_date || iso(new Date(t.created_at));
    return taskDate>=range.start && taskDate<=graceEnd;
  }).sort((a,b)=> (a.due_date||'9999-99-99').localeCompare(b.due_date||'9999-99-99'));

  html += `<div style="margin-bottom:20px"><button class="btn small ghost" id="homeColDropdownBtn">Columns ▾</button></div>
  <div class="home-cols">
    <div class="home-col">
      <h3>To do <span class="home-count">${toDo.length}</span></h3>
      <div class="card" style="padding:8px 12px">${homeTaskTableHtml(toDo, 'Nothing to do')}</div>
    </div>
    <div class="home-col">
      <h3>To review <span class="home-count">${toReview.length}</span></h3>
      <div class="card" style="padding:8px 12px">${homeTaskTableHtml(toReview, 'Nothing to review')}</div>
    </div>
    <div class="home-col">
      <h3>Retainer hours to fill <span class="home-count">${hoursToFill.length}</span><button class="btn small ghost" id="hoursCycleToggleBtn" style="margin-left:auto">${state.homeHoursExpanded?'Show current cycle only':'Show last 2 months'}</button></h3>
      <div class="card" style="padding:8px 12px">${hoursToFillTableHtml(hoursToFill)}</div>
    </div>
  </div>`;
  main.innerHTML = html;
  wireTaskRows(main);
  wireHoursSteppers(main);
  $('#hoursCycleToggleBtn').onclick = ()=>{ state.homeHoursExpanded = !state.homeHoursExpanded; renderHome(); };
  $('#homeColDropdownBtn').onclick = (e)=>{
    e.stopPropagation();
    openCheckboxDropdown(e.currentTarget, [
      {key:'priority', label:'Priority'},
      {key:'due', label:'Due date'}
    ], key=>state.homeCols.has(key), (key,checked)=>{
      checked ? state.homeCols.add(key) : state.homeCols.delete(key);
      saveHomeCols();
      renderHome();
    });
  };
}

function daysUntilLabel(date){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(date); d.setHours(0,0,0,0);
  const days = Math.round((d - today) / 86400000);
  if(days<0) return 'overdue';
  if(days===0) return 'today';
  if(days===1) return 'tomorrow';
  return `in ${days} days`;
}
function renewsInDays(date){
  const label = daysUntilLabel(date);
  return `Renews ${label==='overdue'?'today':label}`;
}

/* ================= Command palette / global search (Cmd/Ctrl+K) ================= */
let _cmdPaletteActions = [], _cmdPaletteActiveIndex = -1, _cmdPaletteKeyHandler = null;
function closeCommandPalette(){
  const el = document.getElementById('cmdPalette');
  if(el) el.remove();
  if(_cmdPaletteKeyHandler){ document.removeEventListener('keydown', _cmdPaletteKeyHandler, true); _cmdPaletteKeyHandler = null; }
}
function cmdPaletteHighlight(){
  const items = document.querySelectorAll('#cmdResults .cmd-item');
  items.forEach((el,i)=> el.classList.toggle('active', i===_cmdPaletteActiveIndex));
  const activeEl = items[_cmdPaletteActiveIndex];
  if(activeEl) activeEl.scrollIntoView({ block:'nearest' });
}
function openCommandPalette(){
  closeCommandPalette();
  const wrap = document.createElement('div');
  wrap.id = 'cmdPalette';
  wrap.className = 'cmd-backdrop';
  wrap.innerHTML = `<div class="cmd-box">
    <div class="cmd-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <input type="text" id="cmdInput" placeholder="Search clients, projects, tasks…" autocomplete="off">
      <span class="cmd-hint">Esc</span>
    </div>
    <div id="cmdResults" class="cmd-results"></div>
  </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('mousedown', e=>{ if(e.target===wrap) closeCommandPalette(); });
  const input = wrap.querySelector('#cmdInput');
  const resultsEl = wrap.querySelector('#cmdResults');

  const renderResults = ()=>{
    const q = input.value.trim().toLowerCase();
    _cmdPaletteActions = [];
    if(!q){
      resultsEl.innerHTML = `<div class="cmd-empty">Type to search across clients, projects, and tasks…</div>`;
      _cmdPaletteActiveIndex = -1;
      return;
    }
    const clients = state.clients.filter(c=>c.active && c.name.toLowerCase().includes(q)).slice(0,6);
    const projects = state.projects.filter(p=>p.active!==false && p.name.toLowerCase().includes(q)).slice(0,6);
    const tasks = state.projTasks.filter(t=>(t.title||'').toLowerCase().includes(q)).slice(0,6);
    if(!clients.length && !projects.length && !tasks.length){
      resultsEl.innerHTML = `<div class="cmd-empty">No matches for "${esc(input.value.trim())}"</div>`;
      _cmdPaletteActiveIndex = -1;
      return;
    }
    let html = '';
    if(clients.length){
      html += `<div class="cmd-group-label">Clients</div>`;
      clients.forEach(c=>{
        const idx = _cmdPaletteActions.length;
        _cmdPaletteActions.push(()=>{ closeCommandPalette(); state.view='projects'; state.projView = c.is_retainer?'retainerTasks':'clientProjects'; state.projClientId=c.id; state.projProjectId=null; state.retainerTab='tasks'; render(); });
        html += `<button type="button" class="cmd-item" data-cmdidx="${idx}"><span class="dot" style="background:${colorFor(c)};width:8px;height:8px"></span>${esc(c.name)}${c.is_retainer?'<span class="cmd-tag">Retainer</span>':''}</button>`;
      });
    }
    if(projects.length){
      html += `<div class="cmd-group-label">Projects</div>`;
      projects.forEach(p=>{
        const cl = state.clients.find(x=>x.id===p.client_id);
        const idx = _cmdPaletteActions.length;
        _cmdPaletteActions.push(()=>{ closeCommandPalette(); state.view='projects'; state.projView='project'; state.projClientId=p.client_id; state.projProjectId=p.id; render(); });
        html += `<button type="button" class="cmd-item" data-cmdidx="${idx}">${esc(p.name)}${cl?`<span class="cmd-sub">${esc(cl.name)}</span>`:''}</button>`;
      });
    }
    if(tasks.length){
      html += `<div class="cmd-group-label">Tasks</div>`;
      tasks.forEach(t=>{
        const cl = taskClient(t);
        const idx = _cmdPaletteActions.length;
        _cmdPaletteActions.push(()=>{ closeCommandPalette(); jumpToProjTask(t.id); });
        html += `<button type="button" class="cmd-item" data-cmdidx="${idx}"><span class="status-dot" style="background:${statusColor(t.status)}"></span>${esc(t.title)}${cl?`<span class="cmd-sub">${esc(cl.name)}</span>`:''}</button>`;
      });
    }
    resultsEl.innerHTML = html;
    _cmdPaletteActiveIndex = _cmdPaletteActions.length ? 0 : -1;
    cmdPaletteHighlight();
    resultsEl.querySelectorAll('[data-cmdidx]').forEach(b=>b.addEventListener('click', ()=> _cmdPaletteActions[+b.dataset.cmdidx]()));
  };

  _cmdPaletteKeyHandler = (e)=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); if(_cmdPaletteActions.length){ _cmdPaletteActiveIndex = Math.min(_cmdPaletteActiveIndex+1, _cmdPaletteActions.length-1); cmdPaletteHighlight(); } }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(_cmdPaletteActions.length){ _cmdPaletteActiveIndex = Math.max(_cmdPaletteActiveIndex-1, 0); cmdPaletteHighlight(); } }
    else if(e.key==='Enter'){ e.preventDefault(); if(_cmdPaletteActions[_cmdPaletteActiveIndex]) _cmdPaletteActions[_cmdPaletteActiveIndex](); }
    else if(e.key==='Escape'){ e.preventDefault(); closeCommandPalette(); }
  };
  document.addEventListener('keydown', _cmdPaletteKeyHandler, true);
  input.addEventListener('input', renderResults);
  input.focus();
  renderResults();
}

async function loadRetainerAllowanceBody(c){
  const [{ data: tasks, error: tErr }, { data: hist, error: hErr }] = await Promise.all([
    db.from('rs_tasks').select('*').eq('client_id', c.id).order('task_date',{ascending:false}),
    db.from('rs_client_settings_history').select('*').eq('client_id', c.id).order('effective_from',{ascending:true})
  ]);
  if(tErr){ toast('Could not load history'); console.error(tErr); return; }
  const history = (hist||[]).length ? hist : [{retainer_hours:c.retainer_hours, renewal_day:c.renewal_day, effective_from:'2000-01-01'}];
  state._clientTaskCache = tasks;

  // ledger entries drive the accurate hour totals per cycle
  const groups = {};
  tasks.forEach(t=>{
    const s = settingsAt(history, new Date(t.task_date+'T00:00'));
    const cyc = cycleFor(s.renewal_day, new Date(t.task_date+'T00:00'));
    const key = iso(cyc.start);
    if(!groups[key]) groups[key] = { cyc, retainer_hours:s.retainer_hours, tasks:[] };
    groups[key].tasks.push(t);
  });

  // per-person time entries are the only system still being logged to, so their hours
  // must feed the same per-cycle totals as the legacy rs_tasks rows above
  const clientTaskIds = new Set(state.projTasks.filter(pt=>{ if(!pt.counts_toward_retainer) return false; const cl=taskClient(pt); return cl && cl.id===c.id; }).map(pt=>pt.id));
  (state.projTaskEntries||[]).forEach(en=>{
    if(!clientTaskIds.has(en.proj_task_id)) return;
    const s = settingsAt(history, new Date(en.work_date+'T00:00'));
    const cyc = cycleFor(s.renewal_day, new Date(en.work_date+'T00:00'));
    const key = iso(cyc.start);
    if(!groups[key]) groups[key] = { cyc, retainer_hours:s.retainer_hours, tasks:[] };
    const m = state.members.find(mm=>mm.id===en.member_id);
    groups[key].entryHours = (groups[key].entryHours||0) + en.hours*(m?(m.weight||1):1);
  });

  // to-do list tasks (tracked or not) surfaced in the same cycles, by work date / due date
  const projTasks = state.projTasks.filter(t=>t.client_id===c.id && !t.project_id && !isPausedStatus(t.status) && t.counts_toward_retainer);
  const projGroups = {};
  const undated = [];
  projTasks.forEach(pt=>{
    const dateStr = pt.work_date || pt.due_date;
    if(!dateStr){ undated.push(pt); return; }
    const s = settingsAt(history, new Date(dateStr+'T00:00'));
    const cyc = cycleFor(s.renewal_day, new Date(dateStr+'T00:00'));
    const key = iso(cyc.start);
    if(!groups[key]) groups[key] = { cyc, retainer_hours:s.retainer_hours, tasks:[] };
    (projGroups[key] = projGroups[key] || []).push(pt);
  });

  const currentKey = iso(cycleFor(c.renewal_day).start);
  const keys = Object.keys(groups).sort((a,b)=> b.localeCompare(a));

  let historyHtml = '';
  if(!hErr && history.length>1){
    const rows = history.slice().reverse().map((h,i,arr)=>{
      const prev = arr[i+1];
      const change = prev ? `— changed from ${fmtH(prev.retainer_hours)} / renews ${ordinal(prev.renewal_day)}` : '— initial setting';
      return `<div>Since <b>${fmtDateY(new Date(h.effective_from+'T00:00'))}</b>: ${fmtH(h.retainer_hours)} retainer, renews on the ${ordinal(h.renewal_day)} <span style="color:var(--muted)">${change}</span></div>`;
    }).join('');
    historyHtml = `<div class="history-list"><b style="display:block;margin-bottom:4px;color:var(--ink)">Retainer history</b>${rows}</div>`;
  }

  let html = `<div class="sub">${fmtH(c.retainer_hours)} retainer · renews on the ${ordinal(c.renewal_day)} · tasks below are organised by billing month</div>
    ${historyHtml}`;

  if(undated.length){
    html += `<div class="banner"><div>🕓</div><div><strong>${undated.length} task${undated.length===1?'':'s'}</strong> ${undated.length===1?'has':'have'} no due date or work date yet, so ${undated.length===1?'it':'they'} can't be placed in a billing month.
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start">
        ${undated.map(t=>`<button class="btn small ghost" data-taskeditbtn="${t.id}">${esc(t.title)}</button>`).join('')}
      </div>
    </div></div>`;
  }

  if(!keys.length){
    html += `<div class="empty">No tasks logged for this client yet.</div>`;
  } else {
    keys.forEach(key=>{
      const g = groups[key];
      const used = g.tasks.reduce((a,t)=>a+t.hours*t.weight_applied,0) + (g.entryHours||0);
      const pct = g.retainer_hours>0 ? used/g.retainer_hours*100 : 0;
      const isCurrent = key===currentKey;
      const badgeCls = pct>=100?'over':pct>=75?'warn':'ok';
      const badgeText = pct>=100 ? `${Math.round(pct)}% · over` : pct>=75 ? `${Math.round(pct)}% · reaching limit` : `${Math.round(pct)}%`;
      const items = (projGroups[key]||[]).sort((a,b)=> (a.work_date||a.due_date||'').localeCompare(b.work_date||b.due_date||''));
      html += `<div class="cycle-block">
        <div class="cb-head">
          <h4>${fmtDateY(g.cyc.start)} – ${fmtDateY(g.cyc.end)} ${isCurrent?'<span class="badge">(current cycle)</span>':''}</h4>
          <span style="display:flex;align-items:center;gap:10px">
            <span class="status ${badgeCls}">${fmtH(used)} of ${fmtH(g.retainer_hours)} · ${badgeText}</span>
            <button class="btn small ghost" data-pdf="${key}">PDF</button>
          </span>
        </div>
        <div class="card" style="padding:8px 12px">
          ${items.length? `<table><thead><tr><th>Task</th><th>Date</th><th>Assigned</th><th>Hours (entries)</th><th style="text-align:center">Tracked</th><th></th></tr></thead>
          <tbody>${items.map(pt=>{
            const tracked = taskEntriesFor(pt.id).length>0;
            const dateStr = pt.work_date || pt.due_date;
            const entries = taskEntriesFor(pt.id);
            const entriesTotal = taskHoursTotal(pt.id);
            const hoursDisplay = entries.length
              ? `<div style="font-weight:600">${fmtH(entriesTotal)} <span style="color:var(--muted);font-weight:400;font-size:11.5px">(${entries.length} entr${entries.length===1?'y':'ies'})</span></div>
                 <div style="font-size:11px;color:var(--muted)">${entries.map(e=>{ const m=state.members.find(mm=>mm.id===e.member_id); return `${esc(m?initials(m.name):'?')} ${fmtH(e.hours)}`; }).join(', ')}</div>`
              : (pt.recorded_hours!=null? fmtH(pt.recorded_hours) : '—');
            return `<tr class="task-row" data-projtask="${pt.id}">
              <td><span class="status-dot" style="background:${statusColor(pt.status)}"></span><span class="inline-editable" data-taskname="${pt.id}" title="Click to rename">${esc(pt.title)}</span></td>
              <td><button type="button" class="stage-date-btn" data-taskdue="${pt.id}" style="margin-top:0">${dateStr? fmtDate(new Date(dateStr+'T00:00')) : 'Set date'}</button></td>
              <td>${avatarGroupHtml(pt.assigned_designer_ids)}</td>
              <td>${hoursDisplay}</td>
              <td style="text-align:center">${tracked? '<span class="retainer-tick" title="Counted toward this cycle">✓ Tracked</span>' : '<span style="color:var(--amber);font-weight:600" title="Not counting toward retainer hours yet">⚠ Not tracked</span>'}</td>
              <td style="text-align:right"><button type="button" class="btn small ghost row-edit-btn" data-taskeditbtn="${pt.id}">Edit</button></td>
            </tr>`;
          }).join('')}</tbody></table>` : `<div class="empty">No to-do list tasks fall in this period — hours below came from manually logged time.</div>`}
        </div>
      </div>`;
    });
  }
  const bodyEl = document.getElementById('retainerTabBody');
  if(!bodyEl) return;
  bodyEl.innerHTML = html;
  wireTaskRows(bodyEl);
  bodyEl.querySelectorAll('[data-pdf]').forEach(el=>el.addEventListener('click', ()=> generateClientPdf(c, groups[el.dataset.pdf])));
}

function startOfWeek(d){ const dt=new Date(d); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt; }

/* Builds month-grid day cells, weekdays only (Saturday/Sunday hidden) */
function monthWeekdayCells(y, mo, todayIso, cellHtmlFn){
  const daysIn = new Date(y, mo+1, 0).getDate();
  let startCol = 0;
  for(let d=1; d<=daysIn; d++){ const dow=new Date(y,mo,d).getDay(); if(dow!==0 && dow!==6){ startCol=(dow+6)%7; break; } }
  let cells = '';
  for(let i=0;i<startCol;i++) cells += `<div class="day blank"></div>`;
  for(let d=1; d<=daysIn; d++){
    const dow = new Date(y,mo,d).getDay();
    if(dow===0 || dow===6) continue;
    const dIso = iso(new Date(y,mo,d));
    cells += cellHtmlFn(d, dIso, dIso===todayIso);
  }
  return cells;
}
