function attachMilestoneInteractions(){
  main.querySelectorAll('[data-mview]').forEach(el=>el.addEventListener('click', ()=>{ state.milestoneViewMode = el.dataset.mview; renderMilestones(); }));
  if($('#mShowBtn')) $('#mShowBtn').onclick = (e)=>{
    e.stopPropagation();
    openCheckboxDropdown(e.currentTarget, [
      {key:'projects', label:'Projects'},
      {key:'retainer', label:'Retainer'}
    ], key=> key==='projects' ? state.milestoneShowProjects : state.milestoneShowRetainer,
    (key,checked)=>{
      if(key==='projects') state.milestoneShowProjects = checked; else state.milestoneShowRetainer = checked;
      renderMilestones();
    });
  };
  if($('#mTypeBtn')) $('#mTypeBtn').onclick = (e)=>{
    e.stopPropagation();
    const types = state.projectTypes.filter(t=>t.active);
    openCheckboxDropdown(e.currentTarget, types.map(t=>({key:t.name, label:`${t.icon} ${t.name}`})),
      key=>!state.milestoneTypeHidden.has(key),
      (key,checked)=>{ checked ? state.milestoneTypeHidden.delete(key) : state.milestoneTypeHidden.add(key); renderMilestones(); });
  };
  if($('#mClientsBtn')) $('#mClientsBtn').onclick = (e)=>{
    e.stopPropagation();
    const clients = state.clients.filter(c=>c.active && (
      state.projects.some(p=>p.client_id===c.id) ||
      state.projTasks.some(t=>t.client_id===c.id && !t.project_id && t.due_date)
    ));
    openCheckboxDropdown(e.currentTarget, clients.map(c=>({key:c.id, label:c.name, dot:colorFor(c)})),
      key=>!state.milestoneHidden.has(key),
      (key,checked)=>{ checked ? state.milestoneHidden.delete(key) : state.milestoneHidden.add(key); renderMilestones(); });
  };
  main.querySelectorAll('[data-msitem]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [type,id] = el.dataset.msitem.split(':');
      if(type==='stage') openStagePreviewModal(id);
      else jumpToProjTask(id);
    });
    el.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', el.dataset.msitem); e.dataTransfer.effectAllowed='move'; });
  });
  main.querySelectorAll('.day[data-date]').forEach(dayEl=>{
    dayEl.addEventListener('dragover', e=>{ e.preventDefault(); dayEl.classList.add('drop-target'); });
    dayEl.addEventListener('dragleave', ()=> dayEl.classList.remove('drop-target'));
    dayEl.addEventListener('drop', async e=>{
      e.preventDefault(); dayEl.classList.remove('drop-target');
      const raw = e.dataTransfer.getData('text/plain');
      const [type,id] = (raw||'').split(':');
      const newDate = dayEl.dataset.date;
      if(!type || !id || !newDate) return;
      const { error } = type==='stage'
        ? await db.from('rs_project_stages').update({ due_date:newDate }).eq('id', id)
        : await db.from('rs_proj_tasks').update({ due_date:newDate }).eq('id', id);
      if(error){ toast('Could not move'); return; }
      toast(`Moved to ${fmtDate(new Date(newDate+'T00:00'))}`);
      await refreshProjectView();
    });
  });
}

function collectMilestoneItems(){
  const byDay = {};
  if(state.milestoneShowProjects){
    state.stages.filter(s=>s.due_date).forEach(s=>{
      const proj = state.projects.find(p=>p.id===s.project_id);
      if(!proj || state.milestoneHidden.has(proj.client_id)) return;
      if(state.milestoneTypeHidden.has(proj.project_type)) return;
      (byDay[s.due_date]=byDay[s.due_date]||[]).push({ type:'stage', s, proj, time:s.due_time||'99:99' });
    });
  }
  if(state.milestoneShowRetainer){
    state.projTasks.filter(t=>t.due_date && t.client_id && !t.project_id).forEach(t=>{
      if(state.milestoneHidden.has(t.client_id)) return;
      (byDay[t.due_date]=byDay[t.due_date]||[]).push({ type:'task', t, time:'99:99' });
    });
  }
  return byDay;
}
function milestoneItemChip(item, weekStyle){
  if(item.type==='stage'){
    const cl = state.clients.find(c=>c.id===item.proj.client_id);
    return milestoneChipHtml(item.s, item.proj, cl, weekStyle);
  }
  const cl = state.clients.find(c=>c.id===item.t.client_id);
  return retainerMilestoneChipHtml(item.t, cl, weekStyle);
}

function renderGanttBody(){
  const projects = state.projects.filter(p=>p.active && !state.milestoneHidden.has(p.client_id) && !state.milestoneTypeHidden.has(p.project_type));
  const rows = [];
  let minDate = null, maxDate = null;
  projects.forEach(p=>{
    const client = state.clients.find(c=>c.id===p.client_id);
    if(!client) return;
    const stages = state.stages.filter(s=>s.project_id===p.id).sort((a,b)=>a.position-b.position);
    const dated = stages.filter(s=>s.due_date);
    if(!dated.length) return;
    dated.forEach(s=>{
      const d = new Date(s.due_date+'T00:00');
      if(!minDate || d<minDate) minDate = d;
      if(!maxDate || d>maxDate) maxDate = d;
    });
    rows.push({ p, client, stages });
  });
  if(!rows.length) return `<div class="empty">No projects with stage due dates yet — set due dates on stages to see them here.</div>`;

  minDate = new Date(minDate); minDate.setDate(minDate.getDate()-3);
  maxDate = new Date(maxDate); maxDate.setDate(maxDate.getDate()+3);
  const totalMs = maxDate - minDate;
  const pct = d => Math.max(0, Math.min(100, (d-minDate)/totalMs*100));

  const monthMarkers = [];
  let cursor = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
  while(cursor<=maxDate){
    monthMarkers.push({ label:cursor.toLocaleDateString('en-GB',{month:'short',year:'numeric'}), left:pct(cursor) });
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }

  const byClient = {};
  rows.forEach(r=>{ (byClient[r.client.id] = byClient[r.client.id] || { client:r.client, items:[] }).items.push(r); });

  let html = `<div class="gantt-wrap">
    <div class="gantt-header">
      <div class="gantt-label-col"></div>
      <div class="gantt-track-col" style="background:none">${monthMarkers.map(m=>`<div class="gantt-month-marker" style="left:${m.left}%">${esc(m.label)}</div>`).join('')}</div>
    </div>`;

  Object.values(byClient).forEach(group=>{
    const barColor = colorFor(group.client);
    html += `<div class="gantt-client-row"><span class="dot" style="background:${barColor}"></span>${esc(group.client.name)}</div>`;
    group.items.forEach(({p,stages})=>{
      let segs = '';
      let prevDate = null;
      stages.forEach(s=>{
        if(!s.due_date) return;
        const d = new Date(s.due_date+'T00:00');
        if(prevDate){
          const left = pct(prevDate);
          const width = Math.max(pct(d)-left, 0.6);
          segs += `<div class="gantt-bar" draggable="true" data-msitem="stage:${s.id}" style="left:${left}%;width:${width}%;background:${barColor}" title="${esc(s.name)} — due ${fmtDate(d)}">${esc(s.name)}</div>`;
        } else {
          segs += `<div class="gantt-kickoff" data-msitem="stage:${s.id}" style="left:${pct(d)}%;background:${barColor}" title="Kickoff — ${fmtDate(d)}"></div>`;
        }
        prevDate = d;
      });
      html += `<div class="gantt-row"><div class="gantt-label-col">${esc(p.name)}</div><div class="gantt-track-col">${segs}</div></div>`;
    });
  });

  html += `</div>`;
  return html;
}

function renderMilestones(){
  if(!state.milestoneAnchor) state.milestoneAnchor = new Date();
  const anchor = state.milestoneAnchor;
  const todayIso = iso(new Date());
  const byDay = collectMilestoneItems();

  const controlsRow = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px">
    <div class="view-toggle" style="margin-bottom:0">
      <button class="btn small ${state.milestoneViewMode==='week'?'':'ghost'}" data-mview="week">Week</button>
      <button class="btn small ${state.milestoneViewMode==='month'?'':'ghost'}" data-mview="month">Month</button>
      <button class="btn small ${state.milestoneViewMode==='year'?'':'ghost'}" data-mview="year">Year</button>
      <button class="btn small ${state.milestoneViewMode==='gantt'?'':'ghost'}" data-mview="gantt">Gantt</button>
    </div>
    <div class="cal-filters" style="margin-bottom:0">
      <button class="btn small ghost" id="mShowBtn">Show ▾</button>
      <button class="btn small ghost" id="mTypeBtn">Project type ▾</button>
      <button class="btn small ghost" id="mClientsBtn">Clients ▾</button>
    </div>
  </div>`;

  let body = '';
  if(state.milestoneViewMode==='week'){
    const start = startOfWeek(anchor);
    const days = Array.from({length:5},(_,i)=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d; });
    const end = days[4];
    let cells = days.map(d=>{
      const dIso = iso(d);
      const list = (byDay[dIso]||[]).slice().sort((a,b)=> a.time.localeCompare(b.time));
      const chips = list.map(item=>milestoneItemChip(item, true)).join('');
      return `<div class="day ${dIso===todayIso?'today':''}" data-date="${dIso}"><div class="num">${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'})}</div>${chips}</div>`;
    }).join('');
    body = `<div class="cal-head"><button class="btn ghost small" id="mPrev">←</button><h3>${fmtDateY(start)} – ${fmtDateY(end)}</h3><button class="btn ghost small" id="mNext">→</button><button class="btn ghost small" id="mToday">Today</button></div>
      <div class="week-grid" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px">${cells}</div>`;
  } else if(state.milestoneViewMode==='year'){
    const y = anchor.getFullYear();
    let months = '';
    for(let m=0;m<12;m++){
      const daysIn = new Date(y,m+1,0).getDate();
      const rows = [];
      for(let d=1; d<=daysIn; d++){
        const dIso = iso(new Date(y,m,d));
        (byDay[dIso]||[]).forEach(item=>{
          if(item.type==='stage'){
            const cl = state.clients.find(c=>c.id===item.proj.client_id);
            rows.push(`<div class="year-row"><span class="dot" style="background:${cl?colorFor(cl):'#999'}"></span><span style="min-width:64px;color:var(--muted)">${fmtDate(new Date(dIso+'T00:00'))}</span><span style="cursor:pointer" data-msitem="stage:${item.s.id}">${esc(cl?cl.name:'')} — ${esc(item.proj.name)} · ${esc(item.s.name)}</span></div>`);
          } else {
            const cl = state.clients.find(c=>c.id===item.t.client_id);
            rows.push(`<div class="year-row"><span class="dot" style="background:${cl?colorFor(cl):'#999'}"></span><span style="min-width:64px;color:var(--muted)">${fmtDate(new Date(dIso+'T00:00'))}</span><span style="cursor:pointer" data-msitem="task:${item.t.id}">${esc(cl?cl.name:'')} — ${esc(item.t.title)} <span style="color:var(--muted)">(retainer)</span></span></div>`);
          }
        });
      }
      if(rows.length) months += `<div class="year-month"><h4>${new Date(y,m,1).toLocaleDateString('en-GB',{month:'long'})}</h4>${rows.join('')}</div>`;
    }
    body = `<div class="cal-head"><button class="btn ghost small" id="mPrev">←</button><h3>${y}</h3><button class="btn ghost small" id="mNext">→</button><button class="btn ghost small" id="mToday">Today</button></div>
      ${months || '<div class="empty">No milestones this year.</div>'}`;
  } else if(state.milestoneViewMode==='gantt'){
    body = renderGanttBody();
  } else {
    const y = anchor.getFullYear(), mo = anchor.getMonth();
    const first = new Date(y, mo, 1);
    const cells = monthWeekdayCells(y, mo, todayIso, (d,dIso,isToday)=>{
      const list = byDay[dIso]||[];
      const chips = list.map(item=>milestoneItemChip(item, false)).join('');
      return `<div class="day ${isToday?'today':''}" data-date="${dIso}"><div class="num">${d}</div>${chips}</div>`;
    });
    body = `<div class="cal-head"><button class="btn ghost small" id="mPrev">←</button><h3>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3><button class="btn ghost small" id="mNext">→</button><button class="btn ghost small" id="mToday">Today</button></div>
      <div class="cal milestones">${['Mon','Tue','Wed','Thu','Fri'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
  }

  main.innerHTML = `<h2>Milestones</h2>
    ${controlsRow}${body}`;

  if($('#mPrev')) $('#mPrev').onclick = ()=>{
    if(state.milestoneViewMode==='week'){ const d=new Date(anchor); d.setDate(d.getDate()-7); state.milestoneAnchor=d; }
    else if(state.milestoneViewMode==='year'){ state.milestoneAnchor = new Date(anchor.getFullYear()-1, anchor.getMonth(), 1); }
    else { state.milestoneAnchor = new Date(anchor.getFullYear(), anchor.getMonth()-1, 1); }
    renderMilestones();
  };
  if($('#mNext')) $('#mNext').onclick = ()=>{
    if(state.milestoneViewMode==='week'){ const d=new Date(anchor); d.setDate(d.getDate()+7); state.milestoneAnchor=d; }
    else if(state.milestoneViewMode==='year'){ state.milestoneAnchor = new Date(anchor.getFullYear()+1, anchor.getMonth(), 1); }
    else { state.milestoneAnchor = new Date(anchor.getFullYear(), anchor.getMonth()+1, 1); }
    renderMilestones();
  };
  if($('#mToday')) $('#mToday').onclick = ()=>{ state.milestoneAnchor = new Date(); renderMilestones(); };
  attachMilestoneInteractions();
}

/* One "row" per project (with a scope summary via projectDetailsSummary),
   plus one synthetic row per retainer client (they don't have discrete
   typed projects under the flat retainer model). */
function clientListRows(){
  const rows = [];
  state.clients.filter(c=>c.active).forEach(c=>{
    if(c.is_retainer){
      rows.push({ client:c, project:null, badgeType:'retainer', scope:null, startDate:c.created_at||null });
    }
    state.projects.filter(p=>p.client_id===c.id && p.active).forEach(p=>{
      const kickoff = state.stages.filter(s=>s.project_id===p.id).sort((a,b)=>a.position-b.position)[0];
      rows.push({ client:c, project:p, badgeType:'project', scope:projectDetailsSummary(p), startDate:(kickoff&&kickoff.due_date)||p.created_at||null });
    });
  });
  return rows;
}

function renderClientListTable(){
  if(!state.clientListGroup) state.clientListGroup = 'client';
  if(!state.clientListSort) state.clientListSort = 'alpha';
  const rows = clientListRows();
  const sortRows = (arr)=> arr.sort((a,b)=>{
    if(state.clientListSort==='started'){
      const da = a.startDate||'', db = b.startDate||'';
      return da.localeCompare(db);
    }
    return a.client.name.localeCompare(b.client.name) || (a.project? a.project.name.localeCompare(b.project?.name||''):0);
  });

  const rowHtml = (r)=> `<tr class="task-row" data-clientrow="${r.client.id}">
    <td><span class="dot" style="background:${colorFor(r.client)};display:inline-block;margin-right:8px;vertical-align:middle"></span>${esc(r.client.name)}</td>
    <td>${r.badgeType==='retainer'? '<span class="retainer-badge" style="margin-left:0">Retainer</span>' : '<span class="project-badge" style="margin-left:0">Project</span>'}</td>
    <td>${r.project? esc(r.project.project_type) : '<span style="color:var(--muted)">—</span>'}</td>
    <td>${r.scope? esc(r.scope) : (r.badgeType==='retainer'? `${fmtH(r.client.retainer_hours)} · renews ${ordinal(r.client.renewal_day)}` : '<span style="color:var(--muted)">—</span>')}</td>
    <td style="color:var(--muted)">${r.startDate? fmtDate(new Date(r.startDate.slice(0,10)+'T00:00')) : '—'}</td>
    <td>${r.client.miro_link_internal? `<a class="btn small ghost" href="${esc(r.client.miro_link_internal)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Miro ↗</a>` : ''}</td>
    <td>${r.client.slug? `<a class="btn small ghost" href="${window.location.origin}${window.location.pathname}?client=${r.client.slug}&admin=1" target="_blank" rel="noopener" onclick="event.stopPropagation()">Dashboard ↗</a>` : ''}</td>
  </tr>`;

  let bodyHtml = '';
  if(state.clientListGroup==='type'){
    const groups = {};
    rows.forEach(r=>{ const key = r.badgeType==='retainer' ? 'Retainer' : r.project.project_type; (groups[key]=groups[key]||[]).push(r); });
    const groupNames = Object.keys(groups).sort((a,b)=> a==='Retainer'?-1: b==='Retainer'?1: a.localeCompare(b));
    bodyHtml = groupNames.map(name=>`
      <tr><td colspan="7" style="background:var(--track);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">${esc(name)} <span style="font-weight:400;text-transform:none;letter-spacing:0">(${groups[name].length})</span></td></tr>
      ${sortRows(groups[name]).map(rowHtml).join('')}
    `).join('');
  } else {
    const byClient = {};
    rows.forEach(r=>{ (byClient[r.client.id]=byClient[r.client.id]||{client:r.client, items:[]}).items.push(r); });
    const clientGroups = Object.values(byClient).sort((a,b)=>{
      if(state.clientListSort==='started'){
        const da = a.items.map(r=>r.startDate||'9999').sort()[0], db = b.items.map(r=>r.startDate||'9999').sort()[0];
        return da.localeCompare(db);
      }
      return a.client.name.localeCompare(b.client.name);
    });
    bodyHtml = clientGroups.map(g=>`
      <tr><td colspan="7" style="background:var(--track);font-weight:600;font-size:12px;color:var(--ink)"><span class="dot" style="background:${colorFor(g.client)};display:inline-block;margin-right:8px;vertical-align:middle"></span>${esc(g.client.name)} <span style="font-weight:400;color:var(--muted)">(${g.items.length})</span></td></tr>
      ${sortRows(g.items).map(rowHtml).join('')}
    `).join('');
  }

  let html = `<div class="breadcrumb"><button data-bc="clients">All Projects</button><span class="sep">/</span><span class="current">Client list</span></div>
    <h2>Client list</h2>
    <div class="sub">Every client and project at a glance — grouped and sorted however's useful.</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:var(--muted)">Group by</span>
        <div class="view-toggle" style="margin-bottom:0">
          <button class="btn small ${state.clientListGroup==='client'?'':'ghost'}" data-clgroup="client">Client</button>
          <button class="btn small ${state.clientListGroup==='type'?'':'ghost'}" data-clgroup="type">Project type</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:var(--muted)">Sort by</span>
        <div class="view-toggle" style="margin-bottom:0">
          <button class="btn small ${state.clientListSort==='alpha'?'':'ghost'}" data-clsort="alpha">Alphabetical</button>
          <button class="btn small ${state.clientListSort==='started'?'':'ghost'}" data-clsort="started">Time started</button>
        </div>
      </div>
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
    <table style="min-width:920px"><thead><tr>
      <th>Client</th><th>Type</th><th>Project</th><th>Scope</th><th>Started</th><th></th><th></th>
    </tr></thead><tbody>${bodyHtml || `<tr><td colspan="7" class="empty">No clients yet.</td></tr>`}</tbody></table>
    </div>`;
  main.innerHTML = html;
  $('[data-bc="clients"]').onclick = ()=>{ state.projView='clients'; render(); };
  main.querySelectorAll('[data-clgroup]').forEach(el=>el.addEventListener('click', ()=>{ state.clientListGroup=el.dataset.clgroup; render(); }));
  main.querySelectorAll('[data-clsort]').forEach(el=>el.addEventListener('click', ()=>{ state.clientListSort=el.dataset.clsort; render(); }));
  main.querySelectorAll('[data-clientrow]').forEach(el=>el.addEventListener('click', ()=>{
    const cl = state.clients.find(c=>c.id===el.dataset.clientrow);
    state.projClientId = cl.id;
    state.projView = cl.is_retainer ? 'retainerTasks' : 'clientProjects';
    render();
  }));
}

function clientCardHtml(c){
  if(c.is_retainer){
    const openTasks = state.projTasks.filter(t=>t.client_id===c.id && !t.project_id && !isCompleteStatus(t.status));
    return `<div class="card client-card" data-projgoto="${c.id}">
      <h3 style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${colorFor(c)}"></span>${esc(c.name)}<span class="retainer-badge">Retainer</span>
        <span class="card-actions"><button class="btn small ghost menu-dots" data-clientmenu="${c.id}" title="More options"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="15" height="15"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button></span>
      </h3>
      <div class="cycle">${openTasks.length} open task${openTasks.length===1?'':'s'}</div>
    </div>`;
  }
  const projects = state.projects.filter(p=>p.client_id===c.id && p.active);
  const body = projects.length
    ? `<div class="proj-pills">${projects.map(p=>{ const tc=typeConfig(p.project_type); return `<button type="button" class="proj-pill" data-projectgoto="${p.id}" data-projectclientid="${c.id}">${tc?projectTypeIconHtml(p.project_type,12)+' ':''}${esc(p.name)}</button>`; }).join('')}</div>`
    : `<div class="cycle">No projects yet</div>`;
  return `<div class="card client-card" data-projgoto="${c.id}">
    <h3 style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${colorFor(c)}"></span>${esc(c.name)}
      <span class="card-actions"><button class="btn small ghost menu-dots" data-clientmenu="${c.id}" title="More options"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="15" height="15"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button></span>
    </h3>
    ${body}
  </div>`;
}

function renderProjClients(){
  const clients = state.clients.filter(c=>c.active);
  const retainerClients = clients.filter(c=>c.is_retainer);
  const projectClients = clients.filter(c=>!c.is_retainer);
  let html = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div><h2>All Projects</h2></div>
      <div style="display:flex;gap:8px">
        <button class="btn small ghost" id="clientListBtn">Client list</button>
        <button class="btn small" id="newClientBtn">+ New client</button>
      </div>
    </div><div style="margin-bottom:20px"></div>`;
  if(!clients.length){
    html += `<div class="card">${emptyStateHtml({ icon:'folder', title:'No clients yet', subtitle:'Add your first client to start tracking retainers and projects.', actionLabel:'+ New client', actionAttr:'id="emptyNewClientBtn"' })}</div>`;
  } else {
    html += `<h3 style="font-size:15px;font-weight:600;margin-bottom:14px">Retainer clients</h3>`;
    html += retainerClients.length
      ? `<div class="grid" style="margin-bottom:34px">${retainerClients.map(clientCardHtml).join('')}</div>`
      : `<div class="empty" style="margin-bottom:34px">No retainer clients yet.</div>`;
    html += `<h3 style="font-size:15px;font-weight:600;margin-bottom:14px">Project clients</h3>`;
    html += projectClients.length
      ? `<div class="grid">${projectClients.map(clientCardHtml).join('')}</div>`
      : `<div class="empty">No project clients yet.</div>`;
  }
  main.innerHTML = html;
  $('#newClientBtn').onclick = openNewClientModal;
  if($('#emptyNewClientBtn')) $('#emptyNewClientBtn').onclick = openNewClientModal;
  $('#clientListBtn').onclick = ()=>{ state.projView='clientList'; render(); };
  main.querySelectorAll('[data-projgoto]').forEach(el=>el.addEventListener('click', ()=>{
    const cl = state.clients.find(c=>c.id===el.dataset.projgoto);
    state.projClientId = el.dataset.projgoto;
    state.projView = (cl && cl.is_retainer) ? 'retainerTasks' : 'clientProjects';
    render();
  }));
  main.querySelectorAll('[data-projectgoto]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    state.projClientId = el.dataset.projectclientid;
    state.projProjectId = el.dataset.projectgoto;
    state.projView = 'project';
    render();
  }));
  main.querySelectorAll('[data-clientmenu]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const cl = state.clients.find(c=>c.id===el.dataset.clientmenu);
    const items = [{ label:'Edit client', onClick:()=> openClientEditModal(cl.id) }];
    if(cl.miro_link_external) items.push({ label:'Open Miro (external) ↗', onClick:()=> window.open(cl.miro_link_external,'_blank') });
    if(cl.miro_link_internal) items.push({ label:'Open Miro (internal) ↗', onClick:()=> window.open(cl.miro_link_internal,'_blank') });
    if(cl.slug) items.push({ label:'View dashboard ↗', onClick:()=> window.open(`${window.location.origin}${window.location.pathname}?client=${cl.slug}&admin=1`,'_blank') });
    if(cl.slug) items.push({ label:'Copy client dashboard link', onClick:()=>{
      const url = `${window.location.origin}${window.location.pathname}?client=${cl.slug}`;
      navigator.clipboard?.writeText(url).then(()=> toast('Client dashboard link copied')).catch(()=> toast(url));
    }});
    items.push({ label:'Archive client', danger:true, onClick: async ()=>{
      if(!confirm(`Archive ${cl.name}? Their projects and history stay intact — you can restore them from Settings.`)) return;
      const { error } = await db.from('rs_clients').update({active:false}).eq('id', cl.id);
      if(error){ toast('Could not archive'); return; }
      toast('Client archived'); await refreshProjectView();
    }});
    openMenuPopover(e.currentTarget, items);
  }));
}

function renderProjClientProjects(){
  const c = state.clients.find(c=>c.id===state.projClientId);
  if(!c){ state.projView='clients'; render(); return; }
  const projects = state.projects.filter(p=>p.client_id===c.id && p.active).sort((a,b)=> a.name.localeCompare(b.name));

  let html = `<div class="breadcrumb"><button data-bc="clients">All Projects</button><span class="sep">/</span><span class="current">${esc(c.name)}</span></div>
    <h2 style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${colorFor(c)}"></span>${esc(c.name)}</h2>
    <div style="margin-bottom:18px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small" id="newProjectBtn">+ New project</button>
      ${miroButtonsHtml(c)}
      ${dashboardLinkButtonHtml(c)}
      <button class="btn small ghost" id="editClientBtn2">Edit client</button>
    </div>`;

  if(!projects.length){
    html += `<div class="empty">No projects yet for this client.</div>`;
  } else {
    html += `<div class="grid">` + projects.map(p=>{
      const stages = state.stages.filter(s=>s.project_id===p.id).sort((a,b)=>a.position-b.position);
      const tasks = state.projTasks.filter(t=>t.project_id===p.id);
      const done = tasks.filter(t=>isCompleteStatus(t.status)).length;
      const pct = tasks.length ? Math.round(done/tasks.length*100) : 0;
      const tc = typeConfig(p.project_type);
      const nextStage = stages.find(s=>stageStatus(s.id)!=='Complete');
      const nextLabel = nextStage
        ? `${esc(nextStage.name)}${nextStage.due_date? ' · due '+fmtDateNatural(nextStage.due_date) : ''}`
        : (stages.length? 'All stages complete' : null);
      return `<div class="card client-card" data-projdetail="${p.id}" style="${p.active?'':'opacity:.5'}">
        <h3 style="display:flex;align-items:center;gap:8px">${esc(p.name)}${p.active?'':' (archived)'}
          <span class="card-actions"><button class="btn small ghost menu-dots" data-projmenu="${p.id}" title="More options"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="15" height="15"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button></span>
        </h3>
        <div class="cycle"><span class="type-badge">${tc?projectTypeIconHtml(p.project_type,12)+' ':''}${esc(p.project_type)}</span>${p.label?`<span class="label-chip">${esc(p.label)}</span>`:''}</div>
        <div class="breakdown" style="border-top:none;padding-top:0;margin-top:10px">
          <div><span>Stages</span><span>${stages.length}</span></div>
          <div><span>Tasks</span><span>${tasks.length}</span></div>
        </div>
        ${nextLabel? `<div style="margin-top:10px;font-size:12px"><span style="color:var(--muted)">Next:</span> <span style="color:var(--accent);font-weight:500">${nextLabel}</span></div>`:''}
        ${tasks.length? `<div class="mini-progress"><div class="fill" style="width:${pct}%"></div></div><div style="font-size:11.5px;color:var(--muted);margin-top:4px">${pct}% complete</div>`:''}
      </div>`;
    }).join('') + `</div>`;
  }
  main.innerHTML = html;
  $('[data-bc="clients"]').onclick = ()=>{ state.projView='clients'; render(); };
  $('#newProjectBtn').onclick = ()=> openProjectModal(null, c.id);
  $('#editClientBtn2').onclick = ()=> openClientEditModal(c.id);
  main.querySelectorAll('[data-projdetail]').forEach(el=>el.addEventListener('click', ()=>{
    state.projProjectId = el.dataset.projdetail; state.projView='project'; render();
  }));
  main.querySelectorAll('[data-projmenu]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const p = state.projects.find(p=>p.id===el.dataset.projmenu);
    const items = [{ label:'Edit project details', onClick:()=> openProjectModal(p.id, p.client_id) }];
    items.push({ label: p.active?'Archive project':'Restore project', onClick: async ()=>{
      await db.from('rs_projects').update({active:!p.active}).eq('id',p.id);
      toast(p.active?'Project archived':'Project restored'); await refreshProjectView();
    }});
    if(!p.active){
      items.push({ label:'Delete project', danger:true, onClick: async ()=>{
        if(!confirm(`Permanently delete "${p.name}"? This also deletes its stages and tasks. This cannot be undone.`)) return;
        const { error } = await db.from('rs_projects').delete().eq('id', p.id);
        if(error){ toast('Delete failed'); return; }
        toast('Project deleted'); await refreshProjectView();
      }});
    }
    openMenuPopover(e.currentTarget, items);
  }));
}

function pillSelectorHtml(members, selectedIds){
  if(!members.length) return '<div class="empty" style="padding:4px 0">No eligible team members — check Settings</div>';
  return `<div class="pill-select">${members.map(m=>`<button type="button" class="member-pill ${selectedIds.includes(m.id)?'selected':''}" data-pillmember="${m.id}"><span class="avatar" style="background:${clientColor(m.id)}">${initials(m.name)}</span>${esc(m.name)}</button>`).join('')}</div>`;
}

function taskEntriesFor(taskId){ return (state.projTaskEntries||[]).filter(e=>e.proj_task_id===taskId).sort((a,b)=>a.work_date.localeCompare(b.work_date)); }

function taskEntriesHtml(taskId){
  const entries = taskEntriesFor(taskId);
  if(!entries.length) return `<div class="empty" style="padding:8px 0;font-size:12.5px">No time entries yet — add one below.</div>`;
  return `<div style="display:flex;flex-direction:column;gap:6px">${entries.map(e=>{
    const m = state.members.find(mm=>mm.id===e.member_id);
    const weight = m ? (m.weight||1) : 1;
    return `<div style="display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px;padding:8px 10px;background:var(--track);border-radius:8px;font-size:13px">
      <div style="min-width:0">
        <span style="font-weight:600">${esc(m?m.name:'?')}</span>
        <span style="color:var(--muted);margin-left:6px">${fmtDate(new Date(e.work_date+'T00:00'))}</span>
        ${e.notes? `<span style="color:var(--muted);margin-left:6px">· ${esc(e.notes)}</span>`:''}
      </div>
      <span style="font-weight:600;color:var(--accent)">${fmtH(e.hours)}</span>
      <span style="color:var(--muted);font-size:11.5px">×${weight} = ${fmtH(e.hours*weight)}</span>
      <button type="button" class="btn small ghost" data-editentry="${e.id}">Edit</button>
    </div>`;
  }).join('')}</div>`;
}

function openRetainerTaskTimeModal(taskId, onDone){
  const task = state.projTasks.find(t=>t.id===taskId);
  if(!task) return;
  const existingEntries = taskEntriesFor(taskId);
  const assignedIds = task.assigned_designer_ids||[];
  // Build rows: one per already-assigned designer, plus any existing entries for non-assigned members
  const extraMemberIds = [...new Set(existingEntries.map(e=>e.member_id).filter(id=>!assignedIds.includes(id)))];
  const rowMemberIds = [...assignedIds, ...extraMemberIds];
  const allMembers = state.members.filter(m=>m.active!==false);

  function entryRowsHtml(){
    const rows = rowMemberIds.map(mid=>{
      const m = allMembers.find(mm=>mm.id===mid);
      if(!m) return '';
      const existing = existingEntries.find(e=>e.member_id===mid);
      return `<div class="entry-row" data-entryrow="${mid}" style="display:grid;grid-template-columns:1fr 80px auto;gap:8px;align-items:center;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="avatar" style="background:${colorFor({color:PALETTE[allMembers.indexOf(m)%PALETTE.length]})};width:28px;height:28px;font-size:10px;flex:none">${esc(initials(m.name))}</div>
          <div>
            <div style="font-size:13.5px;font-weight:500">${esc(m.name)}</div>
            <div style="font-size:11px;color:var(--muted)">×${m.weight||1} weight</div>
          </div>
        </div>
        <input type="number" min="0" step="0.25" class="entry-hours" data-memberid="${mid}" value="${existing?existing.hours:''}" placeholder="0" style="text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit">
        <span style="font-size:12px;color:var(--muted);white-space:nowrap" id="weight_${mid}">${existing? `= ${fmtH(existing.hours*(m.weight||1))}` : ''}</span>
      </div>`;
    }).join('');
    return rows + `<div style="margin-top:12px">
      <label style="font-size:12px;color:var(--muted)">Work date</label>
      ${dateFieldHtml('ttm_date', iso(new Date()), 'Set date')}
    </div>`;
  }

  showModal(`
    <h3>${esc(task.title)}</h3>
    <div class="sub" style="margin-bottom:16px">Log hours for each team member who worked on this task</div>
    <div id="ttm_rows">${entryRowsHtml()}</div>
    <div class="modal-actions">
      <button class="btn ghost" id="ttm_edittask">Edit task</button>
      <div class="right">
        <button class="btn ghost" id="ttm_cancel">Cancel</button>
        <button class="btn" id="ttm_save">Save hours</button>
      </div>
    </div>
  `);
  wireDateField('ttm_date', 'Set date');
  document.querySelectorAll('.entry-hours').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const mid = inp.dataset.memberid;
      const m = allMembers.find(mm=>mm.id===mid);
      const w = m ? (m.weight||1) : 1;
      const h = parseFloat(inp.value)||0;
      const lbl = document.getElementById('weight_'+mid);
      if(lbl) lbl.textContent = h>0 ? `= ${fmtH(h*w)}` : '';
    });
  });
  $('#ttm_cancel').onclick = closeModal;
  $('#ttm_edittask').onclick = ()=>{ closeModal(); openProjTaskModal(taskId, {}); };
  $('#ttm_save').onclick = async ()=>{
    const work_date = $('#ttm_date').value || iso(new Date());
    const updates = [];
    document.querySelectorAll('.entry-hours').forEach(inp=>{
      const h = parseFloat(inp.value);
      if(h>0) updates.push({ member_id: inp.dataset.memberid, hours: h });
    });
    if(!updates.length){ toast('Enter at least one person\'s hours'); return; }
    for(const u of updates){
      const existing = existingEntries.find(e=>e.member_id===u.member_id);
      if(existing){
        const { error } = await db.from('rs_proj_task_entries').update({ hours:u.hours, work_date }).eq('id', existing.id);
        if(!error){ const rec = state.projTaskEntries.find(x=>x.id===existing.id); if(rec){ rec.hours=u.hours; rec.work_date=work_date; } }
      } else {
        const { data, error } = await db.from('rs_proj_task_entries').insert({ proj_task_id:taskId, member_id:u.member_id, hours:u.hours, work_date }).select().single();
        if(!error && data) state.projTaskEntries.push(data);
      }
    }
    closeModal(); toast('Hours saved');
    if(onDone) onDone(); else await refreshProjectView();
  };
}

function openTaskEntryModal(taskId, entryId, onDone){
  const isNew = !entryId;
  const e = entryId ? (state.projTaskEntries||[]).find(x=>x.id===entryId) : null;
  const task = state.projTasks.find(t=>t.id===taskId);
  const allMembers = state.members.filter(m=>m.active!==false);
  // Pre-select the first assigned designer who doesn't have an entry yet
  const assigned = task ? (task.assigned_designer_ids||[]) : [];
  const taken = taskEntriesFor(taskId).map(x=>x.member_id);
  const suggestedId = isNew ? (assigned.find(id=>!taken.includes(id)) || '') : '';
  showModal(`
    <h3>${isNew?'Log time for a person':'Edit time entry'}</h3>
    <form class="log" style="max-width:none">
      <div><label>Team member</label><select id="te_member"><option value="">— select —</option>${allMembers.map(m=>`<option value="${m.id}" ${(e?e.member_id===m.id:m.id===suggestedId)?'selected':''}>${esc(m.name)} (×${m.weight||1})</option>`).join('')}</select></div>
      <div><label>Hours</label><input type="number" min="0" step="0.25" id="te_hours" value="${e?e.hours:''}" placeholder="e.g. 2.5"></div>
      <div><label>Work date</label>${dateFieldHtml('te_date', e?e.work_date:iso(new Date()), 'Set date')}</div>
      <div class="full"><label>Notes <span style="color:var(--muted);font-weight:400">(optional)</span></label><input type="text" id="te_notes" value="${esc(e?e.notes||'':'')}" placeholder="e.g. Initial concept"></div>
    </form>
    <div class="modal-actions">
      ${!isNew? `<button class="btn danger" id="te_delete">Delete</button>`:'<span></span>'}
      <div class="right">
        <button class="btn ghost" id="te_cancel">Cancel</button>
        <button class="btn" id="te_save">${isNew?'Log hours':'Save'}</button>
      </div>
    </div>
  `);
  wireDateField('te_date', 'Set date');
  $('#te_cancel').onclick = closeModal;
  if(!isNew) $('#te_delete').onclick = async ()=>{
    const { error } = await db.from('rs_proj_task_entries').delete().eq('id', entryId);
    if(error){ toast('Delete failed'); return; }
    closeModal(); toast('Entry removed');
    const idx = (state.projTaskEntries||[]).findIndex(x=>x.id===entryId);
    if(idx>=0) state.projTaskEntries.splice(idx,1);
    if(onDone) onDone();
  };
  $('#te_save').onclick = async ()=>{
    const member_id = $('#te_member').value;
    const hours = parseFloat($('#te_hours').value);
    const work_date = $('#te_date').value || iso(new Date());
    const notes = $('#te_notes').value.trim() || null;
    if(!member_id){ toast('Select a team member'); return; }
    if(!hours || hours<=0){ toast('Enter a valid number of hours'); return; }
    if(isNew){
      const { data, error } = await db.from('rs_proj_task_entries').insert({ proj_task_id:taskId, member_id, hours, work_date, notes }).select().single();
      if(error){ toast('Could not save'); console.error(error); return; }
      (state.projTaskEntries = state.projTaskEntries||[]).push(data);
      closeModal(); toast('Hours logged');
    } else {
      const { error } = await db.from('rs_proj_task_entries').update({ member_id, hours, work_date, notes }).eq('id', entryId);
      if(error){ toast('Could not save'); return; }
      const entry = (state.projTaskEntries||[]).find(x=>x.id===entryId);
      if(entry){ entry.member_id=member_id; entry.hours=hours; entry.work_date=work_date; entry.notes=notes; }
      closeModal(); toast('Entry updated');
    }
    if(onDone) onDone();
  };
}

function blankProjTask(ctx){
  ctx = ctx || {};
  let clientId = ctx.clientId || null;
  if(!clientId && ctx.projectId){
    const proj = state.projects.find(p=>p.id===ctx.projectId);
    if(proj) clientId = proj.client_id;
  }
  const client = clientId ? state.clients.find(c=>c.id===clientId) : null;
  return { id:null, project_id:ctx.projectId||null, stage_id:ctx.stageId||null, client_id:ctx.clientId||null,
    title:'', priority:'Medium', status:'To do',
    assigned_designer_ids:[], assigned_reviewer_ids:[], assigned_animator_ids:[], recorded_hours:null, due_date:null, work_date:iso(new Date()),
    counts_toward_retainer: !!(client && client.is_retainer), retainer_task_ids:[] };
}

function stageStatus(stageId){
  const tasks = state.projTasks.filter(t=>t.stage_id===stageId);
  if(!tasks.length) return 'Pending';
  return tasks.every(t=>isCompleteStatus(t.status)) ? 'Complete' : 'Active';
}

const TASK_COL_DEFAULTS = { status:205, priority:104, designer:88, reviewer:88, animator:88, hours:64, due:104, retainer:80 };
const TASKSAHEAD_COL_DEFAULTS = { due:96, project:150, status:205, priority:96, assigned:88 };
function colWidth(store, key, defaults){ return (store[key] || defaults[key]) + 'px'; }

function taskClient(t){
  if(t.client_id) return state.clients.find(c=>c.id===t.client_id) || null;
  if(t.project_id){ const p=state.projects.find(p=>p.id===t.project_id); return p ? state.clients.find(c=>c.id===p.client_id)||null : null; }
  return null;
}

function taskGridColumns(showAnimator){
  const cols = ['minmax(160px,1fr)'];
  if(state.taskCols.has('status')) cols.push(colWidth(state.taskColWidths,'status',TASK_COL_DEFAULTS));
  if(state.taskCols.has('priority')) cols.push(colWidth(state.taskColWidths,'priority',TASK_COL_DEFAULTS));
  if(state.taskCols.has('designer')) cols.push(colWidth(state.taskColWidths,'designer',TASK_COL_DEFAULTS));
  if(state.taskCols.has('reviewer')) cols.push(colWidth(state.taskColWidths,'reviewer',TASK_COL_DEFAULTS));
  if(showAnimator) cols.push(colWidth(state.taskColWidths,'animator',TASK_COL_DEFAULTS));
  if(state.taskCols.has('hours')) cols.push(colWidth(state.taskColWidths,'hours',TASK_COL_DEFAULTS));
  if(state.taskCols.has('due')) cols.push(colWidth(state.taskColWidths,'due',TASK_COL_DEFAULTS));
  if(state.taskCols.has('retainer')) cols.push(colWidth(state.taskColWidths,'retainer',TASK_COL_DEFAULTS));
  cols.push('34px');
  return cols.join(' ');
}

async function duplicateProjTask(taskId){
  const t = state.projTasks.find(t=>t.id===taskId);
  if(!t) return;
  const client = taskClient(t);
  const fields = {
    project_id: t.project_id, stage_id: t.stage_id, client_id: t.client_id,
    title: t.title + ' (copy)', status: 'To do', priority: t.priority,
    assigned_designer_ids: t.assigned_designer_ids||[], assigned_reviewer_ids: t.assigned_reviewer_ids||[], assigned_animator_ids: t.assigned_animator_ids||[],
    recorded_hours: null, due_date: t.due_date, work_date: iso(new Date()),
    counts_toward_retainer: !!(client && client.is_retainer), retainer_task_ids: []
  };
  let { error } = await db.from('rs_proj_tasks').insert(fields);
  if(error && error.code==='42703'){
    const { assigned_animator_ids, ...rest } = fields;
    ({ error } = await db.from('rs_proj_tasks').insert(rest));
  }
  if(error){ toast('Could not duplicate task'); console.error(error); return; }
  toast('Task duplicated'); await refreshProjectView();
}

async function deleteProjTaskQuick(taskId){
  const t = state.projTasks.find(t=>t.id===taskId);
  if(!t) return;
  if(!confirm(`Delete "${t.title}"? This cannot be undone.`)) return;
  if(t.retainer_task_ids && t.retainer_task_ids.length) await Promise.all(t.retainer_task_ids.map(id=>db.from('rs_tasks').delete().eq('id',id)));
  const { error } = await db.from('rs_proj_tasks').delete().eq('id', taskId);
  if(error){ toast('Delete failed'); return; }
  toast('Task deleted'); await refreshProjectView();
}

const ASSIGN_ROLE_FIELD = { designer:'assigned_designer_ids', reviewer:'assigned_reviewer_ids', animator:'assigned_animator_ids' };
const ASSIGN_ROLE_CAN = { designer:'can_design', reviewer:'can_review', animator:'can_animate' };

function wireTaskRows(root, opts){
  opts = opts || {};
  const inlineSelectors = '[data-statusinline], [data-priorityinline], [data-taskmenu], [data-assigninline], [data-retainerinline], [data-taskname]';
  root.querySelectorAll('[data-projtask]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest(inlineSelectors)) return;
    const taskId = el.dataset.projtask;
    const task = state.projTasks.find(t=>t.id===taskId);
    const client = taskClient(task);
    if(opts.simpleRetainerPopup && task && !task.project_id && client?.is_retainer){
      openRetainerTaskTimeModal(taskId);
    } else if(opts.onRowClick){
      opts.onRowClick(taskId);
    } else {
      openProjTaskModal(taskId, {});
    }
  }));
  root.querySelectorAll('[data-statusinline]').forEach(el=>{
    el.addEventListener('click', e=> e.stopPropagation());
    el.addEventListener('change', async e=>{
      e.stopPropagation();
      const { error } = await db.from('rs_proj_tasks').update({ status: el.value }).eq('id', el.dataset.statusinline);
      if(error){ toast('Could not update status'); return; }
      await refreshProjectView();
    });
  });
  root.querySelectorAll('[data-priorityinline]').forEach(el=>{
    el.addEventListener('click', e=> e.stopPropagation());
    el.addEventListener('change', async e=>{
      e.stopPropagation();
      const { error } = await db.from('rs_proj_tasks').update({ priority: el.value }).eq('id', el.dataset.priorityinline);
      if(error){ toast('Could not update priority'); return; }
      await refreshProjectView();
    });
  });
  root.querySelectorAll('[data-assigninline]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const [taskId, role] = el.dataset.assigninline.split(':');
    const task = state.projTasks.find(t=>t.id===taskId);
    if(!task) return;
    const field = ASSIGN_ROLE_FIELD[role];
    const pool = state.members.filter(m=>m.active && m[ASSIGN_ROLE_CAN[role]]!==false);
    const current = new Set(task[field]||[]);
    openCheckboxDropdown(el, pool.map(m=>({key:m.id, label:m.name})), key=>current.has(key), async (key, checked)=>{
      checked ? current.add(key) : current.delete(key);
      const { error } = await db.from('rs_proj_tasks').update({ [field]: Array.from(current) }).eq('id', taskId);
      if(error){ toast(error.code==='42703' ? 'Run migration v19 to enable animator assignments' : 'Could not update'); return; }
      await refreshProjectView();
    });
  }));
  root.querySelectorAll('[data-retainerinline]').forEach(el=>el.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const taskId = el.dataset.retainerinline;
    const task = state.projTasks.find(t=>t.id===taskId);
    const client = taskClient(task);
    if(!task || !client?.is_retainer) return;
    const updated = { ...task, counts_toward_retainer: !task.counts_toward_retainer };
    const { error } = await db.from('rs_proj_tasks').update({ counts_toward_retainer: updated.counts_toward_retainer }).eq('id', taskId);
    if(error){ toast('Could not update'); return; }
    const retainerTaskIds = await syncProjTaskRetainer(updated, task.project_id ? state.projects.find(p=>p.id===task.project_id) : null, client);
    await db.from('rs_proj_tasks').update({ retainer_task_ids: retainerTaskIds }).eq('id', taskId);
    await refreshProjectView();
  }));
  root.querySelectorAll('[data-taskname]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const taskId = el.dataset.taskname;
    const original = el.textContent;
    const input = document.createElement('input');
    input.type = 'text'; input.value = original; input.className = 'inline-rename-input';
    el.replaceWith(input); input.focus(); input.select();
    input.addEventListener('click', ev=> ev.stopPropagation());
    input.addEventListener('keydown', ev=>{
      if(ev.key==='Enter') input.blur();
      if(ev.key==='Escape'){ input.dataset.cancel='1'; input.blur(); }
    });
    input.addEventListener('blur', async ()=>{
      const val = input.value.trim();
      if(input.dataset.cancel || !val || val===original){ input.replaceWith(el); return; }
      const { error } = await db.from('rs_proj_tasks').update({ title: val }).eq('id', taskId);
      if(error){ toast('Could not rename task'); input.replaceWith(el); return; }
      toast('Task renamed');
      await refreshProjectView();
    }, { once:true });
  }));
  root.querySelectorAll('[data-taskmenu]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const taskId = el.dataset.taskmenu;
    const items = [
      { label:'Edit task', onClick:()=> openProjTaskModal(taskId, {}) },
      { label:'Duplicate task', onClick:()=> duplicateProjTask(taskId) },
      { label:'Delete task', danger:true, onClick:()=> deleteProjTaskQuick(taskId) }
    ];
    openMenuPopover(e.currentTarget, items);
  }));
}

function renderTasksAhead(){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayIso = iso(today);
  const endDate = new Date(today); endDate.setDate(endDate.getDate()+6);
  const endIso = iso(endDate);

  const byClient = {};
  state.projTasks.forEach(t=>{
    if(!t.due_date || t.due_date<todayIso || t.due_date>endIso || isCompleteStatus(t.status)) return;
    let clientId = t.client_id, projectName = null;
    if(t.project_id){
      const proj = state.projects.find(p=>p.id===t.project_id);
      if(!proj) return;
      clientId = proj.client_id; projectName = proj.name;
    }
    if(!clientId) return;
    const client = state.clients.find(c=>c.id===clientId);
    if(!client || !client.active) return;
    (byClient[clientId] = byClient[clientId] || { client, items:[] }).items.push({ t, projectName });
  });
  const groups = Object.values(byClient).sort((a,b)=>a.client.name.localeCompare(b.client.name));
  const totalTasks = groups.reduce((a,g)=>a+g.items.length,0);

  let html = `<h2>Week Tasks</h2><div class="sub">Everything due ${fmtDateY(today)} – ${fmtDateY(endDate)}, across every client · rolls forward each day</div>`;
  if(!groups.length){
    html += `<div class="card">${emptyStateHtml({ icon:'calendar', title:'Nothing due in the next 7 days', subtitle:'Tasks with a due date this week will show up here as soon as one is set.' })}</div>`;
  } else {
    groups.forEach(g=>{
      const items = g.items.sort((a,b)=> (a.t.due_date||'').localeCompare(b.t.due_date||''));
      html += `<div class="stage-section">
        <div class="gantt-client-row"><span class="dot" style="background:${colorFor(g.client)}"></span>${esc(g.client.name)}<span class="home-count" style="margin-left:8px">${items.length}</span></div>
        <div class="card" style="padding:8px 12px">${tasksAheadTableHtml(items)}</div>
      </div>`;
    });
  }
  main.innerHTML = html;
  wireTaskRows(main);
}

function openProjTaskModal(taskId, ctx){
  const isNew = !taskId;
  const t = isNew ? blankProjTask(ctx) : state.projTasks.find(x=>x.id===taskId);
  const project = t.project_id ? state.projects.find(p=>p.id===t.project_id) : null;
  const client = state.clients.find(c=>c.id=== (project ? project.client_id : t.client_id));
  const stages = project ? state.stages.filter(s=>s.project_id===project.id).sort((a,b)=>a.position-b.position) : [];
  const designerPool = state.members.filter(m=>m.active && m.can_design!==false);
  const reviewerPool = state.members.filter(m=>m.active && m.can_review!==false);
  const animatorPool = state.members.filter(m=>m.active && m.can_animate!==false);
  const showAnimators = project?.project_type === 'Animations';
  showModal(`
    <h3>${isNew?'New task':'Edit task'}</h3>
    <div class="sub">${esc(project? project.name : client.name)}</div>
    <form class="log" style="max-width:none">
      <div class="full"><label>Title</label><input type="text" id="pt_title" value="${esc(t.title)}" placeholder="Task name"></div>
      ${stages.length? `<div><label>Stage</label><select id="pt_stage">${stages.map(s=>`<option value="${s.id}" ${s.id===t.stage_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>` : ''}

    await refreshProjectView();
  };

function renderProjDetail(){

  const visibleCount = 1 + TASK_COLUMNS.filter(([k])=>state.taskCols.has(k)).length;
  const todayIso = iso(new Date());
  const tc = typeConfig(p.project_type);

  const allTasks = state.projTasks.filter(t=>t.project_id===p.id);
  const doneCount = allTasks.filter(t=>isCompleteStatus(t.status)).length;
  const pctComplete = allTasks.length ? Math.round(doneCount/allTasks.length*100) : 0;

  let html = `<div class="breadcrumb">
      <button data-bc="clients">All Projects</button><span class="sep">/</span>
      <button data-bc="client">${esc(c.name)}</button><span class="sep">/</span>
      <span class="current">${esc(p.name)}</span>

      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px">
        <h2>${esc(p.name)}</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${miroButtonsHtml(c)}
          <button class="btn small" style="background:#7289DA" id="discordBtn">Share to Discord</button>
          <button class="btn small ghost" id="editProjectBtn">Edit project</button>
        </div>
      </div>
      ${(p.label || projectDetailsSummary(p))? `<div class="sub" style="margin-bottom:${allTasks.length?'16px':'0'}">${projectDetailsSummary(p)?`<span class="type-badge">${esc(projectDetailsSummary(p))}</span>`:''}${p.label?`<span class="label-chip"${projectDetailsSummary(p)?'':' style="margin-left:0"'}>${esc(p.label)}</span>`:''}</div>` : ''}
      ${allTasks.length? `<div style="max-width:320px"><div class="mini-progress"><div class="fill" style="width:${pctComplete}%"></div></div><div style="font-size:12.5px;color:var(--muted);margin-top:6px">${pctComplete}% complete · ${doneCount}/${allTasks.length} tasks</div></div>`:''}
    </div>
    <div style="margin-bottom:20px"><button class="btn small ghost" id="colDropdownBtn">Columns ▾</button></div>`;

  if(!stages.length){
    html += `<div class="empty">No stages yet — click "Add stage" to get started.</div>`;
  } else {
    stages.forEach((s,idx)=>{
      const tasks = state.projTasks.filter(t=>t.stage_id===s.id).sort((a,b)=>(a.position||0)-(b.position||0));
      const overdue = s.due_date && s.due_date < todayIso;
      const sStatus = stageStatus(s.id);
      const dateLabel = s.due_date
        ? `${overdue?'⚠️ ':''}${fmtDateNatural(s.due_date)}${s.due_time?' · '+formatTime12(s.due_time):''}${overdue?' (overdue)':''}`
        : 'Set due date';
      html += `<div class="stage-section" data-stagesection="${s.id}">
        <div class="stage-head">
          <h4><span class="stage-num">Stage ${idx}</span>${esc(s.name)}${sStatus==='Complete'?' <span class="status-pill status-complete">✓ Complete</span>':''}</h4>
          <div style="margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px">
            <button type="button" class="stage-date-btn" data-stagedate="${s.id}" style="margin-top:0">${dateLabel}</button>
            ${idx>0 && s.due_date ? `<span style="font-size:11px;color:var(--muted)">${reviewWindowLabel(s.due_date, p.review_days)}</span>` : ''}
          </div>
        </div>
        <div class="card" style="padding:8px 12px">${taskTableHtml(tasks, visibleCount, 'No tasks in this stage yet.', p.project_type==='Animations')}</div>
        <div style="margin-top:10px"><button class="btn small ghost" data-addtask="${s.id}">+ Task</button></div>
      </div>`;
    });
  }
  main.innerHTML = html;
  $('[data-bc="clients"]').onclick = ()=>{ state.projView='clients'; render(); };
  $('[data-bc="client"]').onclick = ()=>{ state.projView='clientProjects'; render(); };
  $('#editProjectBtn').onclick = ()=> openProjectModal(p.id, p.client_id);
  $('#discordBtn').onclick = ()=> openDiscordModal(p.id);
  $('#colDropdownBtn').onclick = (e)=>{ e.stopPropagation(); openColumnDropdown(e.currentTarget); };
  main.querySelectorAll('[data-addtask]').forEach(el=>el.addEventListener('click', ()=> openProjTaskModal(null, { projectId:p.id, stageId:el.dataset.addtask })));
  wireTaskRows(main);
  main.querySelectorAll('[data-stagedate]').forEach(el=>el.addEventListener('click', ()=>{
    const s = stages.find(s=>s.id===el.dataset.stagedate);
    openMiniDatePicker(el, s.due_date, async (newDate, newTime)=>{
      const { error } = await db.from('rs_project_stages').update({ due_date:newDate, due_time:newDate?newTime:null }).eq('id', s.id);
      if(error){ toast('Could not save date'); return; }
      await refreshProjectView();
    }, { withTime:true, currentTime:s.due_time });
  }));

  // drag-and-drop task reordering, scoped per stage
  main.querySelectorAll('[data-stagesection]').forEach(sectionEl=>{
    const stageId = sectionEl.dataset.stagesection;
    const stageTasks = state.projTasks.filter(t=>t.stage_id===stageId).sort((a,b)=>(a.position||0)-(b.position||0));
    sectionEl.querySelectorAll('.task-row[data-projtask]').forEach(row=>{
      row.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', row.dataset.projtask); e.dataTransfer.effectAllowed='move'; });
      row.addEventListener('dragover', e=>{ e.preventDefault(); row.classList.add('drop-target-row'); });
      row.addEventListener('dragleave', ()=> row.classList.remove('drop-target-row'));
      row.addEventListener('drop', async e=>{
        e.preventDefault(); row.classList.remove('drop-target-row');
        const draggedId = e.dataTransfer.getData('text/plain');
        const targetId = row.dataset.projtask;
        if(!draggedId || draggedId===targetId) return;
        const order = stageTasks.slice();
        const fromIdx = order.findIndex(t=>t.id===draggedId);
        const toIdx = order.findIndex(t=>t.id===targetId);
        if(fromIdx<0 || toIdx<0) return;
        const [moved] = order.splice(fromIdx,1);
        order.splice(toIdx,0,moved);
        await Promise.all(order.map((t,i)=> db.from('rs_proj_tasks').update({position:i}).eq('id',t.id)));
        await refreshProjectView();
      });
    });
  });
}

function projExtraFieldHtml(type, details){
  details = details || {};
  if(type==='Website') return `<div><label>Number of pages</label><input type="number" min="1" id="pj_extra_pages" value="${details.pages||''}"></div><div><label>Number of sections</label><input type="number" min="1" id="pj_extra_sections" value="${details.sections||''}"></div>`;
  if(type==='Branding') return `<div><label>Scope</label><select id="pj_extra">${BRANDING_SCOPES.map(s=>`<option value="${s}" ${details.scope===s?'selected':''}>${s}</option>`).join('')}</select></div>`;
  if(type==='Animations') return `<div><label>Length (seconds)</label><input type="number" min="1" id="pj_extra" value="${details.seconds||''}"></div>`;
  if(type==='Deck projects') return `<div><label>Number of slides</label><input type="number" min="1" id="pj_extra" value="${details.slides||''}"></div>`;
  return '<div></div>';
}
function projExtraFieldValue(type){
  if(type==='Website'){
    const pagesEl = document.getElementById('pj_extra_pages'), sectionsEl = document.getElementById('pj_extra_sections');
    return { pages: pagesEl&&pagesEl.value?+pagesEl.value:null, sections: sectionsEl&&sectionsEl.value?+sectionsEl.value:null };
  }
  const el = document.getElementById('pj_extra');
  if(!el) return {};
  if(type==='Branding') return { scope: el.value || null };
  if(type==='Animations') return { seconds: el.value?+el.value:null };
  if(type==='Deck projects') return { slides: el.value?+el.value:null };
  return {};
}

/* Human-readable summary of a project's type-specific details, e.g. "45s"
   for an animation or "12 slides" for a deck — shown on the project page */
/* N business days after a date, skipping weekends — used for review windows */
function addBusinessDays(dateStr, days){
  let d = new Date(dateStr+'T00:00');
  let count = 0;
  while(count < days){
    d.setDate(d.getDate()+1);
    const dow = d.getDay();
    if(dow!==0 && dow!==6) count++;
  }
  return d;
}
function reviewWindowLabel(dueDateStr, reviewDays){
  if(!dueDateStr || !reviewDays) return null;
  const start = addBusinessDays(dueDateStr, 1);
  const end = addBusinessDays(dueDateStr, reviewDays);
  return `Review ${fmtDate(start)} – ${fmtDate(end)}`;
}

function projectDetailsSummary(p){
  const d = p.details || {};
  if(p.project_type==='Website'){
    const parts = [d.pages? `${d.pages} page${d.pages===1?'':'s'}`:null, d.sections? `${d.sections} section${d.sections===1?'':'s'}`:null].filter(Boolean);
    return parts.length? parts.join(' · ') : null;
  }
  if(p.project_type==='Branding') return d.scope ? `${d.scope} branding` : null;
  if(p.project_type==='Animations') return d.seconds ? `${d.seconds}s length` : null;
  if(p.project_type==='Deck projects') return d.slides ? `${d.slides} slide${d.slides===1?'':'s'}` : null;
  return null;
}

async function syncProjTaskRetainer(pt, project, client){
  const existingIds = pt.retainer_task_ids || [];
  const designers = state.members.filter(m => (pt.assigned_designer_ids||[]).includes(m.id));
  const wantsSync = pt.counts_toward_retainer && client && client.is_retainer && designers.length && pt.recorded_hours>0 && pt.work_date;

  if(!wantsSync){
    if(existingIds.length) await Promise.all(existingIds.map(id=>db.from('rs_tasks').delete().eq('id',id)));
    if(pt.counts_toward_retainer && (!client || !client.is_retainer)) toast("This client isn't marked as a retainer client — turn that on in Settings first");
    else if(pt.counts_toward_retainer) toast('Assign a designer, recorded hours, and a work date to sync this to the retainer dashboard');
    return [];
  }

  // simplest reliable approach: clear old synced rows, recreate one per designer
  if(existingIds.length) await Promise.all(existingIds.map(id=>db.from('rs_tasks').delete().eq('id',id)));
  const perDesignerHours = pt.recorded_hours / designers.length;
  const newIds = [];
  for(const d of designers){
    const { data, error } = await db.from('rs_tasks').insert({
      client_id: client.id, member_id: d.id, task_date: pt.work_date, hours: perDesignerHours,
      description: project ? `${project.name} — ${pt.title}` : pt.title, weight_applied: d.weight
    }).select().single();
    if(error){ console.error(error); toast('Retainer sync failed for '+d.name); }
    else newIds.push(data.id);
  }
  return newIds;
}

function buildDiscordCard(project){
  const c = state.clients.find(c=>c.id===project.client_id);
  const stages = state.stages.filter(s=>s.project_id===project.id).sort((a,b)=>a.position-b.position);
  const tasks = state.projTasks.filter(t=>t.project_id===project.id);
  const counts = {Low:0,Medium:0,High:0,Urgent:0};
  tasks.forEach(t=>{ const pr=t.priority||'Medium'; counts[pr]=(counts[pr]||0)+1; });
  const today = iso(new Date());
  const lines = [];
  lines.push(`**${project.name}** — ${c.name}`);
  let typeLine = `Type: ${project.project_type}`;
  const d = project.details||{};
  if(project.project_type==='Website' && (d.pages||d.sections)) typeLine += ` · ${[d.pages?d.pages+' pages':null, d.sections?d.sections+' sections':null].filter(Boolean).join(', ')}`;
  if(project.project_type==='Branding' && d.scope) typeLine += ` (${d.scope})`;
  if(project.project_type==='Animations' && d.seconds) typeLine += ` · ${d.seconds}s`;
  if(project.project_type==='Deck projects' && d.slides) typeLine += ` · ${d.slides} slides`;
  if(project.label) typeLine += ` · 🏷️ ${project.label}`;
  lines.push(typeLine);
  lines.push(`📋 ${tasks.length} task${tasks.length===1?'':'s'} across ${stages.length} stage${stages.length===1?'':'s'}`);
  const nextDue = stages.filter(s=>s.due_date && s.due_date>=today).sort((a,b)=>a.due_date.localeCompare(b.due_date))[0];
  if(nextDue) lines.push(`📅 Next due: **${nextDue.name}** — ${fmtDateY(new Date(nextDue.due_date+'T00:00'))}`);
  const miroExt = miroExternal(c), miroInt = miroInternal(c);
  if(miroExt) lines.push(`🔗 Miro (external): ${miroExt}`);
  if(miroInt) lines.push(`🔗 Miro (internal): ${miroInt}`);
  lines.push('');
  lines.push('**Stages**');
  stages.forEach(s=>{
    const stTasks = tasks.filter(t=>t.stage_id===s.id);
    const icon = s.due_date && s.due_date < today ? '⚠️' : '▫️';
    lines.push(`${icon} ${s.name}${s.due_date? ` — due ${fmtDate(new Date(s.due_date+'T00:00'))}`:''} (${stTasks.length})`);
  });
  lines.push('');
  lines.push(`**Priorities:** ${counts.Urgent} urgent · ${counts.High} high · ${counts.Medium} medium · ${counts.Low} low`);
  return lines.join('\n');
}

function openDiscordModal(projectId){
  const project = state.projects.find(p=>p.id===projectId);

function renderCalendar(){
  if (!state.calMonth) state.calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const m0 = state.calMonth;
  const y = m0.getFullYear(), mo = m0.getMonth();
  const first = new Date(y, mo, 1);
  const daysIn = new Date(y, mo+1, 0).getDate();
  const todayIso = iso(new Date());
  const activeClients = state.clients.filter(c=>c.active && c.is_retainer);
  const byDay = {};
  state.tasks.forEach(t=>{ if(state.calHidden.has(t.client_id)) return; (byDay[t.task_date]=byDay[t.task_date]||[]).push(t); });
  const renewByDay = {};
  activeClients.forEach(c=>{
    if(state.calHidden.has(c.id)) return;
    if(c.renewal_day<=daysIn){ const dIso = iso(new Date(y,mo,c.renewal_day)); (renewByDay[dIso]=renewByDay[dIso]||[]).push(c); }
  });

  const cells = monthWeekdayCells(y, mo, todayIso, (d,dIso,isToday)=>{
    const list = (byDay[dIso]||[]);
    const renews = (renewByDay[dIso]||[]);
    const chips = renews.map(c=>`<div class="renew-chip" data-goto="${c.id}">↻ ${esc(c.name)} renews</div>`).join('')
      + list.slice(0,3).map(t=>{
        const c = state.clients.find(c=>c.id===t.client_id);
        return `<div class="task-chip" draggable="true" data-task="${t.id}" style="background:${c?colorFor(c):'#999'}" title="${esc(t.description||'')} — drag to another day to reschedule">${esc(c?c.name:'?')} · ${fmtH(t.hours*t.weight_applied)}</div>`;
      }).join('') + (list.length>3? `<div style="color:var(--muted)">+${list.length-3} more</div>`:'');
    return `<div class="day ${isToday?'today':''}" data-date="${dIso}"><div class="num">${d}</div>${chips}</div>`;
  });

  main.innerHTML = `
    <button class="btn ghost small back-btn" id="backToRetainerBtn">← Retainer</button>
    <h2>Retainer calendar</h2><div class="sub">Weighted hours per task · renewal dates marked automatically · click a day to log time, or a task to edit it</div>
    <div style="margin-bottom:16px"><button class="btn small ghost" id="calClientsBtn">Clients ▾</button></div>
    <div class="cal-head">
      <button class="btn ghost small" id="calPrev">←</button>
      <h3>${m0.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3>
      <button class="btn ghost small" id="calNext">→</button>
      <button class="btn ghost small" id="calToday">Today</button>
    </div>
    <div class="cal">
      ${['Mon','Tue','Wed','Thu','Fri'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>`;

  $('#calPrev').onclick = ()=>{ state.calMonth = new Date(y, mo-1, 1); renderCalendar(); };
  $('#backToRetainerBtn').onclick = ()=>{ state.retainerView='dashboard'; render(); };
  $('#calClientsBtn').onclick = (e)=>{
    e.stopPropagation();
    openCheckboxDropdown(e.currentTarget, activeClients.map(c=>({key:c.id, label:c.name, dot:colorFor(c)})),
      key=>!state.calHidden.has(key),
      (key,checked)=>{ checked ? state.calHidden.delete(key) : state.calHidden.add(key); renderCalendar(); });
  };
  $('#calNext').onclick = ()=>{ state.calMonth = new Date(y, mo+1, 1); renderCalendar(); };
  $('#calToday').onclick = ()=>{ state.calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); renderCalendar(); };
  main.querySelectorAll('.day[data-date]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest('[data-task]') || e.target.closest('[data-goto]')) return;
    openQuickLogModal(null, el.dataset.date);
  }));
  main.querySelectorAll('.task-chip[data-task]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); openTaskModal(el.dataset.task); });
    el.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', el.dataset.task);
      e.dataTransfer.effectAllowed = 'move';
    });
  });
  main.querySelectorAll('.renew-chip[data-goto]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    state.projClientId=el.dataset.goto; state.projView='retainerAllowance';
    state.view='projects'; render();
  }));
  main.querySelectorAll('.day[data-date]').forEach(dayEl=>{
    dayEl.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; dayEl.classList.add('drop-target'); });
    dayEl.addEventListener('dragleave', ()=> dayEl.classList.remove('drop-target'));
    dayEl.addEventListener('drop', async e=>{
      e.preventDefault(); dayEl.classList.remove('drop-target');
      const taskId = e.dataTransfer.getData('text/plain');
      const newDate = dayEl.dataset.date;
      if(!taskId || !newDate) return;
      const t = state.tasks.find(t=>t.id===taskId);
      if(t && t.task_date===newDate) return;
      const { error } = await db.from('rs_tasks').update({ task_date:newDate }).eq('id', taskId);
      if(error){ toast('Could not move task'); console.error(error); return; }
      toast(`Moved to ${fmtDate(new Date(newDate+'T00:00'))}`);
      await loadAll();
    });
  });
}

async function runImport(){
  const logEl = document.getElementById('imp_log');
  const append = (msg)=>{ logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; };
  let data;
  try{ data = JSON.parse(document.getElementById('imp_json').value); }
  catch(e){ append('❌ Invalid JSON: '+e.message); return; }

  const runBtn = document.getElementById('imp_run');
  runBtn.disabled = true; runBtn.textContent = 'Importing…';
  logEl.textContent = '';

  const clientNameMap = {};
  state.clients.forEach(c=> clientNameMap[c.name.trim().toLowerCase()] = c.id);
  for(const c of (data.clients||[])){
    const key = (c.name||'').trim().toLowerCase();
    if(!key) continue;
    if(clientNameMap[key]){ append(`↷ Client "${c.name}" already exists — skipped`); continue; }
    const color = PALETTE[Object.keys(clientNameMap).length % PALETTE.length];
    const slug = uniqueSlug(c.name.trim());
    const { data: row, error } = await db.from('rs_clients').insert({ name:c.name.trim(), is_retainer: !!c.is_retainer, color, dash_accent_color:color, slug }).select().single();
    if(error){ append(`❌ Client "${c.name}": ${error.message}`); continue; }
    clientNameMap[key] = row.id;
    append(`✓ Created client "${c.name}"${c.is_retainer?' (retainer)':''}`);
  }

  const memberNameMap = {};
  state.members.forEach(m=> memberNameMap[m.name.trim().toLowerCase()] = m.id);
  for(const m of (data.members||[])){
    const key = (m.name||'').trim().toLowerCase();
    if(!key || memberNameMap[key]) continue;
    const { data: row, error } = await db.from('rs_members').insert({ name:m.name.trim(), weight:1 }).select().single();
    if(error){ append(`❌ Member "${m.name}": ${error.message}`); continue; }
    memberNameMap[key] = row.id;
    append(`✓ Created team member "${m.name}"`);
  }

  let taskCount=0, taskSkipped=0, taskErrors=0;
  const existingTitlesByClient = {};
  state.projTasks.forEach(pt=>{
    if(pt.project_id || !pt.client_id) return;
    (existingTitlesByClient[pt.client_id] = existingTitlesByClient[pt.client_id] || new Set()).add(pt.title.trim().toLowerCase());
  });
  for(const t of (data.tasks||[])){
    const clientId = clientNameMap[(t.client_name||'').trim().toLowerCase()];
    if(!clientId){ append(`❌ Task "${t.title}": no matching client "${t.client_name}"`); taskErrors++; continue; }
    const seen = existingTitlesByClient[clientId] || (existingTitlesByClient[clientId] = new Set());
    const titleKey = (t.title||'').trim().toLowerCase();
    if(seen.has(titleKey)){ taskSkipped++; continue; }
    const status = taskStatusNames().includes(t.status) ? t.status : 'To do';
    const designerIds = (t.assignee_names||[]).map(n=> memberNameMap[(n||'').trim().toLowerCase()]).filter(Boolean);
    const { error } = await db.from('rs_proj_tasks').insert({
      client_id: clientId, project_id: null, stage_id: null, title: t.title,
      status, priority: t.priority || 'Medium', due_date: t.due_date || null,
      assigned_designer_ids: designerIds, assigned_reviewer_ids: [],
      counts_toward_retainer: false, position: taskCount
    });
    if(error){ append(`❌ Task "${t.title}": ${error.message}`); taskErrors++; }
    else { taskCount++; seen.add(titleKey); }
  }
  append(`\nDone. ${taskCount} task(s) imported${taskSkipped?`, ${taskSkipped} skipped (already existed)`:''}${taskErrors?`, ${taskErrors} error(s)`:''}.`);
  runBtn.disabled = false; runBtn.textContent = 'Run import';
  await loadAll();
}
