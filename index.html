<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reciprocal Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#040e6b;
    --navy-soft:#2a37a8;
    --ink:#16183a;
    --paper:#f6f6f3;
    --card:#ffffff;
    --line:#e4e4de;
    --muted:#7b7d92;
    --amber:#e08c00;
    --amber-bg:#fdf3e0;
    --red:#c9372c;
    --red-bg:#fbeceb;
    --green:#1d7a4d;
    --track:#ecedf5;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Rubik',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:15px}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}

  header{background:var(--navy);color:#fff;padding:0 24px}
  .head-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .brand{padding:16px 0;font-weight:700;font-size:17px;letter-spacing:.2px;display:flex;align-items:baseline;gap:10px}
  .brand span{font-weight:400;opacity:.65;font-size:13px}
  nav{display:flex;gap:4px;margin-left:auto}
  nav button{background:transparent;border:none;color:#fff;opacity:.65;padding:18px 14px;font-size:14px;font-weight:500;border-bottom:3px solid transparent}
  nav button.active{opacity:1;border-bottom-color:#fff}
  nav button:hover{opacity:1}
  nav .flag-count{background:var(--amber);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px;font-weight:600}

  main{max-width:1100px;margin:0 auto;padding:28px 24px 80px}
  h2{font-size:20px;font-weight:600;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}

  .banner{display:flex;gap:10px;align-items:flex-start;background:var(--amber-bg);border:1px solid #f0d9ae;border-radius:var(--radius);padding:14px 16px;margin-bottom:22px;font-size:14px}
  .banner.over{background:var(--red-bg);border-color:#efc7c3}
  .banner strong{font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .client-card{cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .client-card:hover{border-color:var(--navy-soft);box-shadow:0 2px 10px rgba(4,14,107,.06)}
  .client-card h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card-actions{margin-left:auto;display:flex;gap:6px}
  .card-actions .btn{padding:1px 10px;font-size:12.5px;line-height:1.8}
  .quick-dates{display:flex;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .cycle{color:var(--muted);font-size:12.5px;margin:3px 0 20px}

  .meter-wrap{margin-top:22px;margin-bottom:8px}
  .meter{position:relative;height:24px;background:var(--track);border-radius:8px}
  .meter .fill{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--navy-soft);transition:width .4s ease;max-width:100%}
  .meter .fill.warn{background:var(--amber)}
  .meter .fill.over{background:var(--red)}
  .meter .tick{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);opacity:.4;left:75%}
  .meter .tick-label{position:absolute;top:-22px;left:75%;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap;font-weight:500}
  .meter-stats{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;margin-top:10px}
  .meter-stats .pct{font-weight:600}
  .status{margin-top:12px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px}
  .status.ok{background:#e8f2ec;color:var(--green)}
  .status.warn{background:var(--amber-bg);color:var(--amber)}
  .status.over{background:var(--red-bg);color:var(--red)}
  .status .pulse{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .breakdown{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
  .breakdown div{display:flex;justify-content:space-between;padding:2px 0;font-variant-numeric:tabular-nums}

  form.log{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:640px}
  form.log .full{grid-column:1/-1}
  label{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px;color:var(--ink)}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
  textarea{resize:vertical;min-height:70px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-soft);outline-offset:-1px;border-color:transparent}
  .weighted-note{grid-column:1/-1;font-size:13px;color:var(--muted);background:var(--track);border-radius:9px;padding:10px 12px}
  .weighted-note b{color:var(--navy);font-weight:600}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:11px 20px;font-size:14px;font-weight:500}
  .btn:hover{background:var(--navy-soft)}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
  .btn.small{padding:6px 12px;font-size:12.5px}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
  .btn.danger:hover{background:var(--red-bg)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  tr.task-row{cursor:pointer}
  tr.task-row:hover{background:var(--track)}
  td .chip{display:inline-flex;align-items:center;gap:6px}
  .note-dot{color:var(--amber);margin-left:4px}

  /* calendar */
  .cal-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .cal-head h3{font-size:17px;font-weight:600;min-width:170px;text-align:center}
  .cal-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .filter-pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;opacity:1}
  .filter-pill.off{opacity:.4}
  .filter-pill .dot{width:8px;height:8px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:center;padding:4px 0}
  .cal .day{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;font-size:12px;cursor:pointer}
  .cal .day:hover{border-color:var(--navy-soft)}
  .cal .day.blank{background:transparent;border:none;cursor:default}
  .cal .day .num{font-weight:600;color:var(--muted);margin-bottom:4px}
  .cal .day.today .num{color:var(--navy);background:var(--track);border-radius:6px;display:inline-block;padding:0 5px}
  .task-chip{border-radius:6px;padding:2px 6px;color:#fff;margin-bottom:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .renew-chip{border:1px dashed var(--navy-soft);color:var(--navy-soft);background:#fff;border-radius:6px;padding:2px 6px;font-size:10.5px;margin-bottom:3px;cursor:pointer;font-weight:500}

  .settings-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  @media(max-width:800px){.settings-cols{grid-template-columns:1fr}form.log{grid-template-columns:1fr}}
  .row-form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .row-form input,.row-form select{width:auto;flex:1;min-width:80px}
  .action-cell{display:flex;gap:6px;justify-content:flex-end}

  .setup{max-width:460px;margin:70px auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
  .setup h2{margin-bottom:6px}
  .setup p{font-size:13.5px;color:var(--muted);margin-bottom:18px}
  .setup label{margin-top:12px}
  .setup .btn{margin-top:18px;width:100%}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:11px 18px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .empty{color:var(--muted);font-size:13.5px;padding:20px 0}
  .back-btn{margin-bottom:16px}

  .modal-backdrop{position:fixed;inset:0;background:rgba(4,14,107,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal-card{background:#fff;border-radius:var(--radius);padding:24px;max-width:480px;width:100%;max-height:88vh;overflow:auto}
  .modal-card h3{font-size:16px;margin-bottom:4px}
  .modal-card .sub{margin-bottom:16px}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
  .modal-actions .right{display:flex;gap:8px;margin-left:auto}

  .cycle-block{margin-bottom:22px}
  .cycle-block .cb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .cycle-block .cb-head h4{font-size:14.5px;font-weight:600}
  .cycle-block .cb-head .badge{font-size:11.5px;color:var(--muted)}

  .day.drop-target{border-color:var(--navy-soft);background:var(--track)}
  .task-chip{transition:transform .1s}
  .task-chip:active{cursor:grabbing}

  .swatch{width:16px;height:16px;border-radius:5px;display:inline-block;border:1px solid rgba(0,0,0,.08);vertical-align:middle}
  input[type=color]{width:44px;height:34px;padding:2px;cursor:pointer}

  .dash-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .dash-controls input[type=text]{width:220px}
  .dash-controls select{width:auto}

  .history-list{font-size:12.5px;color:var(--muted);margin-bottom:20px}
  .history-list div{padding:3px 0}
  .history-list b{color:var(--ink);font-weight:500}

  .breadcrumb{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .breadcrumb button{background:none;border:none;color:var(--navy-soft);font-size:13px;padding:0}
  .breadcrumb button:hover{text-decoration:underline}
  .breadcrumb .sep{color:var(--line)}
  .breadcrumb .current{color:var(--ink);font-weight:500}

  .type-badge{display:inline-block;background:var(--track);color:var(--navy-soft);font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px}
  .label-chip{display:inline-block;background:var(--amber-bg);color:var(--amber);font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;margin-left:6px}
  .retainer-badge{display:inline-block;background:#e8f2ec;color:var(--green);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;margin-left:6px}

  .col-toggles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}

  .stage-section{margin-bottom:26px}
  .stage-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .stage-head h4{font-size:14.5px;font-weight:600}
  .stage-head .count{font-size:12px;color:var(--muted)}
  .stage-head .stage-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

  .priority-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block}
  .priority-low{background:var(--track);color:var(--muted)}
  .priority-medium{background:#e7e9fb;color:var(--navy-soft)}
  .priority-high{background:var(--amber-bg);color:var(--amber)}
  .priority-urgent{background:var(--red-bg);color:var(--red)}
  .retainer-tick{color:var(--green);font-weight:700}

  .avatar{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:9.5px;font-weight:700;flex:none;border:2px solid #fff}
  .avatar-group{display:inline-flex}
  .avatar-group .avatar{margin-left:-7px}
  .avatar-group .avatar:first-child{margin-left:0}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">Reciprocal Space</div>
    <nav id="nav" style="display:none">
      <button data-view="projects" class="active">Projects Overview</button>
      <button data-view="milestones">Milestones</button>
      <button data-view="dashboard">Retainer Dashboard</button>
      <button data-view="log">Log time</button>
      <button data-view="calendar">Calendar</button>
      <button data-view="settings">Settings</button>
    </nav>
  </div>
</header>

<main id="main"></main>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============ */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";
/* ================================ */

let db = null;
let state = { view:'projects', clients:[], members:[], tasks:[], calMonth:null, logDate:null, clientId:null, calHidden:new Set(), dashSearch:'', dashSort:'name',
  projects:[], stages:[], projTasks:[], projView:'clients', projClientId:null, projProjectId:null,
  taskCols:new Set(['designer','reviewer','hours','due','priority','retainer']),
  milestoneMonth:null, milestoneHidden:new Set() };
const $ = s => document.querySelector(s);
const main = $('#main');

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtH(n){ const v=Math.round(n*100)/100; return (v%1===0? v.toFixed(0):v.toFixed(2).replace(/0$/,''))+'h'; }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(d){ return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function fmtDateY(d){ return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function ordinal(n){ const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function clampDay(y,m,day){ const last=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(day,last)); }

function cycleFor(renewalDay, ref){
  ref = ref || new Date(); ref = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  let start = clampDay(ref.getFullYear(), ref.getMonth(), renewalDay);
  if (ref < start) start = clampDay(ref.getFullYear(), ref.getMonth()-1, renewalDay);
  const next = clampDay(start.getFullYear(), start.getMonth()+1, renewalDay);
  const end = new Date(next); end.setDate(end.getDate()-1);
  return { start, end, next };
}

const PALETTE = ['#2a37a8','#0e7c86','#8a3ffc','#b2560d','#1d7a4d','#a02a6e','#4a5568','#946200'];
function clientColor(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }
function colorFor(client){ return (client && client.color) ? client.color : clientColor(client.id); }

const PROJECT_TYPES = ['Website','Branding','Animations','Deck projects'];
const BRANDING_SCOPES = ['Micro','Full','Refresh'];
const STAGE_TEMPLATES = {
  'Website': ['Discovery','Design','Development','Review','Launch'],
  'Branding': ['Discovery','Design','Review','Delivery'],
  'Animations': ['Concept','Storyboard','Animation','Review','Delivery'],
  'Deck projects': ['Content','Design','Review','Delivery'],
  default: ['Discovery','Design','Review','Delivery']
};
const PRIORITIES = ['Low','Medium','High','Urgent'];
const TASK_COLUMNS = [['designer','Designer'],['reviewer','Reviewer'],['hours','Hours'],['due','Due date'],['priority','Priority'],['retainer','Retainer']];

function initials(name){ const p=(name||'').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase() || '?'; }
function avatarHtml(member){ if(!member) return ''; return `<span class="avatar" style="background:${clientColor(member.id)}" title="${esc(member.name)}">${initials(member.name)}</span>`; }
function avatarWithName(member){ return member ? `<span style="display:inline-flex;align-items:center;gap:6px">${avatarHtml(member)}${esc(member.name)}</span>` : '<span style="color:var(--muted)">—</span>'; }
function avatarGroupHtml(ids){
  const ms = (ids||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean);
  if(!ms.length) return '<span style="color:var(--muted)">—</span>';
  return `<span class="avatar-group">${ms.map(m=>avatarHtml(m)).join('')}</span>`;
}

/* Pick the retainer/renewal settings that applied on a given date, from a
   client's effective-dated history (sorted ascending by effective_from). */
function settingsAt(history, dateObj){
  if(!history || !history.length) return null;
  const d = iso(dateObj);
  let applicable = history[0];
  for(const h of history){ if(h.effective_from <= d) applicable = h; else break; }
  return applicable;
}

function clientUsage(client, taskList){
  const cyc = cycleFor(client.renewal_day);
  const s = iso(cyc.start), e = iso(cyc.end);
  const tasks = (taskList||state.tasks).filter(t => t.client_id===client.id && t.task_date>=s && t.task_date<=e);
  const used = tasks.reduce((a,t)=>a + t.hours*t.weight_applied, 0);
  const perMember = {};
  tasks.forEach(t=>{
    const m = state.members.find(m=>m.id===t.member_id);
    const key = m ? m.name : 'Unassigned';
    perMember[key] = (perMember[key]||0) + t.hours*t.weight_applied;
  });
  return { cyc, tasks, used, perMember, pct: client.retainer_hours>0 ? used/client.retainer_hours*100 : 0 };
}

/* ---------- data ---------- */
async function loadAll(){
  const since = iso(new Date(Date.now() - 1000*60*60*24*70));
  const [c,m,t] = await Promise.all([
    db.from('rs_clients').select('*').order('name'),
    db.from('rs_members').select('*').order('name'),
    db.from('rs_tasks').select('*').gte('task_date', since).order('task_date',{ascending:false})
  ]);
  if (c.error||m.error||t.error){ toast('Load failed — check Supabase setup'); console.error(c.error||m.error||t.error); return; }
  state.clients = c.data; state.members = m.data; state.tasks = t.data;

  const [pr,st,pt] = await Promise.all([
    db.from('rs_projects').select('*').order('name'),
    db.from('rs_project_stages').select('*').order('position'),
    db.from('rs_proj_tasks').select('*').order('created_at')
  ]);
  state.projects = pr.data||[]; state.stages = st.data||[]; state.projTasks = pt.data||[];
  if(pr.error) console.warn('Project Overview tables not found — run retainer-tracker-migration-v4.sql', pr.error);
  render();
}

/* ---------- modal ---------- */
function closeModal(){ $('#modalRoot').innerHTML=''; }
function showModal(html){
  $('#modalRoot').innerHTML = `<div class="modal-backdrop" id="mbd"><div class="modal-card">${html}</div></div>`;
  $('#mbd').addEventListener('click', e=>{ if(e.target.id==='mbd') closeModal(); });
}

function openTaskModal(taskId){
  const t = state.tasks.find(t=>t.id===taskId) || (state._clientTaskCache||[]).find(t=>t.id===taskId);
  if(!t){ toast('Task not found'); return; }
  const clients = state.clients.filter(c=>c.active || c.id===t.client_id);
  const members = state.members.filter(m=>m.active || m.id===t.member_id);
  showModal(`
    <h3>Edit task</h3>
    <div class="sub">Changes recalculate weighted hours using the selected member's current factor</div>
    <form class="log" id="editForm" style="max-width:none">
      <div><label>Client</label><select id="e_client">${clients.map(c=>`<option value="${c.id}" ${c.id===t.client_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div><label>Team member</label><select id="e_member">${members.map(m=>`<option value="${m.id}" ${m.id===t.member_id?'selected':''}>${esc(m.name)} (×${m.weight})</option>`).join('')}</select></div>
      <div><label>Date</label><input type="date" id="e_date" value="${t.task_date}"></div>
      <div><label>Hours worked</label><input type="number" min="0.25" step="0.25" id="e_hours" value="${t.hours}"></div>
      <div class="full"><label>Task</label><input type="text" id="e_desc" value="${esc(t.description||'')}"></div>
      <div class="full"><label>Notes</label><textarea id="e_notes" placeholder="Scribble any notes here…">${esc(t.notes||'')}</textarea></div>
      <div class="weighted-note full" id="e_note">—</div>
    </form>
    <div class="modal-actions">
      <button class="btn danger" id="e_delete">Delete task</button>
      <div class="right">
        <button class="btn ghost" id="e_cancel">Cancel</button>
        <button class="btn" id="e_save">Save changes</button>
      </div>
    </div>
  `);
  const upd = ()=>{
    const m = members.find(m=>m.id===$('#e_member').value);
    const h = parseFloat($('#e_hours').value);

/* Client-safe PDF: totals + a plain task list. No notes, no team member
   names, no weighting factors — just what was delivered and hours consumed. */
function generateClientPdf(client, group){
  if(!window.jspdf){ toast('PDF library still loading — try again in a second'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const margin = 48;
  let y = 60;

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(4,14,107);
  doc.text('Reciprocal Space', margin, y); y += 18;
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(123,125,146);
  doc.text('Retainer usage summary', margin, y); y += 34;

  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(22,24,58);
  doc.text(client.name, margin, y); y += 20;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(`${fmtDateY(group.cyc.start)} – ${fmtDateY(group.cyc.end)}`, margin, y); y += 26;

  const used = group.tasks.reduce((a,t)=>a+t.hours*t.weight_applied,0);
  const pct = group.retainer_hours>0 ? used/group.retainer_hours*100 : 0;
  const remaining = Math.max(group.retainer_hours-used,0);
  const statusColor = pct>=100 ? [201,55,44] : pct>=75 ? [224,140,0] : [29,122,77];

  doc.setDrawColor(228,228,222); doc.setFillColor(246,246,243);
  doc.roundedRect(margin, y, pageWidth-margin*2, 64, 6, 6, 'FD');
  doc.setFontSize(9.5); doc.setTextColor(123,125,146);
  doc.text('Hours used', margin+16, y+22);
  doc.text('Retainer', margin+150, y+22);
  doc.text('Remaining', margin+290, y+22);
  doc.text('% used', margin+430, y+22);
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(22,24,58);
  doc.text(fmtH(used), margin+16, y+42);
  doc.text(fmtH(group.retainer_hours), margin+150, y+42);
  doc.text(fmtH(remaining), margin+290, y+42);
  doc.setTextColor(...statusColor);
  doc.text(Math.round(pct)+'%', margin+430, y+42);
  y += 92;

  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(22,24,58);
  doc.text('Work completed this period', margin, y); y += 16;
  doc.setDrawColor(228,228,222); doc.line(margin, y, pageWidth-margin, y); y += 16;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  const sorted = group.tasks.slice().sort((a,b)=>a.task_date.localeCompare(b.task_date));
  if(!sorted.length){
    doc.setTextColor(123,125,146);
    doc.text('No work logged for this period yet.', margin, y); y += 16;
  }
  sorted.forEach(t=>{
    if(y > 760){ doc.addPage(); y = 60; }
    doc.setTextColor(22,24,58);
    doc.text(fmtDate(new Date(t.task_date+'T00:00')), margin, y);
    const lines = doc.splitTextToSize(t.description || 'Work item', 330);
    doc.text(lines, margin+70, y);
    doc.text(fmtH(t.hours*t.weight_applied), pageWidth-margin-40, y);
    y += 14*lines.length + 4;
  });

  doc.setFontSize(8); doc.setTextColor(123,125,146);
  doc.text(`Generated ${fmtDateY(new Date())} · Reciprocal Space`, margin, doc.internal.pageSize.getHeight()-30);

  const safeName = client.name.replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'');
  doc.save(`${safeName}-${iso(group.cyc.start)}.pdf`);
}

/* ---------- data export / backup ---------- */
function csvEscape(v){ const s = String(v ?? ''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

async function exportAllData(){
  toast('Preparing backup…');
  const [c,m,t,h] = await Promise.all([
    db.from('rs_clients').select('*').order('name'),
    db.from('rs_members').select('*').order('name'),
    db.from('rs_tasks').select('*').order('task_date',{ascending:false}),
    db.from('rs_client_settings_history').select('*').order('effective_from',{ascending:true})
  ]);
  if(c.error||m.error||t.error){ toast('Backup failed'); console.error(c.error||m.error||t.error); return; }
  const payload = { exported_at: new Date().toISOString(), clients:c.data, members:m.data, tasks:t.data, settings_history: h.data||[] };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `rs-retainer-backup-${iso(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}

async function exportTasksCsv(){
  toast('Preparing CSV…');
  const { data, error } = await db.from('rs_tasks').select('*').order('task_date',{ascending:false});
  if(error){ toast('Export failed'); console.error(error); return; }
  const header = ['Date','Client','Team member','Task','Notes','Hours','Weight','Weighted hours'];
  const rows = data.map(t=>{
    const c = state.clients.find(c=>c.id===t.client_id);
    const m = state.members.find(m=>m.id===t.member_id);
    return [t.task_date, c?c.name:'', m?m.name:'', t.description||'', t.notes||'', t.hours, t.weight_applied, (t.hours*t.weight_applied).toFixed(2)];
  });
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `rs-tasks-export-${iso(new Date())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('CSV downloaded');
}

/* ---------- views ---------- */
function render(){
  const activeClients = state.clients.filter(c=>c.active && c.is_retainer);
  const flagged = activeClients.map(c=>({c,u:clientUsage(c)})).filter(x=>x.u.pct>=75);
  document.querySelectorAll('#nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===state.view);
    if(b.dataset.view==='dashboard') b.innerHTML = 'Dashboard' + (flagged.length? ` <span class="flag-count">${flagged.length}</span>`:'');
  });
  ({dashboard:renderDashboard, projects:renderProjects, milestones:renderMilestones, log:renderLog, calendar:renderCalendar, settings:renderSettings, client:renderClient}[state.view])();
}

function meterHtml(u, retainerHours){
  const cls = u.pct>=100?'over':u.pct>=75?'warn':'';
  return `<div class="meter-wrap">
      <div class="meter">
        <div class="fill ${cls}" style="width:${Math.min(u.pct,100)}%"></div>
        <div class="tick"></div>
        <div class="tick-label">75%</div>
      </div>
      <div class="meter-stats"><span>${fmtH(u.used)} of ${fmtH(retainerHours)}</span><span class="pct">${Math.round(u.pct)}%</span></div>
    </div>`;
}

function renderDashboard(){
  const allActive = state.clients.filter(c=>c.active && c.is_retainer);
  const flagged = allActive.map(c=>({c,u:clientUsage(c)})).filter(x=>x.u.pct>=75);

  let items = allActive
    .filter(c=>c.name.toLowerCase().includes(state.dashSearch.toLowerCase()))
    .map(c=>({c,u:clientUsage(c)}));
  const sorters = {
    name: (a,b)=>a.c.name.localeCompare(b.c.name),
    pct_desc: (a,b)=>b.u.pct-a.u.pct,
    pct_asc: (a,b)=>a.u.pct-b.u.pct,
    hours_desc: (a,b)=>b.u.used-a.u.used,
    hours_asc: (a,b)=>a.u.used-b.u.used,
  };
  items.sort(sorters[state.dashSort]||sorters.name);

  let html = `<h2>Retainers this cycle</h2><div class="sub">Weighted hours against each client's own renewal month · click a card for full history</div>`;

  if (flagged.length){
    const over = flagged.filter(x=>x.u.pct>=100);
    html += `<div class="banner ${over.length?'over':''}">
      <div>⚑</div>
      <div><strong>${flagged.map(x=>esc(x.c.name)).join(', ')}</strong>
      ${flagged.length===1?'has':'have'} passed 75% of retainer — worth flagging to the client${flagged.length>1?'s':''}.
      ${over.length? `<br><strong>${over.map(x=>esc(x.c.name)).join(', ')}</strong> ${over.length===1?'is':'are'} over the retainer.`:''}</div>
    </div>`;
  }

  const pending = state.projTasks.filter(t=>{
    if(!t.counts_toward_retainer || (t.retainer_task_ids||[]).length) return false;
    const proj = state.projects.find(p=>p.id===t.project_id);
    const cl = proj && state.clients.find(c=>c.id===proj.client_id);
    return cl && cl.is_retainer;
  });
  if(pending.length){
    html += `<div class="banner">
      <div>🕓</div>
      <div><strong>${pending.length} task${pending.length===1?'':'s'}</strong> ${pending.length===1?'is':'are'} ticked for the retainer from Projects Overview but still missing hours (or a designer) — ${pending.length===1?'it':'they'} won't count until filled in.
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start">
          ${pending.map(t=>{
            const proj = state.projects.find(p=>p.id===t.project_id);
            const cl = state.clients.find(c=>c.id===proj.client_id);
            return `<button class="btn small ghost" data-jumptask="${t.id}">${esc(cl.name)} — ${esc(proj.name)}: ${esc(t.title)}</button>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  }

  html += `<div class="dash-controls">
    <input type="text" id="dashSearch" placeholder="Filter by name…" value="${esc(state.dashSearch)}">
    <select id="dashSort">
      <option value="name" ${state.dashSort==='name'?'selected':''}>Sort: Name (A–Z)</option>
      <option value="pct_desc" ${state.dashSort==='pct_desc'?'selected':''}>Sort: % used (high–low)</option>
      <option value="pct_asc" ${state.dashSort==='pct_asc'?'selected':''}>Sort: % used (low–high)</option>
      <option value="hours_desc" ${state.dashSort==='hours_desc'?'selected':''}>Sort: Hours logged (high–low)</option>
      <option value="hours_asc" ${state.dashSort==='hours_asc'?'selected':''}>Sort: Hours logged (low–high)</option>
    </select>
  </div>`;

  if (!allActive.length){
    html += `<div class="empty">No clients yet — add them under <b>Settings</b>.</div>`;
  } else if (!items.length){
    html += `<div class="empty">No clients match "${esc(state.dashSearch)}".</div>`;
  } else {
    html += `<div class="grid">` + items.map(({c,u})=>{
      const status = u.pct>=100
        ? `<span class="status over"><span class="pulse"></span>Over retainer by ${fmtH(u.used-c.retainer_hours)}</span>`
        : u.pct>=75
        ? `<span class="status warn"><span class="pulse"></span>Reaching limit — tell the client</span>`
        : `<span class="status ok">${fmtH(c.retainer_hours-u.used)} remaining</span>`;
      const bd = Object.entries(u.perMember).sort((a,b)=>b[1]-a[1])
        .map(([n,h])=>`<div><span>${esc(n)}</span><span>${fmtH(h)}</span></div>`).join('');
      return `<div class="card client-card" data-goto="${c.id}">
        <h3><span class="dot" style="background:${colorFor(c)}"></span>${esc(c.name)}
          <span class="card-actions">
            <button class="btn small ghost" data-quicklog="${c.id}" title="Log task for ${esc(c.name)}">+</button>
            <button class="btn small ghost" data-pdf-current="${c.id}" title="Generate PDF for ${esc(c.name)}">PDF</button>
          </span>
        </h3>
        <div class="cycle">${fmtDate(u.cyc.start)} – ${fmtDate(u.cyc.end)} · renews ${fmtDate(u.cyc.next)}</div>
        ${meterHtml(u, c.retainer_hours)}
        ${status}
        ${bd? `<div class="breakdown">${bd}</div>`:''}
      </div>`;
    }).join('') + `</div>`;
  }
  main.innerHTML = html;
  main.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click', ()=>{
    state.clientId = el.dataset.goto; state.view='client'; render();
  }));
  main.querySelectorAll('[data-quicklog]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation(); openQuickLogModal(el.dataset.quicklog);
  }));
  main.querySelectorAll('[data-pdf-current]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const c = state.clients.find(c=>c.id===el.dataset.pdfCurrent);
    const u = clientUsage(c);
    generateClientPdf(c, { cyc:u.cyc, retainer_hours:c.retainer_hours, tasks:u.tasks });
  }));
  $('#dashSearch').addEventListener('input', e=>{
    state.dashSearch=e.target.value; renderDashboard();
    const inp=$('#dashSearch'); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  });
  $('#dashSort').addEventListener('change', e=>{ state.dashSort=e.target.value; renderDashboard(); });
  main.querySelectorAll('[data-jumptask]').forEach(el=>el.addEventListener('click', ()=> jumpToProjTask(el.dataset.jumptask)));
}

function jumpToProjTask(taskId){
  const t = state.projTasks.find(t=>t.id===taskId); if(!t) return;
  const proj = state.projects.find(p=>p.id===t.project_id); if(!proj) return;
  state.view='projects'; state.projView='project'; state.projClientId=proj.client_id; state.projProjectId=proj.id;
  render();
  openProjTaskModal(taskId, {});
}

async function renderClient(){
  const c = state.clients.find(c=>c.id===state.clientId);
  if(!c){ state.view='dashboard'; render(); return; }
  main.innerHTML = `<button class="btn ghost small back-btn" id="backBtn">← Back to dashboard</button>
    <h2>${esc(c.name)}</h2><div class="sub">Full history, grouped by renewal cycle</div>
    <div class="empty">Loading…</div>`;
  $('#backBtn').onclick = ()=>{ state.view='dashboard'; render(); };

  const [{ data: tasks, error: tErr }, { data: hist, error: hErr }] = await Promise.all([
    db.from('rs_tasks').select('*').eq('client_id', c.id).order('task_date',{ascending:false}),
    db.from('rs_client_settings_history').select('*').eq('client_id', c.id).order('effective_from',{ascending:true})
  ]);
  if(tErr){ toast('Could not load history'); console.error(tErr); return; }
  const history = (hist||[]).length ? hist : [{retainer_hours:c.retainer_hours, renewal_day:c.renewal_day, effective_from:'2000-01-01'}];
  state._clientTaskCache = tasks;

  // group tasks into cycles using whatever settings applied on each task's date
  const groups = {};
  tasks.forEach(t=>{
    const s = settingsAt(history, new Date(t.task_date+'T00:00'));
    const cyc = cycleFor(s.renewal_day, new Date(t.task_date+'T00:00'));
    const key = iso(cyc.start);
    if(!groups[key]) groups[key] = { cyc, retainer_hours:s.retainer_hours, tasks:[] };
    groups[key].tasks.push(t);
  });
  const currentKey = iso(cycleFor(c.renewal_day).start);
  const keys = Object.keys(groups).sort((a,b)=> b.localeCompare(a));

  let historyHtml = '';
  if(hErr){ /* table may not exist yet if migration v3 hasn't run */ }
  else if(history.length>1){
    const rows = history.slice().reverse().map((h,i,arr)=>{
      const prev = arr[i+1];
      const change = prev ? `— changed from ${fmtH(prev.retainer_hours)} / renews ${ordinal(prev.renewal_day)}` : '— initial setting';
      return `<div>Since <b>${fmtDateY(new Date(h.effective_from+'T00:00'))}</b>: ${fmtH(h.retainer_hours)} retainer, renews on the ${ordinal(h.renewal_day)} <span style="color:var(--muted)">${change}</span></div>`;
    }).join('');
    historyHtml = `<div class="history-list"><b style="display:block;margin-bottom:4px;color:var(--ink)">Retainer history</b>${rows}</div>`;
  }

  let html = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px">
    <button class="btn ghost small" id="backBtn">← Back to dashboard</button>
    <button class="btn small" id="quickLogBtn">+ Log task</button>
  </div>
    <h2><span class="dot" style="background:${colorFor(c)};display:inline-block;margin-right:8px"></span>${esc(c.name)}</h2>
    <div class="sub">${fmtH(c.retainer_hours)} retainer · renews on the ${ordinal(c.renewal_day)} · full history below</div>
    ${historyHtml}`;

  if(!keys.length){
    html += `<div class="empty">No tasks logged for this client yet.</div>`;
  } else {
    keys.forEach(key=>{
      const g = groups[key];
      const used = g.tasks.reduce((a,t)=>a+t.hours*t.weight_applied,0);
      const pct = g.retainer_hours>0 ? used/g.retainer_hours*100 : 0;
      const isCurrent = key===currentKey;
      const badgeCls = pct>=100?'over':pct>=75?'warn':'ok';
      const badgeText = pct>=100 ? `${Math.round(pct)}% · over` : pct>=75 ? `${Math.round(pct)}% · reaching limit` : `${Math.round(pct)}%`;
      html += `<div class="cycle-block">
        <div class="cb-head">
          <h4>${fmtDateY(g.cyc.start)} – ${fmtDateY(g.cyc.end)} ${isCurrent?'<span class="badge">(current cycle)</span>':''}</h4>
          <span style="display:flex;align-items:center;gap:10px">
            <span class="status ${badgeCls}">${fmtH(used)} of ${fmtH(g.retainer_hours)} · ${badgeText}</span>
            <button class="btn small ghost" data-pdf="${key}">PDF</button>
          </span>
        </div>
        <div class="card" style="padding:8px 12px">
          <table><thead><tr><th>Date</th><th>Member</th><th>Task</th><th style="text-align:right">Hours</th><th style="text-align:right">Weighted</th></tr></thead>
          <tbody>${g.tasks.map(t=>{
            const m = state.members.find(m=>m.id===t.member_id);
            return `<tr class="task-row" data-task="${t.id}">
              <td>${fmtDate(new Date(t.task_date+'T00:00'))}</td>
              <td>${avatarWithName(m)}</td>
              <td>${esc(t.description||'')}${t.notes? '<span class="note-dot">●</span>':''}</td>
              <td style="text-align:right">${fmtH(t.hours)}</td>
              <td style="text-align:right"><b>${fmtH(t.hours*t.weight_applied)}</b></td>
            </tr>`;
          }).join('')}</tbody></table>
        </div>
      </div>`;
    });
  }
  main.innerHTML = html;
  $('#backBtn').onclick = ()=>{ state.view='dashboard'; render(); };
  $('#quickLogBtn').onclick = ()=> openQuickLogModal(c.id);
  main.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('click', ()=>openTaskModal(el.dataset.task)));
  main.querySelectorAll('[data-pdf]').forEach(el=>el.addEventListener('click', ()=> generateClientPdf(c, groups[el.dataset.pdf])));
}

/* ================= Project Overview ================= */
function renderProjects(){
  if(state.projView==='project') renderProjDetail();
  else if(state.projView==='clientProjects') renderProjClientProjects();
  else renderProjClients();
}

function renderMilestones(){
  if(!state.milestoneMonth) state.milestoneMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const m0 = state.milestoneMonth;
  const y = m0.getFullYear(), mo = m0.getMonth();
  const first = new Date(y, mo, 1);
  const startPad = (first.getDay()+6)%7;
  const daysIn = new Date(y, mo+1, 0).getDate();
  const todayIso = iso(new Date());
  const clients = state.clients.filter(c=>c.active && state.projects.some(p=>p.client_id===c.id));
  const byDay = {};
  state.stages.filter(s=>s.due_date).forEach(s=>{
    const proj = state.projects.find(p=>p.id===s.project_id);
    if(!proj || state.milestoneHidden.has(proj.client_id)) return;
    (byDay[s.due_date]=byDay[s.due_date]||[]).push({s,proj});
  });

  let cells = '';
  for(let i=0;i<startPad;i++) cells += `<div class="day blank"></div>`;
  for(let d=1;d<=daysIn;d++){
    const dIso = iso(new Date(y,mo,d));
    const list = byDay[dIso]||[];
    const chips = list.map(({s,proj})=>{
      const cl = state.clients.find(c=>c.id===proj.client_id);
      return `<div class="task-chip" data-milestone="${s.id}" style="background:${cl?colorFor(cl):'#999'}" title="${esc(proj.name)} — ${esc(s.name)}">${esc(proj.name)} · ${esc(s.name)}</div>`;
    }).join('');
    cells += `<div class="day ${dIso===todayIso?'today':''}"><div class="num">${d}</div>${chips}</div>`;
  }

  main.innerHTML = `
    <h2>Milestones</h2><div class="sub">Stage due dates across every project · click one to jump to that project</div>
    <div class="cal-filters">
      ${clients.map(c=>`<button class="filter-pill ${state.milestoneHidden.has(c.id)?'off':''}" data-mtoggle="${c.id}"><span class="dot" style="background:${colorFor(c)}"></span>${esc(c.name)}</button>`).join('')}
      ${clients.length? `<button class="filter-pill" id="mAll">Show all</button>`:''}
    </div>
    <div class="cal-head">
      <button class="btn ghost small" id="mPrev">←</button>
      <h3>${m0.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3>
      <button class="btn ghost small" id="mNext">→</button>
      <button class="btn ghost small" id="mToday">Today</button>
    </div>
    <div class="cal">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>`;

  $('#mPrev').onclick = ()=>{ state.milestoneMonth = new Date(y, mo-1, 1); renderMilestones(); };
  $('#mNext').onclick = ()=>{ state.milestoneMonth = new Date(y, mo+1, 1); renderMilestones(); };
  $('#mToday').onclick = ()=>{ state.milestoneMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); renderMilestones(); };
  if($('#mAll')) $('#mAll').onclick = ()=>{ state.milestoneHidden.clear(); renderMilestones(); };
  main.querySelectorAll('[data-mtoggle]').forEach(el=>el.addEventListener('click', ()=>{
    const id=el.dataset.mtoggle; state.milestoneHidden.has(id)? state.milestoneHidden.delete(id): state.milestoneHidden.add(id); renderMilestones();
  }));
  main.querySelectorAll('[data-milestone]').forEach(el=>el.addEventListener('click', ()=>{
    const s = state.stages.find(s=>s.id===el.dataset.milestone);
    const proj = state.projects.find(p=>p.id===s.project_id);
    if(!proj) return;
    state.view='projects'; state.projView='project'; state.projClientId=proj.client_id; state.projProjectId=proj.id;
    render();
  }));
}

function renderProjClients(){
  const clients = state.clients.filter(c=>c.active);
  let html = `<h2>Project Overview</h2><div class="sub">All client work — branding, animation, decks and retainer projects in one place</div>`;
  if(!clients.length){
    html += `<div class="empty">No clients yet — add one under <b>Settings</b>.</div>`;
  } else {
    html += `<div class="grid">` + clients.map(c=>{
      const projects = state.projects.filter(p=>p.client_id===c.id && p.active);
      return `<div class="card client-card" data-projgoto="${c.id}">
        <h3><span class="dot" style="background:${colorFor(c)}"></span>${esc(c.name)}${c.is_retainer?'<span class="retainer-badge">Retainer</span>':''}</h3>
        <div class="cycle">${projects.length} active project${projects.length===1?'':'s'}</div>
      </div>`;
    }).join('') + `</div>`;
  }
  main.innerHTML = html;
  main.querySelectorAll('[data-projgoto]').forEach(el=>el.addEventListener('click', ()=>{
    state.projClientId = el.dataset.projgoto; state.projView='clientProjects'; render();

}

        <h3>${esc(p.name)}${p.active?'':' (archived)'}</h3>
        <div class="cycle"><span class="type-badge">${esc(p.project_type)}</span>${p.label?`<span class="label-chip">${esc(p.label)}</span>`:''}</div>
        <div class="breakdown" style="border-top:none;padding-top:0;margin-top:10px">

    if(!link || !link.trim()) return;
    const { error } = await db.from('rs_clients').update({ miro_link: link.trim() }).eq('id', c.id);
    if(error){ toast('Could not save link'); return; }
    await refreshProjectView();
  };
  main.querySelectorAll('[data-projdetail]').forEach(el=>el.addEventListener('click', ()=>{
    state.projProjectId = el.dataset.projdetail; state.projView='project'; render();
  }));

function renderProjDetail(){
  const p = state.projects.find(p=>p.id===state.projProjectId);
  if(!p){ state.projView='clientProjects'; render(); return; }
  const c = state.clients.find(c=>c.id===p.client_id);
  const stages = state.stages.filter(s=>s.project_id===p.id).sort((a,b)=>a.position-b.position);
  const visibleCount = 1 + TASK_COLUMNS.filter(([k])=>state.taskCols.has(k)).length;
  const todayIso = iso(new Date());

  let html = `<div class="breadcrumb">
      <button data-bc="clients">Project Overview</button><span class="sep">/</span>
      <button data-bc="client">${esc(c.name)}</button><span class="sep">/</span>
      <span class="current">${esc(p.name)}</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px">
      <h2>${esc(p.name)}</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${(p.miro_link||c.miro_link)? `<a class="btn small ghost" href="${esc(p.miro_link||c.miro_link)}" target="_blank" rel="noopener">Miro board ↗</a>`:''}
        <button class="btn small ghost" id="discordBtn">Share to Discord</button>
        <button class="btn small ghost" id="editProjectBtn">Edit project</button>
        <button class="btn small" id="addStageBtn">+ Add stage</button>
      </div>
    </div>
    <div class="sub"><span class="type-badge">${esc(p.project_type)}</span>${p.label?`<span class="label-chip">${esc(p.label)}</span>`:''}${c.is_retainer?'':' · not a retainer client — retainer syncing is off'}</div>
    <div class="col-toggles">
      ${TASK_COLUMNS.map(([key,label])=>`<button class="filter-pill ${state.taskCols.has(key)?'':'off'}" data-colkey="${key}">${label}</button>`).join('')}
    </div>`;

  if(!stages.length){
    html += `<div class="empty">No stages yet — click "Add stage" to get started.</div>`;
  } else {
    stages.forEach((s,idx)=>{
      const tasks = state.projTasks.filter(t=>t.stage_id===s.id);
      const overdue = s.due_date && s.due_date < todayIso;
      html += `<div class="stage-section">
        <div class="stage-head">
          <h4>${esc(s.name)}${s.due_date?` <span style="font-weight:400;font-size:12px;color:${overdue?'var(--red)':'var(--muted)'}">· due ${fmtDate(new Date(s.due_date+'T00:00'))}${overdue?' (overdue)':''}</span>`:''}</h4>
          <span class="count">${tasks.length} task${tasks.length===1?'':'s'}</span>
          <span class="stage-actions">
            <button class="btn small ghost" data-stagemove="${s.id}:up" ${idx===0?'disabled':''}>↑</button>
            <button class="btn small ghost" data-stagemove="${s.id}:down" ${idx===stages.length-1?'disabled':''}>↓</button>
            <button class="btn small ghost" data-stageedit="${s.id}">Edit</button>
            <button class="btn small" data-addtask="${s.id}">+ Task</button>
          </span>
        </div>
        <div class="card" style="padding:8px 12px">
          <table><thead><tr>
            <th>Task</th>
            ${state.taskCols.has('priority')?'<th>Priority</th>':''}
            ${state.taskCols.has('designer')?'<th>Designer</th>':''}
            ${state.taskCols.has('reviewer')?'<th>Reviewer</th>':''}
            ${state.taskCols.has('hours')?'<th style="text-align:right">Hours</th>':''}
            ${state.taskCols.has('due')?'<th>Due</th>':''}
            ${state.taskCols.has('retainer')?'<th style="text-align:center">Retainer</th>':''}
          </tr></thead><tbody>
          ${tasks.map(t=>{
            let retainerCell = '—';
            if(t.counts_toward_retainer){
              retainerCell = (t.retainer_task_ids && t.retainer_task_ids.length)
                ? '<span class="retainer-tick">✓</span>'
                : '<span style="color:var(--amber);font-weight:700" title="Ticked, but not syncing yet — check hours and designer">⚠</span>';
            }
            return `<tr class="task-row" data-projtask="${t.id}">
              <td>${esc(t.title)}</td>
              ${state.taskCols.has('priority')?`<td><span class="priority-pill priority-${(t.priority||'Medium').toLowerCase()}">${esc(t.priority||'Medium')}</span></td>`:''}
              ${state.taskCols.has('designer')?`<td>${avatarGroupHtml(t.assigned_designer_ids)}</td>`:''}
              ${state.taskCols.has('reviewer')?`<td>${avatarGroupHtml(t.assigned_reviewer_ids)}</td>`:''}
              ${state.taskCols.has('hours')?`<td style="text-align:right">${t.recorded_hours!=null?fmtH(t.recorded_hours):'—'}</td>`:''}
              ${state.taskCols.has('due')?`<td>${t.due_date? fmtDate(new Date(t.due_date+'T00:00')):'—'}</td>`:''}
              ${state.taskCols.has('retainer')?`<td style="text-align:center">${retainerCell}</td>`:''}
            </tr>`;
          }).join('') || `<tr><td colspan="${visibleCount}" class="empty">No tasks in this stage yet.</td></tr>`}
          </tbody></table>
        </div>
      </div>`;
    });
  }
  main.innerHTML = html;
  $('[data-bc="clients"]').onclick = ()=>{ state.projView='clients'; render(); };
  $('[data-bc="client"]').onclick = ()=>{ state.projView='clientProjects'; render(); };
  $('#editProjectBtn').onclick = ()=> openProjectModal(p.id, p.client_id);
  $('#discordBtn').onclick = ()=> openDiscordModal(p.id);
  $('#addStageBtn').onclick = ()=> openStageModal(p.id, null);
  main.querySelectorAll('[data-colkey]').forEach(el=>el.addEventListener('click', ()=>{
    const k = el.dataset.colkey;
    state.taskCols.has(k)? state.taskCols.delete(k): state.taskCols.add(k);
    renderProjDetail();
  }));
  main.querySelectorAll('[data-addtask]').forEach(el=>el.addEventListener('click', ()=> openProjTaskModal(null, { projectId:p.id, stageId:el.dataset.addtask })));
  main.querySelectorAll('[data-projtask]').forEach(el=>el.addEventListener('click', ()=> openProjTaskModal(el.dataset.projtask, {})));
  main.querySelectorAll('[data-stageedit]').forEach(el=>el.addEventListener('click', ()=> openStageModal(p.id, el.dataset.stageedit)));
  main.querySelectorAll('[data-stagemove]').forEach(el=>el.addEventListener('click', async ()=>{
    const [id,dir] = el.dataset.stagemove.split(':');
    const idx = stages.findIndex(s=>s.id===id);
    const swapIdx = dir==='up'? idx-1 : idx+1;
    if(swapIdx<0 || swapIdx>=stages.length) return;
    const a = stages[idx], b = stages[swapIdx];
    await Promise.all([
      db.from('rs_project_stages').update({position:b.position}).eq('id',a.id),
      db.from('rs_project_stages').update({position:a.position}).eq('id',b.id)
    ]);
    await refreshProjectView();
  }));
}

function projExtraFieldHtml(type, details){
  details = details || {};
  if(type==='Website') return `<div><label>Number of pages</label><input type="number" min="1" id="pj_extra" value="${details.pages||''}"></div>`;
  if(type==='Branding') return `<div><label>Scope</label><select id="pj_extra">${BRANDING_SCOPES.map(s=>`<option value="${s}" ${details.scope===s?'selected':''}>${s}</option>`).join('')}</select></div>`;
  if(type==='Animations') return `<div><label>Length (seconds)</label><input type="number" min="1" id="pj_extra" value="${details.seconds||''}"></div>`;
  if(type==='Deck projects') return `<div><label>Number of slides</label><input type="number" min="1" id="pj_extra" value="${details.slides||''}"></div>`;
  return '<div></div>';
}
function projExtraFieldValue(type){
  const el = document.getElementById('pj_extra');
  if(!el) return {};
  if(type==='Website') return { pages: el.value?+el.value:null };
  if(type==='Branding') return { scope: el.value || null };
  if(type==='Animations') return { seconds: el.value?+el.value:null };
  if(type==='Deck projects') return { slides: el.value?+el.value:null };
  return {};
}

function openProjectModal(projectId, clientId){
  const isNew = !projectId;
  const p = isNew ? null : state.projects.find(p=>p.id===projectId);
  const client = state.clients.find(c=>c.id=== (p? p.client_id : clientId));
  const initialType = p ? p.project_type : PROJECT_TYPES[0];
  showModal(`
    <h3>${isNew?'New project':'Edit project'}</h3>
    <div class="sub">${esc(client.name)}</div>
    <form class="log" style="max-width:none">
      <div class="full"><label>Project name</label><input type="text" id="pj_name" value="${esc(p?p.name:'')}" placeholder="e.g. Homepage redesign"></div>
      <div><label>Type</label><select id="pj_type">${PROJECT_TYPES.map(t=>`<option value="${t}" ${p&&p.project_type===t?'selected':''}>${t}</option>`).join('')}<option value="Other" ${p && !PROJECT_TYPES.includes(p.project_type)?'selected':''}>Other</option></select></div>
      <div id="pj_extra_wrap">${projExtraFieldHtml(initialType, p&&p.details)}</div>
      <div><label>Label <span style="color:var(--muted);font-weight:400">(optional)</span></label><input type="text" id="pj_label" value="${esc(p&&p.label?p.label:'')}" placeholder="e.g. Rush, Q3"></div>
      <div class="full"><label>Miro link <span style="color:var(--muted);font-weight:400">(optional)</span></label><input type="url" id="pj_miro" value="${esc(p&&p.miro_link?p.miro_link:'')}" placeholder="https://miro.com/..."></div>
    </form>
    <div class="modal-actions">
      ${!isNew? `<button class="btn ghost" id="pj_archive">${p.active?'Archive':'Restore'}</button>`:'<span></span>'}
      <div class="right">
        <button class="btn ghost" id="pj_cancel">Cancel</button>
        <button class="btn" id="pj_save">${isNew?'Create project':'Save changes'}</button>
      </div>
    </div>
  `);
  $('#pj_type').addEventListener('change', e=>{ $('#pj_extra_wrap').innerHTML = projExtraFieldHtml(e.target.value, {}); });
  $('#pj_cancel').onclick = closeModal;
  if(!isNew) $('#pj_archive').onclick = async ()=>{
    await db.from('rs_projects').update({active:!p.active}).eq('id',p.id);
    closeModal(); toast(p.active?'Project archived':'Project restored'); await refreshProjectView();
  };
  $('#pj_save').onclick = async ()=>{
    const name = $('#pj_name').value.trim();
    if(!name){ toast('Give the project a name'); return; }
    const project_type = $('#pj_type').value;
    const label = $('#pj_label').value.trim() || null;
    const miro_link = $('#pj_miro').value.trim() || null;
    const details = projExtraFieldValue(project_type);
    if(isNew){
      const { data, error } = await db.from('rs_projects').insert({ client_id:client.id, name, project_type, label, miro_link, details }).select().single();
      if(error){ toast('Could not create project'); console.error(error); return; }
      const template = STAGE_TEMPLATES[project_type] || STAGE_TEMPLATES.default;
      await Promise.all(template.map((sName,i)=>db.from('rs_project_stages').insert({ project_id:data.id, name:sName, position:i })));
      closeModal(); toast('Project created');
      state.projProjectId = data.id; state.projView = 'project';
      await refreshProjectView();
    } else {
      const { error } = await db.from('rs_projects').update({ name, project_type, label, miro_link, details }).eq('id', p.id);
      if(error){ toast('Could not save'); console.error(error); return; }
      closeModal(); toast('Project updated'); await refreshProjectView();
    }
  };
}

async function syncProjTaskRetainer(pt, project, client){
  const existingIds = pt.retainer_task_ids || [];
  const designers = state.members.filter(m => (pt.assigned_designer_ids||[]).includes(m.id));
  const wantsSync = pt.counts_toward_retainer && client && client.is_retainer && designers.length && pt.recorded_hours>0 && pt.work_date;

  if(!wantsSync){
    if(existingIds.length) await Promise.all(existingIds.map(id=>db.from('rs_tasks').delete().eq('id',id)));
    if(pt.counts_toward_retainer && (!client || !client.is_retainer)) toast("This client isn't marked as a retainer client — turn that on in Settings first");
    else if(pt.counts_toward_retainer) toast('Assign a designer, recorded hours, and a work date to sync this to the retainer dashboard');
    return [];
  }

  // simplest reliable approach: clear old synced rows, recreate one per designer
  if(existingIds.length) await Promise.all(existingIds.map(id=>db.from('rs_tasks').delete().eq('id',id)));
  const perDesignerHours = pt.recorded_hours / designers.length;
  const newIds = [];
  for(const d of designers){
    const { data, error } = await db.from('rs_tasks').insert({
      client_id: client.id, member_id: d.id, task_date: pt.work_date, hours: perDesignerHours,
      description: `${project.name} — ${pt.title}`, weight_applied: d.weight
    }).select().single();
    if(error){ console.error(error); toast('Retainer sync failed for '+d.name); }
    else newIds.push(data.id);
  }
  return newIds;
}

function buildDiscordCard(project){
  const c = state.clients.find(c=>c.id===project.client_id);
  const stages = state.stages.filter(s=>s.project_id===project.id).sort((a,b)=>a.position-b.position);
  const tasks = state.projTasks.filter(t=>t.project_id===project.id);
  const counts = {Low:0,Medium:0,High:0,Urgent:0};
  tasks.forEach(t=>{ const pr=t.priority||'Medium'; counts[pr]=(counts[pr]||0)+1; });
  const today = iso(new Date());
  const lines = [];
  lines.push(`**${project.name}** — ${c.name}`);
  let typeLine = `Type: ${project.project_type}`;
  const d = project.details||{};
  if(project.project_type==='Website' && d.pages) typeLine += ` · ${d.pages} pages`;
  if(project.project_type==='Branding' && d.scope) typeLine += ` (${d.scope})`;
  if(project.project_type==='Animations' && d.seconds) typeLine += ` · ${d.seconds}s`;
  if(project.project_type==='Deck projects' && d.slides) typeLine += ` · ${d.slides} slides`;
  if(project.label) typeLine += ` · 🏷️ ${project.label}`;
  lines.push(typeLine);
  lines.push(`📋 ${tasks.length} task${tasks.length===1?'':'s'} across ${stages.length} stage${stages.length===1?'':'s'}`);
  const nextDue = stages.filter(s=>s.due_date && s.due_date>=today).sort((a,b)=>a.due_date.localeCompare(b.due_date))[0];
  if(nextDue) lines.push(`📅 Next due: **${nextDue.name}** — ${fmtDateY(new Date(nextDue.due_date+'T00:00'))}`);
  const miro = project.miro_link || c.miro_link;
  if(miro) lines.push(`🔗 Miro: ${miro}`);
  lines.push('');
  lines.push('**Stages**');
  stages.forEach(s=>{
    const stTasks = tasks.filter(t=>t.stage_id===s.id);
    const icon = s.due_date && s.due_date < today ? '⚠️' : '▫️';
    lines.push(`${icon} ${s.name}${s.due_date? ` — due ${fmtDate(new Date(s.due_date+'T00:00'))}`:''} (${stTasks.length})`);
  });
  lines.push('');
  lines.push(`**Priorities:** ${counts.Urgent} urgent · ${counts.High} high · ${counts.Medium} medium · ${counts.Low} low`);
  return lines.join('\n');
}

function openDiscordModal(projectId){
  const project = state.projects.find(p=>p.id===projectId);

  showModal(`

function renderCalendar(){
  if (!state.calMonth) state.calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const m0 = state.calMonth;
  const y = m0.getFullYear(), mo = m0.getMonth();
  const first = new Date(y, mo, 1);
  const startPad = (first.getDay()+6)%7;
  const daysIn = new Date(y, mo+1, 0).getDate();
  const todayIso = iso(new Date());
  const activeClients = state.clients.filter(c=>c.active && c.is_retainer);
  const byDay = {};
  state.tasks.forEach(t=>{ if(state.calHidden.has(t.client_id)) return; (byDay[t.task_date]=byDay[t.task_date]||[]).push(t); });
  const renewByDay = {};
  activeClients.forEach(c=>{
    if(state.calHidden.has(c.id)) return;
    if(c.renewal_day<=daysIn){ const dIso = iso(new Date(y,mo,c.renewal_day)); (renewByDay[dIso]=renewByDay[dIso]||[]).push(c); }
  });

  let cells = '';
  for(let i=0;i<startPad;i++) cells += `<div class="day blank"></div>`;
  for(let d=1;d<=daysIn;d++){
    const dIso = iso(new Date(y,mo,d));
    const list = (byDay[dIso]||[]);
    const renews = (renewByDay[dIso]||[]);
    const chips = renews.map(c=>`<div class="renew-chip" data-goto="${c.id}">↻ ${esc(c.name)} renews</div>`).join('')
      + list.slice(0,3).map(t=>{
        const c = state.clients.find(c=>c.id===t.client_id);
        return `<div class="task-chip" draggable="true" data-task="${t.id}" style="background:${c?colorFor(c):'#999'}" title="${esc(t.description||'')} — drag to another day to reschedule">${esc(c?c.name:'?')} · ${fmtH(t.hours*t.weight_applied)}</div>`;
      }).join('') + (list.length>3? `<div style="color:var(--muted)">+${list.length-3} more</div>`:'');
    cells += `<div class="day ${dIso===todayIso?'today':''}" data-date="${dIso}"><div class="num">${d}</div>${chips}</div>`;
  }

  main.innerHTML = `
    <h2>Calendar</h2><div class="sub">Weighted hours per task · renewal dates marked automatically · click a day to log time, or a task to edit it</div>
    <div class="cal-filters" id="calFilters">
      ${activeClients.map(c=>`<button class="filter-pill ${state.calHidden.has(c.id)?'off':''}" data-toggle="${c.id}"><span class="dot" style="background:${colorFor(c)}"></span>${esc(c.name)}</button>`).join('')}
      ${activeClients.length? `<button class="filter-pill" id="calAll">Show all</button>`:''}
    </div>
    <div class="cal-head">
      <button class="btn ghost small" id="calPrev">←</button>
      <h3>${m0.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3>
      <button class="btn ghost small" id="calNext">→</button>
      <button class="btn ghost small" id="calToday">Today</button>
    </div>
    <div class="cal">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>`;

  $('#calPrev').onclick = ()=>{ state.calMonth = new Date(y, mo-1, 1); renderCalendar(); };
  $('#calNext').onclick = ()=>{ state.calMonth = new Date(y, mo+1, 1); renderCalendar(); };
  $('#calToday').onclick = ()=>{ state.calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); renderCalendar(); };
  if($('#calAll')) $('#calAll').onclick = ()=>{ state.calHidden.clear(); renderCalendar(); };
  main.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click', ()=>{
    const id=b.dataset.toggle; state.calHidden.has(id)? state.calHidden.delete(id): state.calHidden.add(id); renderCalendar();
  }));
  main.querySelectorAll('.day[data-date]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest('[data-task]') || e.target.closest('[data-goto]')) return;
    state.logDate = el.dataset.date; state.view='log'; render();
  }));
  main.querySelectorAll('.task-chip[data-task]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); openTaskModal(el.dataset.task); });
    el.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', el.dataset.task);
      e.dataTransfer.effectAllowed = 'move';
    });
  });
  main.querySelectorAll('.renew-chip[data-goto]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); state.clientId=el.dataset.goto; state.view='client'; render(); }));
  main.querySelectorAll('.day[data-date]').forEach(dayEl=>{
    dayEl.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; dayEl.classList.add('drop-target'); });
    dayEl.addEventListener('dragleave', ()=> dayEl.classList.remove('drop-target'));
    dayEl.addEventListener('drop', async e=>{
      e.preventDefault(); dayEl.classList.remove('drop-target');
      const taskId = e.dataTransfer.getData('text/plain');
      const newDate = dayEl.dataset.date;
      if(!taskId || !newDate) return;
      const t = state.tasks.find(t=>t.id===taskId);
      if(t && t.task_date===newDate) return;
      const { error } = await db.from('rs_tasks').update({ task_date:newDate }).eq('id', taskId);
      if(error){ toast('Could not move task'); console.error(error); return; }
      toast(`Moved to ${fmtDate(new Date(newDate+'T00:00'))}`);
      await loadAll();
    });
  });
}

  main.innerHTML = `
    <h2>Settings</h2><div class="sub">Clients, retainers and team weighting</div>
    <div class="settings-cols">
      <div class="card">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:10px">Clients</h3>
        <table><thead><tr><th></th><th>Name</th><th>Retainer</th><th>Renews on</th><th></th></tr></thead><tbody>
        ${state.clients.map(c=>`<tr style="${c.active?'':'opacity:.45'}">
          <td><span class="swatch" style="background:${colorFor(c)}"></span></td>
          <td>${esc(c.name)}${c.is_retainer?'<span class="retainer-badge">Retainer</span>':''}</td>
          <td>${c.is_retainer? fmtH(c.retainer_hours) : '<span style="color:var(--muted)">—</span>'}</td>
          <td>${c.is_retainer? ordinal(c.renewal_day) : '<span style="color:var(--muted)">—</span>'}</td>
          <td class="action-cell">
            <button class="btn small ghost" data-cedit="${c.id}">Edit</button>
            <button class="btn small ghost" data-cactive="${c.id}">${c.active?'Archive':'Restore'}</button>
            ${!c.active? `<button class="btn small danger" data-cdelete="${c.id}">Delete</button>`:''}
          </td>
        </tr>`).join('') || '<tr><td colspan="5" class="empty">No clients yet.</td></tr>'}
        </tbody></table>
        <div class="row-form">
          <input type="color" id="c_color" value="${PALETTE[state.clients.length%PALETTE.length]}" title="Dot colour">
          <input id="c_name" placeholder="Client name" style="flex:2">
          <input type="url" id="c_miro" placeholder="Miro link (optional)" style="flex:1 1 160px">
          <label style="display:flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap"><input type="checkbox" id="c_isretainer" checked style="width:auto">On retainer</label>
          <span id="c_retainer_fields" style="display:flex;gap:8px;flex:1 1 260px">
          <select id="c_days">
            <optgroup label="Per month">
              <option value="8">1 day/mo (8h)</option>
              <option value="16">2 days/mo (16h)</option>
              <option value="24">3 days/mo (24h)</option>
              <option value="32">4 days/mo (32h)</option>
            </optgroup>
            <optgroup label="Per week">
              <option value="34.7">1 day/week (~34.7h/mo)</option>
              <option value="69.3">2 days/week (~69.3h/mo)</option>
              <option value="104">3 days/week (~104h/mo)</option>
            </optgroup>
          </select>
          <select id="c_renew">${Array.from({length:28},(_,i)=>`<option value="${i+1}">Renews ${i+1}</option>`).join('')}</select>
          </span>
          <button class="btn small" id="c_add">Add</button>
        </div>
      </div>

      <div class="card">
        <h3 style="font-size:15px;font-weight:600;margin-bottom:10px">Team members</h3>
        <table><thead><tr><th>Name</th><th>Factor</th><th></th></tr></thead><tbody>
        ${state.members.map(m=>`<tr style="${m.active?'':'opacity:.45'}">
          <td>${esc(m.name)}</td>
          <td>×${m.weight}</td>
          <td class="action-cell">
            <button class="btn small ghost" data-mweight="${m.id}">Change factor</button>
            <button class="btn small ghost" data-mactive="${m.id}">${m.active?'Archive':'Restore'}</button>
            ${!m.active? `<button class="btn small danger" data-mdelete="${m.id}">Delete</button>`:''}
          </td>
        </tr>`).join('') || '<tr><td colspan="3" class="empty">No team members yet.</td></tr>'}
        </tbody></table>
        <div class="row-form">
          <input id="m_name" placeholder="Name" style="flex:2">
          <input id="m_weight" type="number" step="0.25" min="0.25" value="1" title="Weighting factor">
          <button class="btn small" id="m_add">Add</button>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:10px">Factor multiplies logged hours, e.g. ×2 turns 4 real hours into 8 retainer hours. Archive a client or member before you can delete it — archiving hides it from logging without losing history.</div>
      </div>
    </div>

    <div class="card" style="margin-top:22px">
      <h3 style="font-size:15px;font-weight:600;margin-bottom:6px">Data & backups</h3>
      <div class="sub" style="margin-bottom:14px">Export everything currently in Supabase — good for a periodic backup, or before making big changes.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn small" id="exportJson">Export full backup (JSON)</button>
        <button class="btn small ghost" id="exportCsv">Export tasks (CSV)</button>
      </div>
    </div>`;

  $('#c_isretainer').addEventListener('change', e=>{ $('#c_retainer_fields').style.display = e.target.checked?'flex':'none'; });
  $('#c_add').onclick = async ()=>{
    const name = $('#c_name').value.trim(); if(!name){ toast('Client needs a name'); return; }
    const is_retainer = $('#c_isretainer').checked;
    const retainer_hours = is_retainer ? +$('#c_days').value : null;
    const renewal_day = is_retainer ? +$('#c_renew').value : null;
    const color = $('#c_color').value;
    const miro_link = $('#c_miro').value.trim() || null;
    const { data, error } = await db.from('rs_clients').insert({ name, retainer_hours, renewal_day, color, is_retainer, miro_link }).select().single();
    if(error){ toast('Could not add client'); console.error(error); return; }
    if(is_retainer) await db.from('rs_client_settings_history').insert({ client_id:data.id, retainer_hours, renewal_day, effective_from:'2000-01-01' });
    await loadAll();
  };
  $('#m_add').onclick = async ()=>{
    const name = $('#m_name').value.trim(); const w = parseFloat($('#m_weight').value);
    if(!name || !(w>0)){ toast('Name and a positive factor needed'); return; }
    const { error } = await db.from('rs_members').insert({ name, weight:w });
    if(error){ toast('Could not add member'); return; } await loadAll();
  };
  main.querySelectorAll('[data-cedit]').forEach(b=>b.onclick = ()=> openClientEditModal(b.dataset.cedit));
  main.querySelectorAll('[data-cactive]').forEach(b=>b.onclick = async ()=>{
    const c = state.clients.find(c=>c.id===b.dataset.cactive);
    await db.from('rs_clients').update({active:!c.active}).eq('id',c.id); await loadAll();
  });
  main.querySelectorAll('[data-mactive]').forEach(b=>b.onclick = async ()=>{
    const m = state.members.find(m=>m.id===b.dataset.mactive);
    await db.from('rs_members').update({active:!m.active}).eq('id',m.id); await loadAll();
  });
  main.querySelectorAll('[data-mweight]').forEach(b=>b.onclick = async ()=>{
    const m = state.members.find(m=>m.id===b.dataset.mweight);
    const v = prompt(`New weighting factor for ${m.name}`, m.weight);
    const w = parseFloat(v); if(!(w>0)) return;
    await db.from('rs_members').update({weight:w}).eq('id',m.id); await loadAll();
  });
  main.querySelectorAll('[data-cdelete]').forEach(b=>b.onclick = async ()=>{
    const c = state.clients.find(c=>c.id===b.dataset.cdelete);
    if(!confirm(`Permanently delete ${c.name}? This also deletes all of their logged tasks. This cannot be undone.`)) return;
    const { error } = await db.from('rs_clients').delete().eq('id', c.id);
    if(error){ toast('Delete failed'); return; } toast('Client deleted'); await loadAll();
  });
  main.querySelectorAll('[data-mdelete]').forEach(b=>b.onclick = async ()=>{
    const m = state.members.find(m=>m.id===b.dataset.mdelete);
    if(!confirm(`Permanently delete ${m.name}? Their past tasks will be kept but unassigned. This cannot be undone.`)) return;
    const { error } = await db.from('rs_members').delete().eq('id', m.id);
    if(error){ toast('Delete failed'); return; } toast('Member deleted'); await loadAll();
  });
  $('#exportJson').onclick = exportAllData;
  $('#exportCsv').onclick = exportTasksCsv;
}

/* ---------- setup / boot ---------- */
function showSetup(){
  main.innerHTML = `
    <div class="setup">
      <h2>Connect to Supabase</h2>
      <p>Paste your project URL and anon key (Project settings → API). They'll be remembered in this browser. Run <b>retainer-tracker-setup.sql</b> first, then <b>retainer-tracker-migration-v3.sql</b> (covers all updates so far) in the SQL editor.</p>
      <label>Project URL</label><input id="s_url" placeholder="https://xxxx.supabase.co">
      <label>Anon key</label><input id="s_key" placeholder="eyJ…">
      <button class="btn" id="s_go">Connect</button>
    </div>`;
  $('#s_go').onclick = ()=>{
    const url = $('#s_url').value.trim(), key = $('#s_key').value.trim();
    if(!url.startsWith('http') || !key){ toast('Both fields needed'); return; }
    store.set('rs_rt_url', url); store.set('rs_rt_key', key);
    boot();
  };
}

async function boot(){
  const url = SUPABASE_URL || store.get('rs_rt_url');
  const key = SUPABASE_ANON_KEY || store.get('rs_rt_key');
  if(!url || !key){ showSetup(); return; }
  db = supabase.createClient(url, key);
  $('#nav').style.display = 'flex';
  document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click', ()=>{ state.view=b.dataset.view; render(); }));
  await loadAll();
}
boot();
</script>
</body>
</html>
