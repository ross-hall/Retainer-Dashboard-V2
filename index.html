      if(error){ toast('Could not save date'); return; }
      await refreshProjectView();
    }, { withTime:true, currentTime:s.due_time });
  }));
  // Renaming writes straight to rs_project_stages.name — the same field/row
  // the public dashboard reads (pdStageAccordionHtml), so a rename here
  // shows up there on its next load with no separate sync step.
  main.querySelectorAll('[data-stagename]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const stageId = el.dataset.stagename;
    const original = el.textContent;
    const input = document.createElement('input');
    input.type = 'text'; input.value = original; input.className = 'inline-rename-input';
    el.replaceWith(input); input.focus(); input.select();
    input.addEventListener('click', ev=> ev.stopPropagation());
    input.addEventListener('keydown', ev=>{
      if(ev.key==='Enter') input.blur();
      if(ev.key==='Escape'){ input.dataset.cancel='1'; input.blur(); }
    });
    input.addEventListener('blur', async ()=>{
      const val = input.value.trim();
      if(input.dataset.cancel || !val || val===original){ input.replaceWith(el); return; }
      const { error } = await db.from('rs_project_stages').update({ name: val }).eq('id', stageId);
      if(error){ toast('Could not rename stage'); input.replaceWith(el); return; }
      toast('Stage renamed');
      await refreshProjectView();
    }, { once:true });
  }));
  // New stage appends at the end (position = current stage count) — same
  // rs_project_stages table the public dashboard reads, so it appears there
  // immediately too, no separate sync step needed.
  const addStageBtn = $('#addStageBtn');
  if(addStageBtn) addStageBtn.onclick = async ()=>{
    const name = prompt('New stage name');
    if(!name || !name.trim()) return;
    const { error } = await db.from('rs_project_stages').insert({ project_id:p.id, name:name.trim(), position:stages.length });
    if(error){ toast('Could not add stage'); return; }
    toast('Stage added'); await refreshProjectView();
  };

  // drag-and-drop task reordering, scoped per stage
  main.querySelectorAll('[data-stagesection]').forEach(sectionEl=>{
    const stageId = sectionEl.dataset.stagesection;
    const stageTasks = state.projTasks.filter(t=>t.stage_id===stageId).sort((a,b)=>(a.position||0)-(b.position||0));
    sectionEl.querySelectorAll('.task-row[data-projtask]').forEach(row=>{
      row.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', row.dataset.projtask); e.dataTransfer.effectAllowed='move'; });
      row.addEventListener('dragover', e=>{ e.preventDefault(); row.classList.add('drop-target-row'); });
      row.addEventListener('dragleave', ()=> row.classList.remove('drop-target-row'));
      row.addEventListener('drop', async e=>{
        e.preventDefault(); row.classList.remove('drop-target-row');
        const draggedId = e.dataTransfer.getData('text/plain');
        const targetId = row.dataset.projtask;
        if(!draggedId || draggedId===targetId) return;
        const order = stageTasks.slice();
        const fromIdx = order.findIndex(t=>t.id===draggedId);
        const toIdx = order.findIndex(t=>t.id===targetId);
        if(fromIdx<0 || toIdx<0) return;
        const [moved] = order.splice(fromIdx,1);
        order.splice(toIdx,0,moved);
        await Promise.all(order.map((t,i)=> db.from('rs_proj_tasks').update({position:i}).eq('id',t.id)));
        await refreshProjectView();
      });
    });
  });
}

/* Project type names are user-editable (Settings > Project types), so the
   seed name "Deck projects" isn't guaranteed to survive a rename (e.g. a
   project type renamed to just "Deck") — match loosely on "deck" instead of
   the exact seed string so this extra field keeps working after a rename. */
/* Project type names are user-editable in Settings, so every per-type branch
   must tolerate a rename — matching with `===` against the v1 seed name is
   what silently killed the Deck "Number of slides" field once already. */
function isDeckType(type){ return (type||'').toLowerCase().includes('deck'); }
function isWebsiteType(type){ const t=(type||'').toLowerCase(); return t.includes('website')||t.includes('web site')||t==='web'; }
function isBrandingType(type){ return (type||'').toLowerCase().includes('brand'); }
function isAnimationType(type){ return (type||'').toLowerCase().includes('anim'); }
function projExtraFieldHtml(type, details){
  details = details || {};
  if(isWebsiteType(type)) return `<div><label>Number of pages</label><input type="number" min="1" id="pj_extra_pages" value="${details.pages||''}"></div><div><label>Number of sections</label><input type="number" min="1" id="pj_extra_sections" value="${details.sections||''}"></div>`;
  if(isBrandingType(type)) return `<div><label>Scope</label><select id="pj_extra">${BRANDING_SCOPES.map(s=>`<option value="${s}" ${details.scope===s?'selected':''}>${s}</option>`).join('')}</select></div>`;
  if(isAnimationType(type)) return `<div><label>Length (seconds)</label><input type="number" min="1" id="pj_extra" value="${details.seconds||''}"></div>`;
  if(isDeckType(type)) return `<div><label>Number of slides</label><input type="number" min="1" id="pj_extra" value="${details.slides||''}"></div>`;
  return '<div></div>';
}
function projExtraFieldValue(type){
  if(isWebsiteType(type)){
    const pagesEl = document.getElementById('pj_extra_pages'), sectionsEl = document.getElementById('pj_extra_sections');
    return { pages: pagesEl&&pagesEl.value?+pagesEl.value:null, sections: sectionsEl&&sectionsEl.value?+sectionsEl.value:null };
  }
  const el = document.getElementById('pj_extra');
  if(!el) return {};
  if(isBrandingType(type)) return { scope: el.value || null };
  if(isAnimationType(type)) return { seconds: el.value?+el.value:null };
  if(isDeckType(type)) return { slides: el.value?+el.value:null };
  return {};
}

/* Human-readable summary of a project's type-specific details, e.g. "45s"
   for an animation or "12 slides" for a deck — shown on the project page */
/* N business days after a date, skipping weekends — used for review windows */
function addBusinessDays(dateStr, days){
  let d = new Date(dateStr+'T00:00');
  let count = 0;
  while(count < days){
    d.setDate(d.getDate()+1);
    const dow = d.getDay();
    if(dow!==0 && dow!==6) count++;
  }
  return d;
}
function reviewWindowLabel(dueDateStr, reviewDays){
  if(!dueDateStr || !reviewDays) return null;
  const start = addBusinessDays(dueDateStr, 1);
  const end = addBusinessDays(dueDateStr, reviewDays);
  return `Review ${fmtDate(start)} – ${fmtDate(end)}`;
}

function projectDetailsSummary(p){
  const d = p.details || {};
  if(isWebsiteType(p.project_type)){
    const parts = [d.pages? `${d.pages} page${d.pages===1?'':'s'}`:null, d.sections? `${d.sections} section${d.sections===1?'':'s'}`:null].filter(Boolean);
    return parts.length? parts.join(' · ') : null;
  }
  if(isBrandingType(p.project_type)) return d.scope ? `${d.scope} branding` : null;
  if(isAnimationType(p.project_type)) return d.seconds ? `${d.seconds}s length` : null;
  if(isDeckType(p.project_type)) return d.slides ? `${d.slides} slide${d.slides===1?'':'s'}` : null;
  return null;
}

function buildDiscordCard(project){
  const c = state.clients.find(c=>c.id===project.client_id);
  const stages = state.stages.filter(s=>s.project_id===project.id).sort((a,b)=>a.position-b.position);
  const tasks = state.projTasks.filter(t=>t.project_id===project.id);
  const counts = {Low:0,Medium:0,High:0,Urgent:0};
  tasks.forEach(t=>{ const pr=t.priority||'Medium'; counts[pr]=(counts[pr]||0)+1; });
  const today = iso(new Date());
  const lines = [];
  lines.push(`**${project.name}** — ${c.name}`);
  let typeLine = `Type: ${project.project_type}`;
  const d = project.details||{};
  if(isWebsiteType(project.project_type) && (d.pages||d.sections)) typeLine += ` · ${[d.pages?d.pages+' pages':null, d.sections?d.sections+' sections':null].filter(Boolean).join(', ')}`;
  if(isBrandingType(project.project_type) && d.scope) typeLine += ` (${d.scope})`;
  if(isAnimationType(project.project_type) && d.seconds) typeLine += ` · ${d.seconds}s`;
  if(isDeckType(project.project_type) && d.slides) typeLine += ` · ${d.slides} slides`;
  if(project.label) typeLine += ` · 🏷️ ${project.label}`;
  lines.push(typeLine);
  lines.push(`📋 ${tasks.length} task${tasks.length===1?'':'s'} across ${stages.length} stage${stages.length===1?'':'s'}`);
  const nextDue = stages.filter(s=>s.due_date && s.due_date>=today).sort((a,b)=>a.due_date.localeCompare(b.due_date))[0];
  if(nextDue) lines.push(`📅 Next due: **${nextDue.name}** — ${fmtDateY(new Date(nextDue.due_date+'T00:00'))}`);
  const miroExt = miroExternal(c), miroInt = miroInternal(c);
  if(miroExt) lines.push(`🔗 Miro (external): ${miroExt}`);
  if(miroInt) lines.push(`🔗 Miro (internal): ${miroInt}`);
  lines.push('');
  lines.push('**Stages**');
  stages.forEach(s=>{
    const stTasks = tasks.filter(t=>t.stage_id===s.id);
    const icon = s.due_date && s.due_date < today ? '⚠️' : '▫️';
    lines.push(`${icon} ${s.name}${s.due_date? ` — due ${fmtDate(new Date(s.due_date+'T00:00'))}`:''} (${stTasks.length})`);
  });
  lines.push('');
  lines.push(`**Priorities:** ${counts.Urgent} urgent · ${counts.High} high · ${counts.Medium} medium · ${counts.Low} low`);
  return lines.join('\n');
}

const INTERNAL_COLUMNS = [['assignee','Assignee'],['priority','Priority'],['due','Due'],['department','Department']];
const INTERNAL_COL_WIDTHS = { assignee:170, priority:110, due:110, department:160 };
const INTERNAL_SORT_LABELS = { manual:'Manual', due:'Due date', priority:'Priority', title:'Task name', assignee:'Assignee', department:'Department' };
const INTERNAL_GROUP_LABELS = { none:'None', department:'Department', assignee:'Assignee', priority:'Priority', status:'Status' };
const INTERNAL_PRIORITY_RANK = { Urgent:0, High:1, Medium:2, Low:3 };
function internalGridCols(){
  const cols = ['28px','minmax(200px,1fr)'];
  INTERNAL_COLUMNS.forEach(([key])=>{ if(state.internalCols.has(key)) cols.push(INTERNAL_COL_WIDTHS[key]+'px'); });
  cols.push('40px');
  return cols.join(' ');
}
function internalHeaderHtml(gridCols){
  const cells = INTERNAL_COLUMNS.filter(([k])=>state.internalCols.has(k)).map(([,label])=>`<div>${label}</div>`).join('');
  return `<div class="task-grid-row task-grid-header" style="grid-template-columns:${gridCols}"><div></div><div>Task</div>${cells}<div></div></div>`;
}
function sortInternalTasks(list){
  const arr = list.slice();
  const nameOf = (id, coll)=> id ? (coll.find(x=>x.id===id)?.name || '') : '￿';
  if(state.internalSort==='due') arr.sort((a,b)=> (a.due_date||'9999-99-99').localeCompare(b.due_date||'9999-99-99'));
  else if(state.internalSort==='priority') arr.sort((a,b)=> (INTERNAL_PRIORITY_RANK[a.priority]??2) - (INTERNAL_PRIORITY_RANK[b.priority]??2));
  else if(state.internalSort==='title') arr.sort((a,b)=> a.title.localeCompare(b.title));
  else if(state.internalSort==='assignee') arr.sort((a,b)=> nameOf((a.assignee_ids||[])[0], state.members).localeCompare(nameOf((b.assignee_ids||[])[0], state.members)));
  else if(state.internalSort==='department') arr.sort((a,b)=> nameOf(a.department_id, state.departments).localeCompare(nameOf(b.department_id, state.departments)));
  else arr.sort((a,b)=>(a.position||0)-(b.position||0));
  return arr;
}
function groupInternalTasks(list){
  const groupBy = state.internalGroupBy || 'none';
  if(groupBy==='department'){
    const buckets = departmentList().map(d=>({ label:d.name, tasks:list.filter(t=>t.department_id===d.id) }));
    buckets.push({ label:'No department', tasks:list.filter(t=>!t.department_id) });
    return buckets.filter(g=>g.tasks.length);
  }
  if(groupBy==='assignee'){
    const named = state.members.filter(m=>list.some(t=>(t.assignee_ids||[]).includes(m.id)))
      .map(m=>({ label:m.name, tasks:list.filter(t=>(t.assignee_ids||[]).includes(m.id)) }))
      .sort((a,b)=>a.label.localeCompare(b.label));
    const unassigned = { label:'Unassigned', tasks:list.filter(t=>!(t.assignee_ids||[]).length) };
    return [...named, unassigned].filter(g=>g.tasks.length);
  }
  if(groupBy==='priority'){
    return ['Urgent','High','Medium','Low'].map(p=>({ label:p, tasks:list.filter(t=>(t.priority||'Medium')===p) })).filter(g=>g.tasks.length);
  }
  if(groupBy==='status'){
    return [{ label:'Not done', tasks:list.filter(t=>!t.is_done) }, { label:'Done', tasks:list.filter(t=>t.is_done) }].filter(g=>g.tasks.length);
  }
  return [{ label:null, tasks:list }];
}
function internalTaskRowHtml(t, gridCols, canDrag){
  const dept = t.department_id ? state.departments.find(d=>d.id===t.department_id) : null;
  const cells = [];
  if(state.internalCols.has('assignee')) cells.push(`<div class="inline-editable" data-intassignee="${t.id}" title="Click to assign">${avatarGroupHtml(t.assignee_ids)}</div>`);

  if(state.internalCols.has('due')) cells.push(`<div><button type="button" class="stage-date-btn" data-intdue="${t.id}" style="margin-top:0">${t.due_date? fmtDateNatural(t.due_date):'Set date'}</button></div>`);
  if(state.internalCols.has('department')) cells.push(`<div>${dept
    ? `<button type="button" class="status-pill pill-btn" style="background:${mutedBg(dept.color)};color:${dept.color}" data-intdept="${t.id}">${esc(dept.name)}${PILL_CHEVRON_SVG}</button>`

    <div style="text-align:center"><input type="checkbox" data-intdone="${t.id}" ${t.is_done?'checked':''} style="width:auto" title="Mark done"></div>

    ${cells.join('')}
    <div class="tg-actions"><button type="button" class="btn small ghost menu-dots" data-intdelete="${t.id}" title="Delete task"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="15" height="15"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  </div>`;
}
function renderInternalTasks(){
  const gridCols = internalGridCols();
  const canDrag = state.internalSort==='manual' && state.internalGroupBy==='none';

  }));
  main.querySelectorAll('[data-intdept]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    openDepartmentPopover(el, el.dataset.intdept);
  }));
  main.querySelectorAll('[data-intdelete]').forEach(el=>el.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const t = state.internalTasks.find(t=>t.id===el.dataset.intdelete);
    if(!t) return;
    if(!confirm(`Delete "${t.title}"? This cannot be undone.`)) return;
    const { error } = await db.from('rs_internal_tasks').delete().eq('id', t.id);
    if(error){ toast('Delete failed'); return; }
    toast('Task deleted'); await refreshCurrentView();
  }));
  if(canDrag){
    const ordered = state.internalTasks.slice().sort((a,b)=>(a.position||0)-(b.position||0));
    main.querySelectorAll('.task-row[data-inttask]').forEach(row=>{
      row.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', row.dataset.inttask); e.dataTransfer.effectAllowed='move'; });
      row.addEventListener('dragover', e=>{ e.preventDefault(); row.classList.add('drop-target-row'); });
      row.addEventListener('dragleave', ()=> row.classList.remove('drop-target-row'));
      row.addEventListener('drop', async e=>{
        e.preventDefault(); row.classList.remove('drop-target-row');
        const draggedId = e.dataTransfer.getData('text/plain');
        const targetId = row.dataset.inttask;
        if(!draggedId || draggedId===targetId) return;
        const order = ordered.slice();
        const fromIdx = order.findIndex(t=>t.id===draggedId);
        const toIdx = order.findIndex(t=>t.id===targetId);
        if(fromIdx<0 || toIdx<0) return;
        const [moved] = order.splice(fromIdx,1);
        order.splice(toIdx,0,moved);
        await Promise.all(order.map((t,i)=> db.from('rs_internal_tasks').update({position:i}).eq('id',t.id)));
        await refreshCurrentView();
      });
    });
  }
}

  csv: {

    placeholder:'{"tasks":[{"title":"Restock studio supplies","assignee_names":["Ross Hall","Louis Rush"],"priority":"Low","due_date":"2026-08-15","department_name":"Admin"}]}'

function setInternalImportFormat(fmt){

function openInternalImportModal(){
  showModal(`
    <h3>Import internal tasks</h3>
    <div class="sub" id="intimp_help"></div>
    <div style="display:flex;align-items:center;gap:8px;margin:10px 0">
      <button type="button" class="btn small" data-intimpformat="csv">CSV</button>
      <button type="button" class="btn small ghost" data-intimpformat="json">JSON</button>
      <input type="file" id="intimp_file" accept=".csv,.json,.txt" style="font-size:12px;margin-left:auto">
    </div>
    <textarea id="intimp_text" style="min-height:220px;font-family:ui-monospace,monospace;font-size:11.5px"></textarea>
    <div id="intimp_log" style="margin-top:10px;font-size:12px;color:var(--muted);max-height:200px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="intimp_close">Close</button>
      <div class="right"><button class="btn" id="intimp_run">Run import</button></div>
    </div>
  `);
  setInternalImportFormat('csv');
  document.querySelectorAll('[data-intimpformat]').forEach(b=> b.onclick = ()=> setInternalImportFormat(b.dataset.intimpformat));
  document.getElementById('intimp_file').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      document.getElementById('intimp_text').value = reader.result;
      const ext = file.name.toLowerCase().split('.').pop();
      if(ext==='json') setInternalImportFormat('json');
      else if(ext==='csv') setInternalImportFormat('csv');
    };
    reader.readAsText(file);
  });
  $('#intimp_close').onclick = closeModal;
  $('#intimp_run').onclick = runInternalImport;
}
async function runInternalImport(){
  const logEl = document.getElementById('intimp_log');
  const append = (msg)=>{ logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; };
  const rawText = document.getElementById('intimp_text').value;
  let rows;
  if(_intImportFormat==='json'){
    try{ rows = (JSON.parse(rawText).tasks)||[]; }
    catch(e){ append('❌ Invalid JSON: '+e.message); return; }
    rows = rows.map(t=>({ title:t.title||'', assignee:(t.assignee_names||(t.assignee_name?[t.assignee_name]:[])).join(';'), priority:t.priority||'', due_date:t.due_date||'', department:t.department_name||'', done:t.is_done?'yes':'' }));
  } else {
    rows = parseCsv(rawText).map(r=>({
      title: r.title || r.task || '',
      assignee: r.assignee || r.assignee_name || r.assignees || '',
      priority: r.priority || '',
      due_date: r.due_date || r.due || '',
      department: r.department || r.department_name || '',
      done: r.done || r.is_done || ''
    }));
    if(!rows.length){ append('❌ No rows found — check the header row matches title, assignee, priority, due_date, department'); return; }
  }

  const runBtn = document.getElementById('intimp_run');
  runBtn.disabled = true; runBtn.textContent = 'Importing…';
  logEl.textContent = '';

  const memberByName = {};
  state.members.forEach(m=> memberByName[m.name.trim().toLowerCase()] = m.id);
  const deptByName = {};
  state.departments.forEach(d=> deptByName[d.name.trim().toLowerCase()] = d);
  const existingTitles = new Set(state.internalTasks.map(t=>t.title.trim().toLowerCase()));

  let added=0, skipped=0, errors=0;
  let nextPos = state.internalTasks.length ? Math.max(...state.internalTasks.map(t=>t.position||0))+1 : 0;
  for(const r of rows){
    const title = (r.title||'').trim();
    if(!title) continue;
    const titleKey = title.toLowerCase();
    if(existingTitles.has(titleKey)){ skipped++; continue; }

    let departmentId = null;
    const deptName = (r.department||'').trim();
    if(deptName){
      const key = deptName.toLowerCase();
      if(deptByName[key]) departmentId = deptByName[key].id;
      else{
        const pos = Object.keys(deptByName).length;
        const { data: newDept, error: deErr } = await db.from('rs_departments').insert({ name:deptName, color:PALETTE[pos%PALETTE.length], position:pos }).select().single();
        if(deErr){ append(`❌ Task "${title}": could not create department "${deptName}" — ${deErr.message}`); errors++; continue; }
        deptByName[key] = newDept; departmentId = newDept.id;
        append(`✓ Created department "${deptName}"`);
      }
    }

    const assigneeNames = (r.assignee||'').split(/[;|]/).map(s=>s.trim()).filter(Boolean);
    const assigneeIds = [];
    assigneeNames.forEach(name=>{
      const id = memberByName[name.toLowerCase()];
      if(id) assigneeIds.push(id);
      else append(`⚠ Task "${title}": no team member named "${name}" — skipped for this task`);
    });

    const priority = PRIORITIES.includes(r.priority) ? r.priority : 'Medium';
    const is_done = /^(y|yes|true|1|done)$/i.test((r.done||'').trim());

    const { error } = await db.from('rs_internal_tasks').insert({
      title, assignee_ids: assigneeIds, priority, due_date: r.due_date || null,
      department_id: departmentId, is_done, position: nextPos
    });
    if(error){ append(`❌ Task "${title}": ${error.code==='PGRST204'?'run migration v22 to enable multiple assignees':error.message}`); errors++; continue; }
    existingTitles.add(titleKey); nextPos++; added++;
  }
  append(`\nDone. ${added} task(s) imported${skipped?`, ${skipped} skipped (already existed)`:''}${errors?`, ${errors} error(s)`:''}.`);
  runBtn.disabled = false; runBtn.textContent = 'Run import';
  await refreshCurrentView();
}

/* Minimal RFC4180-ish CSV parser — handles quoted fields (incl. embedded
   commas/newlines/escaped "") without pulling in a library. Returns an array
   of row objects keyed by lower-cased header. */
function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes = false; }
      else field += c;
    } else if(c==='"'){ inQuotes = true; }
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c==='\r'){ /* skip, \n handles the line break */ }
    else field += c;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).filter(r=>r.some(c=>(c||'').trim()!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (r[i]||'').trim());
    return obj;
  });
}

};
function setImportFormat(fmt){
  _importFormat = fmt;
  document.querySelectorAll('[data-impformat]').forEach(b=> b.classList.toggle('ghost', b.dataset.impformat!==fmt));
  document.getElementById('imp_help').textContent = IMPORT_FORMATS[fmt].help;

}
function openImportModal(){
  showModal(`
    <h3>Import data</h3>
    <div class="sub" id="imp_help"></div>
    <div style="display:flex;align-items:center;gap:8px;margin:10px 0">
      <button type="button" class="btn small" data-impformat="json">JSON</button>
      <button type="button" class="btn small ghost" data-impformat="csv">CSV</button>

    </div>

    <div id="imp_log" style="margin-top:10px;font-size:12px;color:var(--muted);max-height:200px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="imp_close">Close</button>
      <div class="right"><button class="btn" id="imp_run">Run import</button></div>
    </div>
  `);
  setImportFormat('json');
  document.querySelectorAll('[data-impformat]').forEach(b=> b.onclick = ()=> setImportFormat(b.dataset.impformat));
  document.getElementById('imp_file').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      document.getElementById('imp_text').value = reader.result;
      const ext = file.name.toLowerCase().split('.').pop();
      if(ext==='csv') setImportFormat('csv');
      else if(ext==='json') setImportFormat('json');
    };
    reader.readAsText(file);
  });
  $('#imp_close').onclick = closeModal;
  $('#imp_run').onclick = runImport;
}

async function runImport(){
  const logEl = document.getElementById('imp_log');
  const append = (msg)=>{ logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; };
  let data;
  const rawText = document.getElementById('imp_text').value;
  if(_importFormat==='csv'){
    const rows = parseCsv(rawText);
    if(!rows.length){ append('❌ No rows found — check the header row matches client_name, title, status, priority, due_date, assignees'); return; }
    data = { tasks: rows.map(r=>({
      client_name: r.client_name || r.client || '',
      title: r.title || r.task || '',
      status: r.status || '',
      priority: r.priority || '',
      due_date: r.due_date || r.due || '',
      assignee_names: (r.assignees || r.assignee || '').split(/[;|]/).map(s=>s.trim()).filter(Boolean)
    })) };
  } else {
    try{ data = JSON.parse(rawText); }
    catch(e){ append('❌ Invalid JSON: '+e.message); return; }
  }

  const runBtn = document.getElementById('imp_run');
  runBtn.disabled = true; runBtn.textContent = 'Importing…';
  logEl.textContent = '';

  const clientNameMap = {};
  state.clients.forEach(c=> clientNameMap[c.name.trim().toLowerCase()] = c.id);
  for(const c of (data.clients||[])){
    const key = (c.name||'').trim().toLowerCase();
    if(!key) continue;
    if(clientNameMap[key]){ append(`↷ Client "${c.name}" already exists — skipped`); continue; }
    const color = CLIENT_PALETTE[Object.keys(clientNameMap).length % CLIENT_PALETTE.length];
    const slug = uniqueSlug(c.name.trim());
    const { data: row, error } = await db.from('rs_clients').insert({ name:c.name.trim(), is_retainer: !!c.is_retainer, color, dash_accent_color:color, slug }).select().single();
    if(error){ append(`❌ Client "${c.name}": ${error.message}`); continue; }
    clientNameMap[key] = row.id;
    append(`✓ Created client "${c.name}"${c.is_retainer?' (retainer)':''}`);
  }

  const memberNameMap = {};
  state.members.forEach(m=> memberNameMap[m.name.trim().toLowerCase()] = m.id);
  for(const m of (data.members||[])){
    const key = (m.name||'').trim().toLowerCase();
    if(!key || memberNameMap[key]) continue;
    const { data: row, error } = await db.from('rs_members').insert({ name:m.name.trim(), weight:1 }).select().single();
    if(error){ append(`❌ Member "${m.name}": ${error.message}`); continue; }
    memberNameMap[key] = row.id;
    append(`✓ Created team member "${m.name}"`);
  }

  let taskCount=0, taskSkipped=0, taskErrors=0;
  const existingTitlesByClient = {};
  state.projTasks.forEach(pt=>{
    if(pt.project_id || !pt.client_id) return;
    (existingTitlesByClient[pt.client_id] = existingTitlesByClient[pt.client_id] || new Set()).add(pt.title.trim().toLowerCase());
  });
  for(const t of (data.tasks||[])){
    const clientId = clientNameMap[(t.client_name||'').trim().toLowerCase()];
    if(!clientId){ append(`❌ Task "${t.title}": no matching client "${t.client_name}"`); taskErrors++; continue; }
    const seen = existingTitlesByClient[clientId] || (existingTitlesByClient[clientId] = new Set());
    const titleKey = (t.title||'').trim().toLowerCase();
    if(seen.has(titleKey)){ taskSkipped++; continue; }
    const status = taskStatusNames().includes(t.status) ? t.status : 'To do';
    const designerIds = (t.assignee_names||[]).map(n=> memberNameMap[(n||'').trim().toLowerCase()]).filter(Boolean);
    const { error } = await db.from('rs_proj_tasks').insert({
      client_id: clientId, project_id: null, stage_id: null, title: t.title,
      status, priority: t.priority || 'Medium', due_date: t.due_date || null,
      assigned_designer_ids: designerIds, assigned_reviewer_ids: [],
      counts_toward_retainer: false, position: taskCount
    });
    if(error){ append(`❌ Task "${t.title}": ${error.message}`); taskErrors++; }
    else { taskCount++; seen.add(titleKey); }
  }
  append(`\nDone. ${taskCount} task(s) imported${taskSkipped?`, ${taskSkipped} skipped (already existed)`:''}${taskErrors?`, ${taskErrors} error(s)`:''}.`);
  runBtn.disabled = false; runBtn.textContent = 'Run import';
  await loadAll();
}

function initColumnResize(){
  let dragging = null;
  document.addEventListener('mousedown', e=>{
    const handle = e.target.closest('[data-resizecol]');
    if(!handle) return;
    e.preventDefault();
    const key = handle.dataset.resizecol;
    const isTasksAhead = handle.dataset.widthstore === 'tasksahead';
    const store = isTasksAhead ? state.tasksAheadColWidths : state.taskColWidths;
    const defaults = isTasksAhead ? TASKSAHEAD_COL_DEFAULTS : TASK_COL_DEFAULTS;
    dragging = { key, store, isTasksAhead, startX: e.clientX, startWidth: store[key] || defaults[key] };
    handle.classList.add('resizing');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const newWidth = Math.max(60, dragging.startWidth + (e.clientX - dragging.startX));
    dragging.store[dragging.key] = newWidth;
    const colsStr = dragging.isTasksAhead ? tasksAheadColumns() : taskGridColumns();
    document.querySelectorAll('.task-grid-row').forEach(row=> row.style.gridTemplateColumns = colsStr);
  });
  document.addEventListener('mouseup', ()=>{
    if(!dragging) return;
    document.querySelectorAll('.col-resize-handle.resizing').forEach(h=>h.classList.remove('resizing'));
    dragging = null;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}
initColumnResize();

/* ================= Animation (Beta) — shot pipeline grid ================= */
/* Animation is tracked per-SHOT, not per-stage. Every shot walks the same
   pipeline steps independently, so the grid below (shots down, steps across)
   makes a single stalled shot immediately visible instead of hiding it
   inside a stage-level "in progress". */

const ANIM_DEFAULT_STEPS = ['Storyboard','Animatic','Blocking','Animation','Render','Comp','Approved'];
/* Editable per-cell pipeline statuses (rs_anim_cell_statuses). `behavior` is the
   semantic flag the rest of the app keys off instead of the display name, so
   renaming/recolouring a status never breaks progress %, flag chips, or the
   overdue/unassigned checks: 'wip' | 'waiting' | 'retake' | 'done' | 'omitted' | 'none'. */
const DEFAULT_ANIM_CELL_STATUSES = [
  { name:'Not started',     color:'#e7e7ee', short:'–',   behavior:'none',    position:0 },
  { name:'In progress',     color:'#4C6EF5', short:'WIP', behavior:'wip',     position:1 },
  { name:'Internal review', color:'#F0B429', short:'IR',  behavior:'none',    position:2 },
  { name:'Client review',   color:'#15AABF', short:'CR',  behavior:'waiting', position:3 },
  { name:'Retakes',         color:'#E8623D', short:'RT',  behavior:'retake',  position:4 },
  { name:'Approved',        color:'#2FB380', short:'✓',   behavior:'done',    position:5 },
  { name:'Omitted',         color:'#cfcfd8', short:'om',  behavior:'omitted', position:6 }
];
function animStatusList(){ return (state.animCellStatuses.length?state.animCellStatuses:DEFAULT_ANIM_CELL_STATUSES).slice().sort((a,b)=>a.position-b.position); }
function animStatusNames(){ return animStatusList().map(s=>s.name); }
function animStatusRecord(name){ return animStatusList().find(s=>s.name===name) || animStatusList()[0]; }
function animStatusBehavior(name){ return animStatusRecord(name)?.behavior || 'none'; }

function animProjects(){
  const cfgNames = state.projectTypes.filter(t=>/anim/i.test(t.name)).map(t=>t.name);
  return state.projects.filter(p=>p.active && (cfgNames.includes(p.project_type) || /anim/i.test(p.project_type)));
}
function animShotsFor(projectId){ return state.animShots.filter(s=>s.project_id===projectId).sort((a,b)=>a.position-b.position); }
function animStepsFor(projectId){ return state.animSteps.filter(s=>s.project_id===projectId).sort((a,b)=>a.position-b.position); }
function animCell(shotId, stepId){ return state.animCells.find(c=>c.shot_id===shotId && c.step_id===stepId) || null; }
function animCellStatus(shotId, stepId){ const c = animCell(shotId, stepId); return c ? c.status : 'Not started'; }

/* A shot's overall position = the last step it has fully approved. */
function animShotProgress(shot, steps){
  let done = 0;
  for(const st of steps){ if(animStatusBehavior(animCellStatus(shot.id, st.id))==='done') done++; else break; }
  return { done, total: steps.length, pct: steps.length? Math.round(done/steps.length*100):0 };
}

function renderAnimation(){
  if(!state.animProjectId || !animProjects().some(p=>p.id===state.animProjectId)){
    state.animProjectId = animProjects()[0]?.id || null;
  }
  const projects = animProjects();
  const p = projects.find(x=>x.id===state.animProjectId) || null;

  let html = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div><h2>Animation <span style="font-size:13px;font-weight:500;color:var(--muted);vertical-align:middle;background:var(--track);padding:3px 9px;border-radius:99px;margin-left:6px">Beta</span></h2></div>
    </div><div style="margin-bottom:18px"></div>`;

  if(!projects.length){
    html += `<div class="empty">No active animation projects. Create a project with an animation type under All Projects and it'll appear here.</div>`;
    main.innerHTML = html;
    return;
  }

  html += `<div class="pd-tabs" style="padding:0;margin-bottom:20px">${projects.map(pr=>{
    const c = state.clients.find(cl=>cl.id===pr.client_id);
    return `<button type="button" class="pd-tab ${pr.id===state.animProjectId?'active':''}" data-animproj="${pr.id}" style="${pr.id===state.animProjectId?`color:var(--accent);border-color:var(--accent)`:''}">${esc(c?c.name:'?')}${pr.label?` · ${esc(pr.label)}`:''}</button>`;
  }).join('')}</div>`;

  const shots = animShotsFor(p.id);
  const steps = animStepsFor(p.id);

  if(!steps.length){
    html += `<div class="banner"><div>🎬</div><div>This project has no pipeline steps yet.
      <button class="btn small" id="animSeed" style="margin-left:8px">Set up default pipeline</button>
      <div style="margin-top:6px;font-size:12px;color:var(--muted)">Creates: ${ANIM_DEFAULT_STEPS.join(' → ')}</div>
    </div></div>`;
    main.innerHTML = html;
    wireAnimTabs();
    $('#animSeed').onclick = async ()=>{
      await Promise.all(ANIM_DEFAULT_STEPS.map((n,i)=> db.from('rs_anim_steps').insert({ project_id:p.id, name:n, position:i })));
      toast('Pipeline created'); await loadAll();
    };
    return;
  }

  /* ---- Health summary: the bit that stops things getting dropped ---- */
  const todayIso = iso(new Date());
  const budget = p.anim_total_seconds!=null ? +p.anim_total_seconds : null;
  const allocated = shots.reduce((n,s)=> n + (s.duration_seconds? +s.duration_seconds : 0), 0);
  const approvedSecs = shots.reduce((n,s)=>{
    const pr = animShotProgress(s, steps);
    return n + (pr.done===steps.length && steps.length ? (s.duration_seconds? +s.duration_seconds:0) : 0);
  }, 0);

  const flags = { retakes:[], overdue:[], clientWait:[], unassigned:[], stalled:[] };
  shots.forEach(s=>{
    steps.forEach(st=>{
      const c = animCell(s.id, st.id);
      if(!c) return;
      if(c.status==='Retakes') flags.retakes.push({s,st,c});
      if(c.status==='Client review') flags.clientWait.push({s,st,c});
      if(c.due_date && c.due_date < todayIso && c.status!=='Approved' && c.status!=='Omitted') flags.overdue.push({s,st,c});
      if(c.status==='In progress' && !c.assignee_id) flags.unassigned.push({s,st,c});
    });
    const pr = animShotProgress(s, steps);
    const anyTouched = steps.some(st=>animCell(s.id,st.id));
    if(!anyTouched && shots.length) flags.stalled.push({s});
  });

  const chip = (label, n, color)=> n? `<span class="status" style="background:${color}22;color:${color};font-weight:600">${n} ${label}</span>` : '';
  html += `<div class="card" style="margin-bottom:18px">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${chip('need retakes', flags.retakes.length, '#E8623D')}
        ${chip('overdue', flags.overdue.length, '#c9372c')}
        ${chip('awaiting client', flags.clientWait.length, '#15AABF')}
        ${chip('unassigned', flags.unassigned.length, '#e08c00')}
        ${chip('not started', flags.stalled.length, '#7b7d92')}
        ${(!flags.retakes.length && !flags.overdue.length && !flags.clientWait.length && !flags.unassigned.length && !flags.stalled.length)? '<span style="font-size:13px;color:var(--green);font-weight:600">✓ Nothing needs attention</span>':''}
      </div>
      <div style="font-size:12.5px;color:var(--muted);text-align:right">
        <div><b style="color:var(--ink)">${allocated}s</b> across ${shots.length} shot${shots.length===1?'':'s'}${budget!=null? ` of ${budget}s contracted`:''}</div>
        <div>${approvedSecs}s fully approved${budget? ` · ${Math.round(approvedSecs/budget*100)}% delivered`:''}</div>
        ${budget!=null && allocated!==budget? `<div style="color:var(--amber);font-weight:600">⚠ shot durations ${allocated>budget?'exceed':'fall short of'} the contracted ${budget}s</div>`:''}
      </div>
    </div>
  </div>`;

  /* ---- The grid ---- */
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <button class="btn small" id="animAddShot">+ Shot</button>
    <button class="btn small ghost" id="animAddStep">+ Pipeline step</button>
    <button class="btn small ghost" id="animSetBudget">${budget!=null?'Edit':'Set'} total seconds</button>
  </div>`;

  if(!shots.length){
    html += `<div class="empty">No shots yet — add your first shot to start building the pipeline grid.</div>`;
  } else {
    html += `<div class="card" style="padding:0;overflow-x:auto">
      <table class="anim-grid" style="min-width:${260 + steps.length*104}px">
        <thead><tr>
          <th style="min-width:210px">Shot</th>
          ${steps.map(st=>`<th style="text-align:center;min-width:96px">${esc(st.name)}<button class="anim-step-del" data-animstepdel="${st.id}" title="Remove step">×</button></th>`).join('')}
          <th style="min-width:64px;text-align:right">Progress</th>
        </tr></thead>
        <tbody>
          ${shots.map(s=>{
            const pr = animShotProgress(s, steps);
            return `<tr>
              <td>
                <div style="display:flex;align-items:center;gap:8px">
                  <b style="font-size:13px">${esc(s.code)}</b>
                  ${s.duration_seconds!=null? `<span style="font-size:11.5px;color:var(--muted)">${s.duration_seconds}s</span>`:''}
                  <button class="btn small ghost" data-animshotedit="${s.id}" style="margin-left:auto">Edit</button>
                </div>
                ${s.description? `<div style="font-size:11.5px;color:var(--muted);margin-top:2px">${esc(s.description)}</div>`:''}
              </td>
              ${steps.map(st=>{
                const c = animCell(s.id, st.id);
                const status = c? c.status : 'Not started';
                const cfg = ANIM_CELL_STATUSES[status] || ANIM_CELL_STATUSES['Not started'];
                const m = c && c.assignee_id ? state.members.find(mm=>mm.id===c.assignee_id) : null;
                const overdue = c && c.due_date && c.due_date < todayIso && status!=='Approved' && status!=='Omitted';
                return `<td style="text-align:center;padding:5px">
                  <button class="anim-cell" data-animcell="${s.id}:${st.id}" title="${esc(status)}${m?' · '+esc(m.name):''}${c&&c.due_date?' · due '+c.due_date:''}"
                    style="background:${cfg.color};color:${cfg.text};${overdue?'box-shadow:inset 0 0 0 2px var(--red)':''}">
                    <span style="font-size:11px;font-weight:700">${cfg.short}</span>
                    ${c && c.version? `<span class="anim-cell-v">v${String(c.version).padStart(3,'0')}</span>`:''}
                    ${c && c.retakes? `<span class="anim-cell-rt">${c.retakes}↻</span>`:''}
                    ${m? `<span class="anim-cell-who">${esc(initials(m.name))}</span>`:''}
                  </button>
                </td>`;
              }).join('')}
              <td style="text-align:right;font-size:12px;color:${pr.pct===100?'var(--green)':'var(--muted)'};font-weight:600">${pr.pct}%</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)">
      ${Object.entries(ANIM_CELL_STATUSES).map(([k,v])=>`<span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:12px;border-radius:3px;background:${v.color};display:inline-block"></span>${esc(k)}</span>`).join('')}
    </div>`;
  }

  main.innerHTML = html;
  wireAnimTabs();
  $('#animAddShot').onclick = ()=> openAnimShotModal(p.id, null);
  $('#animAddStep').onclick = ()=> openAnimStepModal(p.id);
  $('#animSetBudget').onclick = ()=> openAnimBudgetModal(p);
  main.querySelectorAll('[data-animshotedit]').forEach(el=>el.addEventListener('click', ()=> openAnimShotModal(p.id, el.dataset.animshotedit)));
  main.querySelectorAll('[data-animcell]').forEach(el=>el.addEventListener('click', ()=>{
    const [shotId, stepId] = el.dataset.animcell.split(':');
    openAnimCellModal(shotId, stepId);
  }));
  main.querySelectorAll('[data-animstepdel]').forEach(el=>el.addEventListener('click', async (e)=>{
    e.stopPropagation();
    const st = state.animSteps.find(x=>x.id===el.dataset.animstepdel);
    if(!confirm(`Remove the "${st.name}" step from this project? Any statuses recorded against it will be deleted.`)) return;
    const { error } = await db.from('rs_anim_steps').delete().eq('id', st.id);
    if(error){ toast('Could not remove step'); return; }
    toast('Step removed'); await loadAll();
  }));
}

function wireAnimTabs(){
  main.querySelectorAll('[data-animproj]').forEach(el=>el.addEventListener('click', ()=>{ state.animProjectId = el.dataset.animproj; render(); }));
}

function openAnimShotModal(projectId, shotId){
  const s = shotId ? state.animShots.find(x=>x.id===shotId) : { code:'', description:'', duration_seconds:null };
  const isNew = !shotId;
  const existing = animShotsFor(projectId);
  const suggested = `SH${String((existing.length+1)*10).padStart(3,'0')}`;
  showModal(`
    <h3>${isNew?'New shot':'Edit shot'}</h3>
    <form class="log" style="max-width:none">
      <div><label>Shot code</label><input type="text" id="as_code" value="${esc(s.code)}" placeholder="${suggested}"></div>
      <div><label>Duration (seconds)</label><input type="number" step="0.5" min="0" id="as_dur" value="${s.duration_seconds!=null?s.duration_seconds:''}" placeholder="e.g. 4.5"></div>
      <div class="full"><label>Description <span style="color:var(--muted);font-weight:400">(optional)</span></label><input type="text" id="as_desc" value="${esc(s.description||'')}" placeholder="e.g. Hero cell divides, camera pushes in"></div>
    </form>
    <div class="modal-actions">
      ${!isNew? `<button class="btn danger" id="as_delete">Delete shot</button>`:'<span></span>'}
      <div class="right">
        <button class="btn ghost" id="as_cancel">Cancel</button>
        <button class="btn" id="as_save">${isNew?'Add shot':'Save changes'}</button>
      </div>
    </div>
  `);
  $('#as_cancel').onclick = closeModal;
  if(!isNew) $('#as_delete').onclick = async ()=>{
    if(!confirm(`Delete shot ${s.code}? All its pipeline statuses go too. This cannot be undone.`)) return;
    const { error } = await db.from('rs_anim_shots').delete().eq('id', shotId);
    if(error){ toast('Delete failed'); return; }
    closeModal(); toast('Shot deleted'); await loadAll();
  };
  $('#as_save').onclick = async ()=>{
    const code = $('#as_code').value.trim() || suggested;
    const duration_seconds = $('#as_dur').value!=='' ? +$('#as_dur').value : null;
    const description = $('#as_desc').value.trim() || null;
    if(isNew){
      const { error } = await db.from('rs_anim_shots').insert({ project_id:projectId, code, description, duration_seconds, position:existing.length });
      if(error){ toast('Could not add shot'); console.error(error); return; }
      closeModal(); toast('Shot added'); await loadAll();
    } else {
      const { error } = await db.from('rs_anim_shots').update({ code, description, duration_seconds }).eq('id', shotId);
      if(error){ toast('Could not save'); return; }
      closeModal(); toast('Shot updated'); await loadAll();
    }
  };
}
